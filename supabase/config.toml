# ═══════════════════════════════════════════════════════════════
# Supabase CLI 설정
# ═══════════════════════════════════════════════════════════════
# 지금은 대시보드에서 붙여넣어 배포하고 있어서 이 파일이 자동으로 반영되지는 않는다.
# 그래도 남겨 둔다 — CLI 로 배포하는 날 같은 사고를 되풀이하지 않기 위해서다.
#
# taam-sms-hook 만 verify_jwt = false 인 이유
#   Auth 훅은 Supabase JWT 를 보내지 않는다. 대신 Standard Webhooks 서명
#   (webhook-id · webhook-timestamp · webhook-signature)을 보낸다.
#   JWT 검증이 켜져 있으면 함수 코드가 돌기도 전에 게이트웨이가 막아서,
#   Auth 로그에는 "Hook errored out" 만 남고 함수 로그는 텅 빈다.
#   원인을 찾기가 아주 어렵다 — 훅도 함수도 Solapi 도 다 멀쩡해 보인다.
#
#   보안이 약해지지는 않는다. 이 함수는 서명 검증 + 5분 타임스탬프 창으로
#   스스로를 지킨다(SEND_SMS_HOOK_SECRET). JWT 는 이 경로에 맞는 자물쇠가 아니다.
#
#   나머지 함수는 앱이 회원 JWT 를 달고 부르므로 검증을 켠 채로 둔다.

[functions.taam-sms-hook]
verify_jwt = false

# 2026-09-14 점검에서 추가 — Verify JWT 를 끄고 스스로 지키는 함수들 (사유는 각 파일 머리말)
#   line-webhook     : LINE 플랫폼이 부른다. X-Line-Signature(HMAC) 로 검증. LINE_CHANNEL_SECRET 필수.
#   kashikiri-confirm: 링크로 온 비회원 결제 승인. 청구 토큰 + 토스 승인 대조로 검증.
#   verify-invite / consume-invite 는 앱이 anon 으로 부르며 taam_rate_hit 속도 제한 + 초대 대조로 지킨다.
#   ⚠ 그 밖의 함수는 전부 ON. 대시보드에서 OFF 인 함수가 이 목록 밖에 있으면 실수다.
[functions.line-webhook]
verify_jwt = false

[functions.kashikiri-confirm]
verify_jwt = false
