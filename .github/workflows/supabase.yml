# ═══════════════════════════════════════════════════════════════
# Supabase — SQL·Edge Function 자동 배포 (2026-09-15 · 2026-10-19 개정)
# ═══════════════════════════════════════════════════════════════
# 왜 만들었나
#   지금까지 SQL 은 사람이 SQL Editor 에 붙여 넣고, Edge Function 은 대시보드에
#   코드를 붙여 넣어 배포했다. 하루에 열 개를 두 번 붙여 넣는 날이 있었다.
#   main 에 들어온 것이 곧 라이브가 되게 한다 — 앱(Vercel)과 같은 방식으로.
#
# 무엇을 하나 (main 에 supabase/ 가 바뀌어 들어오면)
#   ① .github/scripts/supabase_migrate.sh — supabase/migrations/2*.sql 중 아직 안 돌린 파일을 순서대로 실행한다.
#      어느 파일을 돌렸는지는 public._taam_migrations 에 남긴다(파일 md5 도). 확인 표에 ❌ 가 있으면 실패로 끝내되 기록은 남긴다(같은 파일이 푸시마다 다시 돌아 전체가 막히지 않게).
#      ⚠ 옛 0001~0003 은 손대지 않는다 (라이브 적용 여부가 기록에 없다).
#      ⚠ 원장·잔액 수리처럼 미리보기가 필요한 SQL 은 여기 넣지 말고 sql/ 에 두고 SQL Editor 로.
#   ② .github/scripts/supabase_pick.sh — 이번 푸시(before..sha)에서 바뀐 함수만 배포한다. _shared/ 가 바뀌면 그걸 import 하는 함수만,
#      config.toml 이 바뀌면 [functions.X] 구역이 달라진 함수만. verify_jwt 는 supabase/config.toml 이 정한다 — 대시보드에서 OFF 인 함수는 거기 적혀 있어야 한다.
#      ⚠ functions 칸에 all 을 넣으면 22개 전부 저장소 판으로 덮인다 — 대시보드에서만 손본 함수가 없는지 대조한 뒤에.
#
# 준비 (한 번만) — GitHub → 저장소 → Settings → Secrets and variables → Actions
#   SUPABASE_ACCESS_TOKEN : Supabase → Account → Access Tokens → Generate new token
#   SUPABASE_DB_URL       : Supabase → 프로젝트 → Connect → Session pooler 의 URI
#                           (postgresql://postgres.edfs…:[비밀번호]@aws-0-….pooler.supabase.com:5432/postgres)
#                           ⚠ 직접 연결(db.….supabase.co)은 IPv6 라 GitHub 러너에서 안 붙는다.
#                           ⚠ 비밀번호에 @ : / ? # % 공백이 있으면 퍼센트 인코딩(예: @ → %40)
#   ⚠ 둘 다 열쇠다. 시크릿에만 두고 코드·채팅 어디에도 붙여넣지 않는다.
#   ⚠ 시크릿을 넣기 **전에** sql/migrations_baseline_2026-10-18.sql 을 SQL Editor 로 한 번 돌린다 — 손으로 이미 돌린 파일을
#      _taam_migrations 에 적어 두지 않으면 첫 푸시에서 전부 다시 돌리려 든다(기준선 가드가 멈춰 세운다). 2026-10-18 라이브 완료 ✅.
#
# 시크릿이 없으면 ① 은 건너뛰고 ② 도 돌지 않는다(SQL 먼저 규칙). 손으로 돌리려면 Actions → 이 워크플로 → Run workflow
#   (functions 칸을 비우면 마지막 커밋에서 바뀐 함수만 · all = 전부 · 이름1,이름2 = 그것만).
# ═══════════════════════════════════════════════════════════════
name: Supabase deploy

on:
  push:
    branches: [main]
    paths:
      - 'supabase/functions/**'
      - 'supabase/migrations/**'
      - 'supabase/config.toml'
      - '.github/scripts/supabase_*.sh'
      - '.github/workflows/supabase.yml'
  workflow_dispatch:
    inputs:
      functions:
        description: '배포할 함수 — 비우면 바뀐 것만 · all = 전부(⚠ 대시보드 판을 덮는다) · 이름1,이름2'
        required: false
        default: ''

concurrency:
  group: supabase-deploy
  cancel-in-progress: false

env:
  PROJECT_REF: edfsmzbcixfnqabrsvut
  PGCONNECT_TIMEOUT: '15'

jobs:
  sql:
    name: ① SQL migrations
    runs-on: ubuntu-24.04
    outputs:
      state: ${{ steps.mig.outputs.state }}
    steps:
      - uses: actions/checkout@v4

      - name: 새 마이그레이션 실행
        id: mig
        env:
          SUPABASE_DB_URL: ${{ secrets.SUPABASE_DB_URL }}
          GH_SHA: ${{ github.sha }}
        run: |
          set -euo pipefail
          bash .github/scripts/supabase_migrate.sh | tee /tmp/mig.log
          grep -E '^state=' /tmp/mig.log | tail -1 >> "$GITHUB_OUTPUT"

  functions:
    name: ② Edge Functions
    runs-on: ubuntu-24.04
    needs: sql          # SQL 이 먼저다 — Edge 가 없는 함수를 부르는 사고를 막는다 (CLAUDE.md 「SQL 을 먼저」). ① 이 건너뛰었으면(시크릿 없음) 여기도 안 돈다
    if: needs.sql.outputs.state == 'ok'
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: 배포 대상 정하기
        id: pick
        env:
          WANT: ${{ github.event.inputs.functions }}
          EV: ${{ github.event_name }}
          BEFORE: ${{ github.event.before }}
          SHA: ${{ github.sha }}
        run: |
          set -euo pipefail
          bash .github/scripts/supabase_pick.sh | tee /tmp/pick.log
          grep -E '^list=' /tmp/pick.log | tail -1 >> "$GITHUB_OUTPUT"

      - uses: supabase/setup-cli@v1
        if: steps.pick.outputs.list != ''
        with:
          version: 2.121.0                      # 2026-10-18 확인 판(--use-api 있음). 올릴 때는 커밋으로 — latest 는 검토 없이 바뀐다
          github-token: ${{ github.token }}     # 익명 API 한도에 걸리지 않게

      - name: 함수 배포
        if: steps.pick.outputs.list != ''
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
          LIST: ${{ steps.pick.outputs.list }}
        run: |
          set -euo pipefail
          if [ -z "${SUPABASE_ACCESS_TOKEN:-}" ]; then
            echo "::warning title=Edge 배포 건너뜀::SUPABASE_ACCESS_TOKEN 시크릿이 없다 — 함수는 대시보드에서 직접 배포해야 한다"; exit 0; fi
          fail=0
          for fn in $LIST; do
            [ -f "supabase/functions/$fn/index.ts" ] || { echo "· $fn — index.ts 없음, 건너뜀"; continue; }
            echo "▶ $fn"
            supabase functions deploy "$fn" --project-ref "$PROJECT_REF" --use-api || { echo "❌ $fn 배포 실패"; fail=1; }
          done
          [ $fail = 0 ] && echo "✅ 배포 끝" || exit 1
