# ═══════════════════════════════════════════════════════════════
# main 에 들어온 것을 확실히 배포한다 (2026-08-28)
# ═══════════════════════════════════════════════════════════════
# 왜 만들었나
#   Vercel Git 연동이 main 푸시를 자꾸 놓친다. 브랜치 푸시로 생기는 Preview 는
#   매번 만들어지는데, 머지 커밋에 대한 Production 배포는 아예 생기지 않는
#   일이 반복됐다 (#381~#387 이 통째로 안 올라갔다). 빌드가 실패한 게 아니라
#   트리거가 오지 않았다.
#
#   그때마다 사람이 대시보드에서 「Promote to Production」을 눌러 되살렸다.
#   눌러야만 배포되는 구조는 언젠가 잊는다 — 그리고 그날 회원이 옛 화면을 본다.
#
# 어떻게
#   Vercel 의 Deploy Hook 은 그냥 URL 이다. POST 한 번이면 Production 빌드가
#   시작된다. Git 연동이 놓쳐도 이쪽은 GitHub Actions 가 직접 부르므로 남는다.
#   연동이 정상 동작하면 같은 커밋이라 Vercel 이 알아서 합치거나 두 번 돌 뿐,
#   잘못된 것이 올라가지는 않는다.
#
# 준비 (한 번만)
#   ① Vercel → 프로젝트 → Settings → Git → Deploy Hooks
#      "Create Hook" · 이름 아무거나 · Branch: main → 생성되면 URL 복사
#   ② GitHub → 저장소 → Settings → Secrets and variables → Actions
#      New repository secret · 이름 VERCEL_DEPLOY_HOOK · 값은 그 URL
#
#   ⚠ 그 URL 자체가 열쇠다. 아는 사람은 누구나 배포를 걸 수 있으니
#     시크릿에만 두고 코드·채팅 어디에도 붙여넣지 않는다.
#
# 시크릿이 없으면
#   조용히 건너뛴다. 매 푸시마다 빨간 X 가 뜨면 진짜 실패를 못 알아본다.
# ═══════════════════════════════════════════════════════════════
name: Deploy to Vercel

on:
  push:
    branches: [main]
  workflow_dispatch:        # 손으로도 돌릴 수 있게 — 대시보드까지 안 가도 된다

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      # 🆕 2026.08-30: 어떤 빌드를 내보냈는지 로그에 남긴다.
      #   Deploy Hook 으로 만든 배포는 Vercel 목록에서 커밋에 안 붙는다.
      #   그래서 「배포가 됐나」를 목록만 보고는 알 수 없고, 실제로 그것 때문에
      #   「머지가 안 돌고 있다」고 오해한 적이 있다.
      #   여기에 BUILD 값을 찍어 두면 Actions 로그만 보고 확인할 수 있다.
      - uses: actions/checkout@v4
      - name: Show build number
        run: |
          B=$(grep -o "TAAM_WEB_BUILD = '[^']*'" index.html | head -1 | sed "s/.*'\(.*\)'/\1/")
          echo "이 커밋의 BUILD = ${B:-(못 읽음)}"
          echo "### 배포 BUILD \`${B:-?}\`" >> "$GITHUB_STEP_SUMMARY"
          echo "" >> "$GITHUB_STEP_SUMMARY"
          echo "앱 화면의 BUILD 표시가 이 값과 같으면 최신입니다." >> "$GITHUB_STEP_SUMMARY"

      - name: Trigger Vercel production build
        env:
          HOOK: ${{ secrets.VERCEL_DEPLOY_HOOK }}
        run: |
          if [ -z "$HOOK" ]; then
            echo "VERCEL_DEPLOY_HOOK 이 없습니다 — 배포 트리거를 건너뜁니다."
            echo "설정하려면 이 파일 맨 위의 '준비' 를 보세요."
            exit 0
          fi
          # 실패해도 이유를 알 수 있게 본문과 상태코드를 같이 남긴다
          code=$(curl -sS -X POST "$HOOK" -o /tmp/hook.out -w '%{http_code}')
          echo "HTTP $code"
          cat /tmp/hook.out || true
          echo
          if [ "$code" -lt 200 ] || [ "$code" -ge 300 ]; then
            echo "::error::Deploy Hook 호출 실패 (HTTP $code) — Vercel 대시보드에서 확인하세요."
            exit 1
          fi
          echo "✅ Production 빌드를 걸었습니다."
