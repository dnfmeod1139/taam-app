<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
<meta name="robots" content="noindex, nofollow">
<title>TAAM — 멤버십 심사 신청</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Bodoni+Moda:opsz,wght@6..96,700&family=Noto+Sans+KR:wght@400;500;700&family=Noto+Sans+JP:wght@400;500;700&display=swap" rel="stylesheet">
<!--
  ════════════════════════════════════════════════════════════════
  멤버십 심사 신청 — 공개 페이지 (로그인 없음)
  ════════════════════════════════════════════════════════════════
  ⚠ 이 화면에는 **가격이 한 글자도 없다.** 가격이 처음 공개되는 곳은
    심사를 통과한 사람이 여는 오퍼 페이지다. 여기서 금액을 보여주면
    「심사」가 「판매」가 된다.

  ⚠ 답은 고른 값과 **그때 보여준 문장**을 같이 보낸다. 나중에 선택지
    문구를 고쳐도 옛 신청서가 무엇을 뜻했는지 읽힌다.

  추천 코드는 ?ref= 로 들어와 숨은 값으로 붙는다 — 다시 적게 하지 않는다.
  ⚠ 코드가 틀려도 신청은 그대로 들어간다. 서버가 그렇게 만들어져 있다 —
    오타 하나로 신청 자체가 사라지면 안 된다.
  ════════════════════════════════════════════════════════════════
-->
<style>
:root{
  --ground:#F6F6F7; --card:#FFFFFF;
  --ink:#16161A; --ink-2:#61616B; --ink-3:#9A9AA4;
  --rule:#E6E6EA; --rule-2:#F0F0F3; --line:#D8D8DE;
  --burg:#5E1622; --burg-tx:#8A3242;
  --ok:#2C6B47; --ok-bg:#E6F2EA; --bad:#9B1C1C; --bad-bg:#FDF3F3;
  --shadow:0 1px 2px rgba(22,22,26,.04),0 1px 12px -6px rgba(22,22,26,.14);
}
*{margin:0;padding:0;box-sizing:border-box}
html{-webkit-text-size-adjust:100%}
body{background:var(--ground);color:var(--ink);
  font-family:'Noto Sans KR','Noto Sans JP',system-ui,-apple-system,sans-serif;
  font-size:15px;line-height:1.75;-webkit-font-smoothing:antialiased;
  padding:36px 18px 56px;word-break:keep-all}
.wrap{max-width:400px;margin:0 auto}
.wordmark{font-family:'Bodoni Moda',Didot,serif;font-weight:700;font-size:21px;
  letter-spacing:.28em;color:var(--burg-tx);text-align:center;line-height:1}
h1{margin-top:26px;font-size:19px;font-weight:700;text-align:center;line-height:1.5}
.lead{margin-top:10px;font-size:13.5px;color:var(--ink-2);text-align:center;line-height:1.9}
.ref{margin-top:16px;padding:11px 14px;border-radius:11px;background:var(--ok-bg);
  font-size:12.5px;color:var(--ok);text-align:center;line-height:1.7}
.f{margin-top:22px}
.q{font-size:13.5px;font-weight:700;line-height:1.55}
.q b{color:var(--burg-tx)}
.opts{margin-top:9px;display:grid;gap:7px}
.opt{padding:13px 15px;border:1px solid var(--line);border-radius:12px;background:var(--card);
  font-size:13.5px;line-height:1.5;cursor:pointer;color:var(--ink-2);-webkit-tap-highlight-color:transparent}
.opt.on{border-color:var(--burg);background:rgba(94,22,34,.05);color:var(--ink);font-weight:700}
.in{width:100%;margin-top:9px;padding:13px 14px;border:1px solid var(--line);border-radius:12px;
  background:var(--card);color:var(--ink);font-family:inherit;font-size:15px}
.in::placeholder{color:var(--ink-3)}
.in:focus{outline:none;border-color:var(--burg)}
textarea.in{min-height:82px;resize:vertical;line-height:1.8}
.note{margin-top:7px;font-size:11.5px;color:var(--ink-3);line-height:1.7}
.go{display:block;width:100%;margin-top:28px;padding:16px;border:0;border-radius:13px;
  background:var(--burg);color:#fff;font-family:inherit;font-size:15px;font-weight:700;cursor:pointer}
.go:disabled{opacity:.45;cursor:default}
.err{margin-top:12px;padding:12px 14px;border-radius:11px;background:var(--bad-bg);
  border:1px solid #E7C3C3;font-size:12.5px;color:var(--bad);line-height:1.7}
.fine{margin-top:13px;font-size:11.5px;line-height:1.8;color:var(--ink-3);text-align:center}
.done{margin-top:40px;text-align:center}
.done .ic{font-size:32px;color:var(--ok)}
.done .t{margin-top:14px;font-size:17px;font-weight:700}
.done .d{margin-top:10px;font-size:13.5px;line-height:1.9;color:var(--ink-2)}
.langs{margin-top:34px;display:flex;justify-content:center;gap:6px}
.langs button{padding:6px 13px;border:1px solid var(--rule);border-radius:999px;background:var(--card);
  font-family:inherit;font-size:11.5px;font-weight:700;color:var(--ink-3);cursor:pointer}
.langs button.on{border-color:var(--burg);color:var(--burg-tx)}
</style>
</head>
<body>
<div class="wrap" id="wrap"></div>
<script>
(function(){
  'use strict';
  var SB_URL = 'https://edfsmzbcixfnqabrsvut.supabase.co';
  var SB_KEY = 'sb_publishable_NlJp3lRtSVvkgFGRBesoog_q4XlGEPC';
  var qs = new URLSearchParams(location.search);
  var REF = (qs.get('ref') || '').trim();

  var T = {
    ko:{
      h1:'멤버십 심사 신청',
      lead:'탐은 정원 33인, 단일 등급으로 운영됩니다.<br>모든 신청은 개별 심사를 거칩니다.',
      ref:'추천 코드 <b>{c}</b> 가 함께 접수됩니다.',
      name:'성함', name_ph:'성함',
      q1:'연간 일본 방문 횟수', q1a:'연 3회 이상', q1b:'연 1~2회', q1c:'아직 없음',
      q2:'일정을 정하는 기준', q2a:'레스토랑 예약일에 일정을 맞춘다', q2b:'내 일정에 맞는 곳을 찾는 편이다',
      q3:'1회 디너 지출 규모 (2인 · 주류 포함)',
      q3a:'200만원 이상', q3b:'100~200만원', q3c:'100만원 미만',
      q4:'연령대 · 직업', q4_ph:'40대 · 사업가',
      q5:'기억에 남는 레스토랑 세 곳', q5_ph:'도쿄·서울 무관',
      phone:'연락처', phone_ph:'010-0000-0000', phone_n:'심사 결과 안내에만 사용합니다.',
      go:'심사 신청', going:'보내는 중…',
      fine:'심사 결과는 신청하신 연락처로 개별 안내됩니다.',
      miss:'아직 비어 있는 항목이 있습니다',
      err:'보내지 못했습니다. 잠시 후 다시 시도해 주세요.',
      done_t:'심사 신청이 접수되었습니다',
      done_d:'확인 후 신청하신 연락처로<br>개별 안내드립니다.'
    },
    en:{
      h1:'Membership application',
      lead:'TAAM is limited to 33 members, one tier.<br>Every application is reviewed individually.',
      ref:'Referral code <b>{c}</b> will be included.',
      name:'Full name', name_ph:'Full name',
      q1:'Trips to Japan per year', q1a:'3 or more', q1b:'1 to 2', q1c:'None yet',
      q2:'How you plan a trip', q2a:'I build the trip around the reservation date',
      q2b:'I look for places that fit my dates',
      q3:'Typical spend per dinner (2 people, drinks included)',
      q3a:'KRW 2,000,000 or more', q3b:'KRW 1,000,000 - 2,000,000', q3c:'Under KRW 1,000,000',
      q4:'Age range and occupation', q4_ph:'40s, business owner',
      q5:'Three restaurants you remember', q5_ph:'Anywhere - Tokyo, Seoul, elsewhere',
      phone:'Phone number', phone_ph:'Country code included',
      phone_n:'Used only to send you the outcome.',
      go:'Submit application', going:'Sending...',
      fine:'We will contact you individually at the number you provide.',
      miss:'Some answers are still empty',
      err:'Could not send. Please try again shortly.',
      done_t:'Your application has been received',
      done_d:'We will review it and contact you<br>at the number you provided.'
    },
    ja:{
      h1:'メンバーシップ審査のお申し込み',
      lead:'TAAMは定員33名、単一グレードで運営しております。<br>すべてのお申し込みは個別に審査いたします。',
      ref:'ご推薦コード <b>{c}</b> を添えて承ります。',
      name:'お名前', name_ph:'お名前',
      q1:'年間の日本ご訪問回数', q1a:'年3回以上', q1b:'年1〜2回', q1c:'まだございません',
      q2:'ご予定の立て方', q2a:'店の予約日に合わせて予定を組む', q2b:'自分の予定に合う店を探すほうだ',
      q3:'1回のディナーのご予算 (2名・お酒込み)',
      q3a:'200万ウォン以上', q3b:'100〜200万ウォン', q3c:'100万ウォン未満',
      q4:'年代・ご職業', q4_ph:'40代・経営者',
      q5:'印象に残っているお店を三軒', q5_ph:'東京・ソウル問わず',
      phone:'ご連絡先', phone_ph:'国番号を含めてご記入ください',
      phone_n:'審査結果のご案内にのみ使用いたします。',
      go:'審査を申し込む', going:'送信中…',
      fine:'審査結果はご記入の連絡先に個別にご案内いたします。',
      miss:'未記入の項目がございます',
      err:'送信できませんでした。少し経ってからお試しください。',
      done_t:'お申し込みを承りました',
      done_d:'確認のうえ、ご記入の連絡先に<br>個別にご案内いたします。'
    }
  };
  var LANG = 'ko';
  function t(k){ return (T[LANG] && T[LANG][k]) || T.ko[k] || k; }
  function pickLang(){
    try {
      var q = qs.get('lang'); if(q && T[q]) return q;
      var s = localStorage.getItem('taamApplyLang'); if(s && T[s]) return s;
    } catch(e){}
    var n = String(navigator.language || 'ko').toLowerCase();
    if(n.indexOf('ja') === 0) return 'ja';
    if(n.indexOf('ko') === 0) return 'ko';
    return 'en';
  }
  function esc(s){
    return String(s == null ? '' : s).replace(/[&<>"']/g, function(c){
      return ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'})[c];
    });
  }
  async function rpc(fn, args){
    var res = await fetch(SB_URL + '/rest/v1/rpc/' + fn, {
      method:'POST',
      headers:{ 'Content-Type':'application/json', 'apikey':SB_KEY, 'Authorization':'Bearer ' + SB_KEY },
      body: JSON.stringify(args || {})
    });
    var body = null; try { body = await res.json(); } catch(e){}
    if(!res.ok) throw new Error((body && (body.message || body.hint)) || ('HTTP ' + res.status));
    return body;
  }

  // 질문은 여기 한 곳에만. 서버는 답을 jsonb 로 통째로 받는다.
  var Q = [
    { k:'visits', t:'q1', opts:[['a','q1a'],['b','q1b'],['c','q1c']] },
    { k:'plan',   t:'q2', opts:[['a','q2a'],['b','q2b']] },
    { k:'spend',  t:'q3', opts:[['a','q3a'],['b','q3b'],['c','q3c']] },
    { k:'who',    t:'q4', type:'text', ph:'q4_ph' },
    { k:'places', t:'q5', type:'area', ph:'q5_ph' }
  ];
  var A = {}, NAME = '', PHONE = '', BUSY = false, DONE = false, ERR = '';

  function collect(){
    var n = document.getElementById('nm'), p = document.getElementById('ph');
    if(n) NAME = n.value;
    if(p) PHONE = p.value;
    Q.forEach(function(q){
      if(!q.type) return;
      var el = document.getElementById('q_' + q.k);
      if(el) A[q.k] = el.value;
    });
  }
  window.__pick = function(k, v){ collect(); A[k] = v; render(); };
  window.__lang = function(L){
    collect(); LANG = L;
    try { localStorage.setItem('taamApplyLang', L); } catch(e){}
    document.documentElement.lang = L; render();
  };

  function langBar(){
    return '<div class="langs">' + ['ko','en','ja'].map(function(L){
      return '<button class="' + (LANG === L ? 'on' : '') + '" onclick="__lang(\'' + L + '\')">'
           + ({ko:'한국어',en:'English',ja:'日本語'})[L] + '</button>';
    }).join('') + '</div>';
  }

  function render(){
    document.documentElement.lang = LANG;
    var w = document.getElementById('wrap');
    if(DONE){
      w.innerHTML = '<div class="wordmark">TAAM</div>'
        + '<div class="done"><div class="ic">✓</div>'
        + '<div class="t">' + t('done_t') + '</div>'
        + '<div class="d">' + t('done_d') + '</div></div>' + langBar();
      return;
    }
    var h = '<div class="wordmark">TAAM</div>'
      + '<h1>' + t('h1') + '</h1>'
      + '<div class="lead">' + t('lead') + '</div>'
      + (REF ? '<div class="ref">' + t('ref').replace('{c}', esc(REF)) + '</div>' : '');

    h += '<div class="f"><div class="q">' + t('name') + ' <b>*</b></div>'
       + '<input class="in" id="nm" type="text" value="' + esc(NAME) + '" placeholder="'
       + esc(t('name_ph')) + '"></div>';

    Q.forEach(function(q, i){
      h += '<div class="f"><div class="q">' + (i+1) + '. ' + t(q.t) + '</div>';
      if(!q.type){
        h += '<div class="opts">' + q.opts.map(function(o){
          return '<div class="opt' + (A[q.k] === o[0] ? ' on' : '') + '" '
               + 'onclick="__pick(\'' + q.k + '\',\'' + o[0] + '\')">' + esc(t(o[1])) + '</div>';
        }).join('') + '</div>';
      } else if(q.type === 'area'){
        h += '<textarea class="in" id="q_' + q.k + '" placeholder="' + esc(t(q.ph)) + '">'
           + esc(A[q.k] || '') + '</textarea>';
      } else {
        h += '<input class="in" id="q_' + q.k + '" type="text" placeholder="' + esc(t(q.ph))
           + '" value="' + esc(A[q.k] || '') + '">';
      }
      h += '</div>';
    });

    h += '<div class="f"><div class="q">' + t('phone') + ' <b>*</b></div>'
       + '<input class="in" id="ph" type="tel" inputmode="tel" value="' + esc(PHONE)
       + '" placeholder="' + esc(t('phone_ph')) + '">'
       + '<div class="note">' + t('phone_n') + '</div></div>';

    if(ERR) h += '<div class="err">' + ERR + '</div>';
    h += '<button class="go" id="go" onclick="__go()"' + (BUSY ? ' disabled' : '') + '>'
       + (BUSY ? t('going') : t('go')) + '</button>'
       + '<div class="fine">' + t('fine') + '</div>' + langBar();
    w.innerHTML = h;
  }

  window.__go = async function(){
    if(BUSY) return;
    collect();
    var miss = [];
    if(!String(NAME).trim()) miss.push(t('name'));
    if(String(PHONE).replace(/[^0-9]/g,'').length < 8) miss.push(t('phone'));
    Q.forEach(function(q, i){ if(!String(A[q.k] || '').trim()) miss.push((i+1) + '. ' + t(q.t)); });
    if(miss.length){ ERR = esc(t('miss')) + '<br>' + esc(miss.join(' · ')); render(); return; }
    ERR = ''; BUSY = true; render();
    try {
      // 고른 값 + **그때 보여준 문장**을 같이 보낸다
      var ans = {};
      Q.forEach(function(q){
        var v = A[q.k];
        if(!q.type){
          var o = q.opts.filter(function(x){ return x[0] === v; })[0];
          ans[q.k] = { v:v, label: o ? t(o[1]) : v, q: t(q.t) };
        } else ans[q.k] = { v:v, q: t(q.t) };
      });
      await rpc('taam_mship_apply', {
        p_name: NAME, p_phone: PHONE, p_answers: ans,
        p_lang: LANG, p_referral: REF || null, p_source: 'web'
      });
      DONE = true;
    } catch(e){
      ERR = esc(t('err'));
    } finally { BUSY = false; render(); }
  };

  LANG = pickLang();
  render();
})();
</script>
</body>
</html>
