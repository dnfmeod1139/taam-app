<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
<meta name="robots" content="noindex, nofollow">
<title>TAAM — 결제</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Bodoni+Moda:opsz,wght@6..96,600;6..96,700&family=Noto+Sans+KR:wght@400;500;700&display=swap" rel="stylesheet">
<!--
  ════════════════════════════════════════════════════════════════
  대관 분할 청구 — 링크 결제 (로그인 없음)
  ════════════════════════════════════════════════════════════════
  왜 index.html 안이 아니라 독립 파일인가
    앱 본체는 4.7MB 다. 결제만 하러 온 동행 손님에게 그걸 받게 할 이유가 없다.
    /card · /partner 와 같은 방식으로 이 폴더 하나가 곧 한 화면이다.
    index.html 을 건드리지 않으니 다른 세션과 충돌할 일도 없다.

  금액은 이 페이지가 정하지 않는다
    taam_kashikiri_order_start() 가 DB 의 청구 금액으로 주문번호와 금액을 만들어
    돌려준다. 여기서는 그 값을 그대로 결제창에 넘기기만 한다.
    승인도 kashikiri-confirm 이 DB 금액으로 다시 대조한다 — 두 겹이다.

  ⚠ 이 페이지의 키는 전부 공개 키다 (publishable · live_ck_).
    시크릿 키는 Edge Function 시크릿에만 있다.
  ════════════════════════════════════════════════════════════════
-->
<style>
:root{
  --ground:#F6F6F7; --card:#FFFFFF;
  --ink:#16161A; --ink-2:#61616B; --ink-3:#9A9AA4;
  --rule:#E6E6EA; --rule-2:#F0F0F3;
  --burg:#5E1622; --gold:#8E7133;
  --ok:#2C6B47; --ok-bg:#E6F2EA;
  --warn:#9A5116; --warn-bg:#FBEEE2;
}
*{margin:0;padding:0;box-sizing:border-box}
html{-webkit-text-size-adjust:100%}
body{background:var(--ground);color:var(--ink);
  font-family:'Noto Sans KR',system-ui,-apple-system,sans-serif;
  font-size:15px;line-height:1.75;-webkit-font-smoothing:antialiased;
  padding:26px 16px 56px;word-break:keep-all}
.wrap{max-width:420px;margin:0 auto}

.top{display:flex;align-items:baseline;gap:12px;margin-bottom:20px}
.wordmark{font-family:'Bodoni Moda',Didot,serif;font-weight:700;font-size:20px;
  letter-spacing:.28em;color:var(--burg);line-height:1}
.kind{margin-left:auto;font-size:12.5px;color:var(--ink-3)}

.card{background:var(--card);border:1px solid var(--rule);border-radius:16px;
  padding:22px 20px;box-shadow:0 1px 2px rgba(22,22,26,.04),0 1px 14px -8px rgba(22,22,26,.18)}
.card + .card{margin-top:12px}

.venue{font-size:20px;font-weight:700;letter-spacing:-.02em;line-height:1.35}
.when{margin-top:4px;font-size:13.5px;color:var(--ink-2);font-variant-numeric:tabular-nums}
.share{margin-top:3px;font-size:12.5px;color:var(--ink-3)}

.kv{display:flex;justify-content:space-between;gap:12px;padding:9px 0;
  border-bottom:1px solid var(--rule-2);font-size:14px}
.kv:last-of-type{border-bottom:none}
.kv .k{color:var(--ink-3);flex:none}
.kv .v{text-align:right;font-variant-numeric:tabular-nums}
.kv .v small{display:block;color:var(--ink-3);font-size:11.5px;line-height:1.6}
.tot{display:flex;justify-content:space-between;align-items:baseline;gap:12px;
  margin-top:14px;padding-top:14px;border-top:1.5px solid var(--ink)}
.tot .k{font-size:14px;font-weight:500}
.tot .v{font-family:'Bodoni Moda',serif;font-weight:600;font-size:27px;
  font-variant-numeric:tabular-nums;letter-spacing:-.01em}

label.f{display:block;margin-top:16px;font-size:12.5px;color:var(--ink-3)}
input.f{width:100%;margin-top:6px;padding:13px 14px;border:1px solid var(--rule);
  border-radius:11px;background:var(--card);color:var(--ink);
  font-family:inherit;font-size:16px;line-height:1.4}
input.f:focus{outline:2px solid var(--burg);outline-offset:-1px;border-color:transparent}

button.go{display:block;width:100%;margin-top:18px;padding:16px;border:0;border-radius:12px;
  background:var(--burg);color:#fff;font-family:inherit;font-size:15.5px;font-weight:700;
  letter-spacing:.01em;cursor:pointer}
button.go:disabled{opacity:.4;cursor:default}
button.go:active:not(:disabled){opacity:.85}

.fine{margin-top:12px;font-size:11.5px;line-height:1.75;color:var(--ink-3);text-align:center}
.seller{margin-top:16px;padding-top:14px;border-top:1px solid var(--rule-2);
  font-size:11.5px;line-height:1.8;color:var(--ink-3)}

.state{text-align:center;padding:34px 0 8px}
.state .mk{font-family:'Bodoni Moda',serif;font-size:38px;line-height:1}
.state .mk.ok{color:var(--ok)} .state .mk.no{color:var(--warn)}
.state .t{margin-top:10px;font-size:17px;font-weight:700}
.state .d{margin-top:6px;font-size:13.5px;color:var(--ink-2)}

.funnel{margin-top:12px;background:var(--card);border:1px solid var(--rule);
  border-radius:16px;padding:20px}
.funnel .lb{font-family:'Bodoni Moda',serif;font-size:14px;color:var(--gold);letter-spacing:.04em}
.funnel p{margin-top:8px;font-size:14px;line-height:1.85}
.funnel a{display:block;margin-top:14px;padding:14px;border-radius:12px;text-align:center;
  border:1px solid var(--burg);color:var(--burg);font-weight:700;font-size:14.5px;
  text-decoration:none}

.skel{height:15px;border-radius:6px;background:var(--rule-2);margin:10px 0}
.skel.w60{width:60%} .skel.w40{width:40%}
[hidden]{display:none !important}
</style>
</head>
<body>
<div class="wrap">

  <div class="top">
    <span class="wordmark">TAAM</span>
    <span class="kind" id="kind">결제</span>
  </div>

  <!-- 불러오는 중 -->
  <div class="card" id="load">
    <div class="skel w60"></div><div class="skel"></div><div class="skel w40"></div>
  </div>

  <!-- 결제 전 -->
  <div class="card" id="view" hidden>
    <div class="venue" id="vVenue">—</div>
    <div class="when"  id="vWhen"></div>
    <div class="share" id="vShare"></div>

    <div style="margin-top:16px">
      <div class="kv" id="rowJpy" hidden><span class="k">식사 · 주류</span><span class="v" id="vJpy"></span></div>
      <div class="kv" id="rowFx"  hidden><span class="k">적용 환율</span><span class="v" id="vFx"></span></div>
    </div>
    <div class="tot"><span class="k">결제 금액</span><span class="v" id="vAmt">—</span></div>

    <label class="f" for="nm">결제하시는 분 성함</label>
    <input class="f" id="nm" type="text" autocomplete="name" placeholder="영수증에 남습니다" maxlength="30">

    <button class="go" id="btn" type="button">카드로 결제하기</button>
    <p class="fine" id="fine">토스페이먼츠 결제창으로 이동합니다.</p>

    <div class="seller">
      판매자 : 주식회사 쓰리피프틴 (TAAM) · 사업자등록번호 541-88-03374<br>
      서울특별시 용산구 회나무로28길 41, 2층 202호<br>
      문의 : <a href="mailto:dnfmeod@playtaam.com" style="color:inherit">dnfmeod@playtaam.com</a>
    </div>
  </div>

  <!-- 결과 -->
  <div class="card" id="done" hidden>
    <div class="state">
      <div class="mk ok" id="dMark">✓</div>
      <div class="t"  id="dTitle">결제가 완료되었습니다</div>
      <div class="d"  id="dDesc"></div>
    </div>
    <div style="margin-top:14px">
      <div class="kv"><span class="k">결제 금액</span><span class="v" id="dAmt">—</span></div>
      <div class="kv" id="dRow2" hidden><span class="k">결제 수단</span><span class="v" id="dMethod"></span></div>
    </div>
    <p class="fine" id="dFine" hidden><a id="dReceipt" href="#" target="_blank" rel="noopener" style="color:var(--burg)">영수증 보기</a></p>
  </div>

  <!-- 멤버십 퍼널 — 돈을 낸 직후가 가장 잘 되는 순간이다 -->
  <div class="funnel" id="funnel" hidden>
    <div class="lb">Membership</div>
    <p>오늘 같은 자리, <b>TAAM 멤버는 직접 예약할 수 있습니다.</b><br>
       초대제 멤버십이라 아무나 들어올 수 없습니다.</p>
    <a href="/partner/">TAAM 멤버십 알아보기</a>
  </div>

</div>

<script src="https://js.tosspayments.com/v2/standard"></script>
<script>
(function(){
  'use strict';
  var SB_URL = 'https://edfsmzbcixfnqabrsvut.supabase.co';
  // 공개(publishable) 키 — 앱 본체와 같은 값. 시크릿 키가 아니다.
  var SB_KEY = 'sb_publishable_NlJp3lRtSVvkgFGRBesoog_q4XlGEPC';
  // 일반결제 MID(playtauif6) 클라이언트 키. 브라우저에 노출되는 게 정상인 공개 키.
  var TOSS_CK = 'live_ck_BX7zk2yd8ydNoLGwKnoBrx9POLqK';

  var $ = function(id){ return document.getElementById(id); };
  function show(id, on){ var e = $(id); if(e) e.hidden = !on; }
  function won(n){ return '₩' + (parseInt(n,10)||0).toLocaleString('ko-KR'); }
  function yen(n){ return '¥' + (parseInt(n,10)||0).toLocaleString('ja-JP'); }

  var qs = new URLSearchParams(location.search);
  // /pay/?t=<token>  — 링크는 이 하나로 끝난다
  var TOKEN = (qs.get('t') || qs.get('token') || '').trim();

  // 서버 RPC 호출 (익명). SECURITY DEFINER 함수만 부른다 — 표는 열려 있지 않다.
  async function rpc(fn, args){
    var res = await fetch(SB_URL + '/rest/v1/rpc/' + fn, {
      method:'POST',
      headers:{ 'Content-Type':'application/json', 'apikey':SB_KEY, 'Authorization':'Bearer '+SB_KEY },
      body: JSON.stringify(args || {})
    });
    var body = null;
    try { body = await res.json(); } catch(e){}
    if(!res.ok){
      var msg = (body && (body.message || body.hint)) || ('HTTP ' + res.status);
      throw new Error(msg);
    }
    return body;
  }

  function fail(title, desc){
    show('load', false); show('view', false); show('funnel', false);
    $('dMark').textContent = '!'; $('dMark').className = 'mk no';
    $('dTitle').textContent = title;
    $('dDesc').textContent = desc || '';
    $('dAmt').parentNode.parentNode.hidden = true;
    show('done', true);
  }

  var CH = null;

  function paint(c){
    CH = c;
    $('vVenue').textContent = c.venue_name || '대관';
    var d = String(c.event_date || '');
    var t = String(c.event_time || '').slice(0,5);
    var dt = '';
    if(/^\d{4}-\d{2}-\d{2}$/.test(d)){
      var p = d.split('-');
      var wd = ['일','월','화','수','목','금','토'][new Date(Date.UTC(+p[0],+p[1]-1,+p[2])).getUTCDay()];
      dt = p[0] + '년 ' + (+p[1]) + '월 ' + (+p[2]) + '일 (' + wd + ')';
    } else { dt = d; }
    $('vWhen').textContent = dt + (t ? ' ' + t : '');

    var n = parseInt(c.split_count,10) || 0;
    $('vShare').textContent = (n > 1) ? (n + '인 중 1인 몫 · ' + (c.label || '')) : (c.label || '');

    if(c.amount_jpy){ $('vJpy').textContent = yen(c.amount_jpy); show('rowJpy', true); }
    if(c.fx_rate){
      // numeric(12,4) 라 '9.3500' 으로 온다. 꼬리 0 은 지운다 —
      // 숫자에 군더더기가 붙으면 그 숫자 자체가 덜 믿음직해 보인다.
      var fr = String(c.fx_rate);
      if(fr.indexOf('.') >= 0) fr = fr.replace(/0+$/, '').replace(/\.$/, '');
      $('vFx').innerHTML = '1엔 = ' + fr + '원'
        + (c.fx_note ? '<small>' + String(c.fx_note).replace(/[<>&]/g,'') + '</small>' : '');
      show('rowFx', true);
    }
    $('vAmt').textContent = won(c.amount_krw);
    if(c.expires_at){
      var ed = new Date(c.expires_at);
      if(!isNaN(ed)){
        $('fine').textContent = '토스페이먼츠 결제창으로 이동합니다. 이 링크는 '
          + (ed.getMonth()+1) + '월 ' + ed.getDate() + '일까지 유효합니다.';
      }
    }
    show('load', false); show('view', true);
  }

  function paintPaid(c, extra){
    show('load', false); show('view', false);
    $('dMark').textContent = '✓'; $('dMark').className = 'mk ok';
    $('dTitle').textContent = '결제가 완료되었습니다';
    $('dDesc').textContent  = (c.venue_name || '') + ' · ' + String(c.event_date || '');
    $('dAmt').textContent   = won(c.amount_krw);
    var m = (extra && extra.method) || null;
    if(m){ $('dMethod').textContent = m; show('dRow2', true); }
    var r = (extra && extra.receiptUrl) || c.receipt_url;
    if(r){ $('dReceipt').href = r; show('dFine', true); }
    show('done', true);
    show('funnel', true);
    $('kind').textContent = '결제 완료';
  }

  // ── 결제창에서 돌아온 경우 ──────────────────────────────────
  async function handleReturn(){
    var pk  = qs.get('paymentKey');
    var oid = qs.get('orderId');
    var amt = qs.get('amount');
    if(!pk || !oid) return false;

    $('load').innerHTML = '<div class="state"><div class="mk">…</div>'
      + '<div class="t">결제를 확인하고 있습니다</div>'
      + '<div class="d">창을 닫지 말고 잠시 기다려 주세요</div></div>';

    var res = await fetch(SB_URL + '/functions/v1/kashikiri-confirm', {
      method:'POST',
      headers:{ 'Content-Type':'application/json', 'apikey':SB_KEY, 'Authorization':'Bearer '+SB_KEY },
      body: JSON.stringify({ token:TOKEN, orderId:oid, paymentKey:pk, amount: amt ? Number(amt) : undefined })
    }).then(function(r){ return r.json(); }).catch(function(){ return null; });

    var c = await rpc('taam_kashikiri_charge_public', { p_token: TOKEN }).catch(function(){ return null; });

    if(res && res.ok){
      paintPaid(c || { amount_krw: amt }, res);
    } else if(c && c.status === 'paid'){
      paintPaid(c, null);
    } else {
      fail('결제를 확인하지 못했습니다',
           (res && res.reason) ? String(res.reason)
             : '카드에서 승인이 났다면 곧 반영됩니다. 잠시 후 이 링크를 다시 열어 주세요.');
    }
    // 주소창에서 결제 파라미터를 지운다 — 새로고침으로 같은 확인이 또 돌지 않게
    try { history.replaceState(null, '', location.pathname + '?t=' + encodeURIComponent(TOKEN)); } catch(e){}
    return true;
  }

  // ── 결제 시작 ──────────────────────────────────────────────
  var busy = false;
  async function start(){
    if(busy || !CH) return;
    busy = true;
    var btn = $('btn'); btn.disabled = true; btn.textContent = '결제창을 여는 중…';
    try {
      var name = ($('nm').value || '').trim();
      var ord = await rpc('taam_kashikiri_order_start', { p_token: TOKEN, p_name: name || null });
      if(ord && ord.already_paid){ location.reload(); return; }
      if(ord && ord.blocked){
        fail(ord.blocked === 'expired' ? '유효기간이 지난 링크입니다' : '결제할 수 없는 링크입니다',
             'TAAM 담당자에게 알려주시면 새 링크를 보내드립니다.');
        return;
      }
      if(!ord || !ord.order_id){ throw new Error('주문을 만들지 못했습니다'); }

      var back = location.origin + location.pathname + '?t=' + encodeURIComponent(TOKEN);
      var tp = TossPayments(TOSS_CK);
      // customerKey 없이 — 비회원 결제다 (회원 개념이 없는 일반 카드결제)
      var pay = tp.payment({ customerKey: TossPayments.ANONYMOUS });
      await pay.requestPayment({
        method: 'CARD',
        amount: { currency: 'KRW', value: Number(ord.amount_krw) },
        orderId: ord.order_id,
        orderName: String(ord.order_name || 'TAAM 대관').slice(0, 100),
        successUrl: back,
        failUrl: back + '&pay_fail=1',
        customerName: name || undefined,
        card: { useEscrow:false, flowMode:'DEFAULT', useCardPoint:false, useAppCardOnly:false }
      });
    } catch(e){
      if(e && e.code === 'USER_CANCEL'){ /* 손님이 닫은 것 — 아무 말도 하지 않는다 */ }
      else {
        alert('결제를 시작하지 못했습니다.\n' + ((e && e.message) || '') + '\n\nTAAM 담당자에게 알려주세요.');
      }
    } finally {
      busy = false; btn.disabled = false; btn.textContent = '카드로 결제하기';
    }
  }

  // ── 시작 ───────────────────────────────────────────────────
  (async function(){
    if(!TOKEN){ fail('링크가 올바르지 않습니다', '받으신 링크를 다시 눌러 주세요.'); return; }

    if(qs.get('pay_fail')){
      // 실패로 돌아온 경우 — 조회부터 다시 하고 결제 화면을 보여준다
      try { history.replaceState(null, '', location.pathname + '?t=' + encodeURIComponent(TOKEN)); } catch(e){}
    }
    if(await handleReturn()) return;

    var c = null;
    try { c = await rpc('taam_kashikiri_charge_public', { p_token: TOKEN }); }
    catch(e){ fail('불러오지 못했습니다', '잠시 후 다시 시도해 주세요.'); return; }

    if(!c){ fail('없는 링크입니다', '만료되었거나 취소된 링크입니다. TAAM 담당자에게 문의해 주세요.'); return; }
    if(c.status === 'paid'){ paintPaid(c, null); return; }
    if(c.status === 'cancelled'){ fail('취소된 청구입니다', 'TAAM 담당자에게 문의해 주세요.'); return; }
    if(c.status === 'expired'){ fail('유효기간이 지난 링크입니다', 'TAAM 담당자에게 알려주시면 새 링크를 보내드립니다.'); return; }

    paint(c);
    $('btn').addEventListener('click', start);
  })();
})();
</script>
</body>
</html>
