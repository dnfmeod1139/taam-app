* { box-sizing: border-box; }
body {

/* ── 화면 껍데기 ── */
.scr { width: 390px; height: 844px; display: flex; flex-direction: column;
       background: #f7f5f2; overflow: hidden; position: relative; }
.hd { padding: 54px 20px 16px; border-bottom: 1px solid rgba(0,0,0,.08);
      display: flex; align-items: center; gap: 12px; flex: none; background: #f7f5f2; }
.hd .bk { font-size: 20px; color: #333; }

          text-transform: uppercase; color: #555; }
.hd .rt { margin-left: auto; font-size: 11.5px; font-weight: 700; color: #79736a; }
.hd .tag { font-size: 11px; font-weight: 700; color: #7A5C1E; background: #F7EDD6;
           padding: 5px 11px; border-radius: 8px; }
.mini { border: 1px solid #e0ddd6; background: #fff; color: #7a7570;
        padding: 6px 10px; border-radius: 8px; font-size: 11px; font-weight: 700; }
.bd { flex: 1; overflow: hidden; padding: 13px 14px 0; }
.bar { flex: none; background: #f7f5f2; border-bottom: 1px solid rgba(0,0,0,.06);
       padding: 10px 14px 11px; }

/* ── 하단 탭 바 ── */
.tabs { flex: none; display: flex; background: #fff; border-top: 1px solid #e3dcce; }
.tab { flex: 1; padding: 11px 2px 13px; position: relative; text-align: center;
       font-size: 11.5px; font-weight: 700; color: #a69f94; }
.tab.on { color: #17150f; }
.tab.on:before { content: ''; position: absolute; top: 0; left: 26%; right: 26%;
                 height: 2px; background: #5C0A14; }
.tab .bdg { display: inline-block; min-width: 15px; margin-left: 4px; padding: 0 4px;
            border-radius: 7px; background: #9B1C1C; color: #fff;
            font-family: 'Montserrat', sans-serif; font-size: 9.5px; font-weight: 800;
            line-height: 15px; vertical-align: 1px; }

/* ── 세그먼트 (탭 안의 갈래) ── */
.seg { display: flex; gap: 4px; background: #EFECE6; border-radius: 10px; padding: 3px; }
.seg > div { flex: 1; text-align: center; padding: 8px 4px; border-radius: 8px;
             font-size: 12px; font-weight: 700; color: #79736a; }
.seg > div.on { background: #fff; color: #17150f;
                box-shadow: 0 1px 3px rgba(0,0,0,.07); }

/* ── 검색칸 ── */
.q input, .q { width: 100%; padding: 9px 12px; border: 1.5px solid #e0ddd6;
               border-radius: 9px; background: #fff; font-size: 12.5px; color: #a69f94; }

/* ── 주간 스트립 (.tb-week) ── */
.wk { display: grid; grid-template-columns: repeat(7, 1fr); gap: 3px; }
.wk > div { border: 1px solid transparent; border-radius: 9px; padding: 5px 0 6px;
            text-align: center; }
.wk .w { font-size: 9.5px; font-weight: 700; color: #a69f94; }
.wk .n { font-size: 13px; font-weight: 800; color: #46413a; margin-top: 1px; }
.wk .c { display: inline-block; font-size: 9px; font-weight: 800; line-height: 13px;
         min-width: 13px; height: 13px; border-radius: 7px; background: #EFECE6;
         color: #79736a; margin-top: 3px; }
.wk .sel { background: #17150f; border-color: #17150f; }
.wk .sel .w, .wk .sel .n { color: #faf8f3; }
.wk .sel .c { background: rgba(255,255,255,.22); color: #faf8f3; }
.wk .tdy .n { color: #5C0A14; }

/* ── 카드 ── */
.card { background: #fff; border: 1px solid #e3dcce; border-radius: 11px; padding: 11px 13px; }
.grp { font-size: 10.5px; font-weight: 800; letter-spacing: .16em; color: #a69f94;
       margin: 18px 2px 8px; }
.grp:first-child { margin-top: 2px; }
.row { display: flex; align-items: center; gap: 11px; background: #fff;
       border: 1px solid #e3dcce; border-radius: 11px; padding: 13px 14px; }
.row .t { flex: 1; min-width: 0; font-size: 13.5px; font-weight: 700; line-height: 1.45; }
.row .t small { display: block; font-size: 11px; font-weight: 400; color: #79736a; margin-top: 2px; }
.row .chev { flex: none; color: #c4bdb2; font-size: 14px; }
.stack { display: flex; flex-direction: column; gap: 7px; }

/* ── 예약 줄 (.tb-rsv) ── */
.rsv { display: grid; grid-template-columns: 52px minmax(0,1fr); gap: 12px;
       background: #fff; border: 1px solid #e3dcce; border-radius: 12px; padding: 12px 13px; }
.rsv .tm { font-size: 15px; font-weight: 800; }
.rsv .tm small { display: block; font-size: 10px; font-weight: 600; color: #a69f94; }
.rsv .st { font-size: 13.5px; font-weight: 800; line-height: 1.4; }
.rsv .gu { font-size: 12.5px; color: #46413a; margin-top: 2px; }
.rsv.next { border-color: #5C0A14; box-shadow: 0 0 0 1px #5C0A14; }
.rsv .now { font-size: 9.5px; font-weight: 800; letter-spacing: .1em;
            color: #5C0A14; margin-bottom: 3px; }

/* ── 상태 알약 ── */
.pill { display: inline-block; font-size: 10px; font-weight: 800; padding: 2px 7px;
        border-radius: 6px; margin-top: 6px; }
.p-paid { color: #1E6F44; background: #E6F1EA; }
.p-wait { color: #8A6216; background: #FAF0DA; }
.p-cx   { color: #7A736A; background: #EFECE6; }
.p-live { color: #1E6F44; background: #E6F1EA; }
.p-hide { color: #8A6216; background: #FAF0DA; }
.p-sold { color: #9B1C1C; background: #FBEBE9; }

/* ── 등급 배지 ── */
.tier { display: inline-block; font-size: 10px; font-weight: 800; letter-spacing: .06em;
        padding: 2px 8px; border-radius: 6px; }
.t-M { color: #7A5C1E; background: #F7EDD6; }
.t-T { color: #46413A; background: #EFECE6; }

/* ── 좌석 게이지 (.tkb-bar) ── */
.gauge { display: flex; align-items: center; gap: 9px; margin-top: 9px; }
.gauge .g { flex: 1; height: 6px; border-radius: 3px; background: #eae5da; overflow: hidden; }
.gauge .g i { display: block; height: 100%; background: #B08D4F; border-radius: 3px; }
.gauge .g i.full { background: #9B1C1C; }
.gauge .n { font-size: 11px; font-weight: 700; color: #79736a; }
.gauge .n b { color: #17150f; }

/* ── 내 정보 카드 (.ac-me) ── */
.me { background: #17150f; border-radius: 14px; padding: 15px 17px; }
.me .n { font-size: 15px; font-weight: 800; color: #faf8f3; }
.me .s { font-size: 11.5px; color: #a69f94; margin-top: 3px; }
.me .b { display: flex; align-items: baseline; justify-content: space-between;
         margin-top: 12px; padding-top: 11px; border-top: 1px solid rgba(255,255,255,.13); }
.me .bl { font-size: 10px; font-weight: 800; letter-spacing: .14em; color: #a69f94; }
.me .bv { font-size: 19px; font-weight: 600; color: #faf8f3; }
.me .tg { display: inline-block; margin-left: 7px; padding: 2px 8px; border-radius: 6px;
          background: #5d1622; font-size: 9.5px; font-weight: 900; letter-spacing: .1em;
          color: #fff; vertical-align: 1px; }

/* ── FAB ── */
.fab { position: absolute; right: 16px; bottom: 70px; width: 56px; height: 56px;
       border-radius: 50%; background: #5C0A14; color: #fff; font-size: 26px;
       display: flex; align-items: center; justify-content: center;
       box-shadow: 0 6px 18px rgba(92,10,20,.32); }
