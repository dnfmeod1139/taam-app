<!doctype html>
<html>
<head>
  <meta charset="utf-8">
  <script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Oswald:wght@300;400;500;600;700&family=Noto+Sans+KR:wght@400;500;700;900&family=Montserrat:wght@700;800&display=swap">
  <style>
/* TAAM 관리자 — 앱 index.html 에서 그대로 가져온 토큰
   Oswald + Noto Sans KR (--font-main), 숫자는 Montserrat
   바탕 #f7f5f2 · 카드 #fff · 먹 #17150f · 버건디 #5C0A14 · 선 #e3dcce */
* { box-sizing: border-box; }
body {
  margin: 0;
  font-family: 'Oswald', 'Noto Sans KR', 'Noto Sans JP', sans-serif;
  background: #f7f5f2; color: #17150f;
  -webkit-font-smoothing: antialiased;
}
a { color: #5C0A14; } a:hover { color: #9B1C1C; }

/* ── 화면 껍데기 ── */
.scr { width: 390px; height: 844px; display: flex; flex-direction: column;
       background: #f7f5f2; overflow: hidden; position: relative; }
.hd { padding: 54px 20px 16px; border-bottom: 1px solid rgba(0,0,0,.08);
      display: flex; align-items: center; gap: 12px; flex: none; background: #f7f5f2; }
.hd .bk { font-size: 20px; color: #333; }
.hd .ti { font-size: 11px; font-weight: 700; letter-spacing: .25em;
          text-transform: uppercase; color: #555; }
.hd .rt { margin-left: auto; font-size: 11.5px; font-weight: 700; color: #79736a; }
.hd .tag { font-size: 11px; font-weight: 700; color: #7A5C1E; background: #F7EDD6;
           padding: 5px 11px; border-radius: 8px; }
.mini { border: 1px solid #e0ddd6; background: #fff; color: #7a7570;
        padding: 6px 10px; border-radius: 8px; font-size: 11px; font-weight: 700; }
.bd { flex: 1; overflow: hidden; padding: 13px 14px 0; }
.bar { flex: none; background: #f7f5f2; border-bottom: 1px solid rgba(0,0,0,.06);
       padding: 10px 14px 11px; }

/* ── 하단 탭 바 ── */
.tabs { flex: none; display: flex; background: #fff; border-top: 1px solid #e3dcce; }
.tab { flex: 1; padding: 11px 2px 13px; position: relative; text-align: center;
       font-size: 11.5px; font-weight: 700; color: #a69f94; }
.tab.on { color: #17150f; }
.tab.on:before { content: ''; position: absolute; top: 0; left: 26%; right: 26%;
                 height: 2px; background: #5C0A14; }
.tab .bdg { display: inline-block; min-width: 15px; margin-left: 4px; padding: 0 4px;
            border-radius: 7px; background: #9B1C1C; color: #fff;
            font-family: 'Montserrat', sans-serif; font-size: 9.5px; font-weight: 800;
            line-height: 15px; vertical-align: 1px; }

/* ── 세그먼트 (탭 안의 갈래) ── */
.seg { display: flex; gap: 4px; background: #EFECE6; border-radius: 10px; padding: 3px; }
.seg > div { flex: 1; text-align: center; padding: 8px 4px; border-radius: 8px;
             font-size: 12px; font-weight: 700; color: #79736a; }
.seg > div.on { background: #fff; color: #17150f;
                box-shadow: 0 1px 3px rgba(0,0,0,.07); }

/* ── 검색칸 ── */
.q input, .q { width: 100%; padding: 9px 12px; border: 1.5px solid #e0ddd6;
               border-radius: 9px; background: #fff; font-size: 12.5px; color: #a69f94; }

/* ── 주간 스트립 (.tb-week) ── */
.wk { display: grid; grid-template-columns: repeat(7, 1fr); gap: 3px; }
.wk > div { border: 1px solid transparent; border-radius: 9px; padding: 5px 0 6px;
            text-align: center; }
.wk .w { font-size: 9.5px; font-weight: 700; color: #a69f94; }
.wk .n { font-size: 13px; font-weight: 800; color: #46413a; margin-top: 1px; }
.wk .c { display: inline-block; font-size: 9px; font-weight: 800; line-height: 13px;
         min-width: 13px; height: 13px; border-radius: 7px; background: #EFECE6;
         color: #79736a; margin-top: 3px; }
.wk .sel { background: #17150f; border-color: #17150f; }
.wk .sel .w, .wk .sel .n { color: #faf8f3; }
.wk .sel .c { background: rgba(255,255,255,.22); color: #faf8f3; }
.wk .tdy .n { color: #5C0A14; }

/* ── 카드 ── */
.card { background: #fff; border: 1px solid #e3dcce; border-radius: 11px; padding: 11px 13px; }
.grp { font-size: 10.5px; font-weight: 800; letter-spacing: .16em; color: #a69f94;
       margin: 18px 2px 8px; }
.grp:first-child { margin-top: 2px; }
.row { display: flex; align-items: center; gap: 11px; background: #fff;
       border: 1px solid #e3dcce; border-radius: 11px; padding: 13px 14px; }
.row .t { flex: 1; min-width: 0; font-size: 13.5px; font-weight: 700; line-height: 1.45; }
.row .t small { display: block; font-size: 11px; font-weight: 400; color: #79736a; margin-top: 2px; }
.row .chev { flex: none; color: #c4bdb2; font-size: 14px; }
.stack { display: flex; flex-direction: column; gap: 7px; }

/* ── 예약 줄 (.tb-rsv) ── */
.rsv { display: grid; grid-template-columns: 52px minmax(0,1fr); gap: 12px;
       background: #fff; border: 1px solid #e3dcce; border-radius: 12px; padding: 12px 13px; }
.rsv .tm { font-size: 15px; font-weight: 800; }
.rsv .tm small { display: block; font-size: 10px; font-weight: 600; color: #a69f94; }
.rsv .st { font-size: 13.5px; font-weight: 800; line-height: 1.4; }
.rsv .gu { font-size: 12.5px; color: #46413a; margin-top: 2px; }
.rsv.next { border-color: #5C0A14; box-shadow: 0 0 0 1px #5C0A14; }
.rsv .now { font-size: 9.5px; font-weight: 800; letter-spacing: .1em;
            color: #5C0A14; margin-bottom: 3px; }

/* ── 상태 알약 ── */
.pill { display: inline-block; font-size: 10px; font-weight: 800; padding: 2px 7px;
        border-radius: 6px; margin-top: 6px; }
.p-paid { color: #1E6F44; background: #E6F1EA; }
.p-wait { color: #8A6216; background: #FAF0DA; }
.p-cx   { color: #7A736A; background: #EFECE6; }
.p-live { color: #1E6F44; background: #E6F1EA; }
.p-hide { color: #8A6216; background: #FAF0DA; }
.p-sold { color: #9B1C1C; background: #FBEBE9; }

/* ── 등급 배지 ── */
.tier { display: inline-block; font-size: 10px; font-weight: 800; letter-spacing: .06em;
        padding: 2px 8px; border-radius: 6px; }
.t-M { color: #7A5C1E; background: #F7EDD6; }
.t-T { color: #46413A; background: #EFECE6; }

/* ── 좌석 게이지 (.tkb-bar) ── */
.gauge { display: flex; align-items: center; gap: 9px; margin-top: 9px; }
.gauge .g { flex: 1; height: 6px; border-radius: 3px; background: #eae5da; overflow: hidden; }
.gauge .g i { display: block; height: 100%; background: #B08D4F; border-radius: 3px; }
.gauge .g i.full { background: #9B1C1C; }
.gauge .n { font-size: 11px; font-weight: 700; color: #79736a; }
.gauge .n b { color: #17150f; }

/* ── 내 정보 카드 (.ac-me) ── */
.me { background: #17150f; border-radius: 14px; padding: 15px 17px; }
.me .n { font-size: 15px; font-weight: 800; color: #faf8f3; }
.me .s { font-size: 11.5px; color: #a69f94; margin-top: 3px; }
.me .b { display: flex; align-items: baseline; justify-content: space-between;
         margin-top: 12px; padding-top: 11px; border-top: 1px solid rgba(255,255,255,.13); }
.me .bl { font-size: 10px; font-weight: 800; letter-spacing: .14em; color: #a69f94; }
.me .bv { font-size: 19px; font-weight: 600; color: #faf8f3; }
.me .tg { display: inline-block; margin-left: 7px; padding: 2px 8px; border-radius: 6px;
          background: #5d1622; font-size: 9.5px; font-weight: 900; letter-spacing: .1em;
          color: #fff; vertical-align: 1px; }

/* ── FAB ── */
.fab { position: absolute; right: 16px; bottom: 70px; width: 56px; height: 56px;
       border-radius: 50%; background: #5C0A14; color: #fff; font-size: 26px;
       display: flex; align-items: center; justify-content: center;
       box-shadow: 0 6px 18px rgba(92,10,20,.32); }

/* ═══ 슈퍼어드민 요약·분석 전용 (2026-08-31) ═══ */

/* 처리할 일 — 있을 때만 나온다. 없으면 카드 자체가 없다 */
.todo { background:#fff; border:1px solid #e3dcce; border-radius:12px; overflow:hidden; }
.todo > div { display:flex; align-items:center; gap:11px; padding:12px 14px;
              border-bottom:1px solid #f2eee5; }
.todo > div:last-child { border-bottom:0; }
.todo .t { flex:1; font-size:13px; font-weight:700; }
.todo .n { font-family:'Montserrat',sans-serif; font-size:11px; font-weight:800;
           color:#fff; background:#9B1C1C; border-radius:7px; padding:1px 7px; }
.todo .n.warn { color:#8A6216; background:#FAF0DA; }

/* 요약 카드 — 한 축(회원·돈·티켓·파트너)당 하나 */
.sum { background:#fff; border:1px solid #e3dcce; border-radius:12px; padding:13px 14px; }
.sum .hd { display:flex; align-items:baseline; gap:8px; }
.sum .hd b { flex:1; font-size:11px; font-weight:800; letter-spacing:.16em; color:#a69f94; }
.sum .hd .v { font-family:'Oswald','Noto Sans KR',sans-serif; font-size:21px;
              font-weight:600; color:#17150f; letter-spacing:.01em; }
.sum .hd .u { font-size:11.5px; font-weight:700; color:#79736a; }
.sum .sub { display:flex; flex-wrap:wrap; gap:6px; margin-top:10px; }
.sum .chev { flex:none; color:#c4bdb2; font-size:14px; margin-left:2px; }

/* 작은 조각 — 「M 31」 처럼. 누르면 그 명단으로 간다 */
.bit { display:inline-flex; align-items:baseline; gap:5px; padding:5px 10px;
       border:1px solid #e3dcce; border-radius:8px; background:#fcfaf5;
       font-size:11.5px; font-weight:700; color:#46413a; }
.bit b { font-family:'Montserrat',sans-serif; font-size:12px; font-weight:800; color:#17150f; }
.bit.warn { border-color:#F2D5D1; background:#FBEBE9; color:#9B1C1C; }
.bit.warn b { color:#9B1C1C; }
.bit.mute { color:#a69f94; } .bit.mute b { color:#79736a; }

/* 가로 비율 막대 — 축도 눈금도 없다. 비율만 */
.split { display:flex; height:8px; border-radius:4px; overflow:hidden;
         background:#eae5da; margin-top:10px; }
.split i { display:block; height:100%; }

/* 분석 한 줄 — 제목 + 값들. 블록당 정확히 한 덩어리 */
.an { background:#fff; border:1px solid #e3dcce; border-radius:12px; padding:13px 14px; }
.an .k { font-size:11px; font-weight:800; letter-spacing:.16em; color:#a69f94; }
.an .rows { margin-top:10px; display:flex; flex-direction:column; gap:8px; }
.an .r { display:flex; align-items:center; gap:9px; }
.an .r .lb { flex:none; width:64px; font-size:12px; font-weight:700; color:#46413a; }
.an .r .g { flex:1; height:7px; border-radius:4px; background:#eae5da; overflow:hidden; }
.an .r .g i { display:block; height:100%; border-radius:4px; }
.an .r .nu { flex:none; font-family:'Montserrat',sans-serif; font-size:11.5px;
             font-weight:800; color:#17150f; min-width:34px; text-align:right; }
.an .r .pc { flex:none; font-size:10.5px; font-weight:700; color:#a69f94;
             min-width:30px; text-align:right; }

/* 막대 스파크 — 가입 추이. 라이브러리 없이 div 로 */
.spark { display:flex; align-items:flex-end; gap:5px; height:44px; margin-top:11px; }
.spark div { flex:1; background:#dcd5c6; border-radius:3px 3px 0 0; position:relative; }
.spark div.on { background:#5C0A14; }
.spark .lab { display:flex; gap:5px; margin-top:6px; }
.spark-x { display:flex; gap:5px; margin-top:5px; }
.spark-x span { flex:1; text-align:center; font-size:9.5px; font-weight:700; color:#a69f94; }

/* ═══ 접근 제어 · 공개 대상 (2026-08-31) ═══ */

/* 고르는 알약 — 켜고 끈다. 조건을 손으로 조립하는 자리 */
.pk { display:inline-flex; align-items:center; gap:6px; padding:8px 13px;
      border:1.5px solid #e0ddd6; border-radius:10px; background:#fff;
      font-size:12.5px; font-weight:700; color:#79736a; }
.pk b { font-family:'Montserrat',sans-serif; font-size:11.5px; font-weight:800; color:#a69f94; }
.pk.on { border-color:#17150f; background:#17150f; color:#faf8f3; }
.pk.on b { color:#D9BC85; }
.pk.lock { border-style:dashed; border-color:#F2D5D1; background:#FBEBE9; color:#9B1C1C; }
.pk.lock b { color:#9B1C1C; }
.pks { display:flex; flex-wrap:wrap; gap:7px; margin-top:9px; }

/* 라디오 줄 — 셋 중 하나 */
.opt { display:flex; align-items:flex-start; gap:11px; background:#fff;
       border:1.5px solid #e3dcce; border-radius:12px; padding:13px 14px; }
.opt.on { border-color:#17150f; }
.opt .dot { flex:none; width:17px; height:17px; border-radius:50%;
            border:1.5px solid #d0c9bc; margin-top:1px; }
.opt.on .dot { border-color:#17150f; border-width:5px; }
.opt .tx { flex:1; min-width:0; }
.opt .tx b { display:block; font-size:13.5px; font-weight:800; }
.opt .tx small { display:block; font-size:11.5px; font-weight:400; color:#79736a; margin-top:3px; }
.opt .rt { flex:none; font-family:'Montserrat',sans-serif; font-size:12px;
           font-weight:800; color:#a69f94; }
.opt.on .rt { color:#5C0A14; }

/* 제한 걸린 회원 한 줄 */
.blk { display:flex; align-items:center; gap:10px; background:#fff;
       border:1px solid #F2D5D1; border-radius:11px; padding:12px 13px; }
.blk .tx { flex:1; min-width:0; }
.blk .tx b { display:block; font-size:13px; font-weight:800; }
.blk .tx small { display:block; font-size:11px; color:#9B1C1C; margin-top:3px; }
.blk .un { flex:none; border:1px solid #e0ddd6; background:#fff; border-radius:8px;
           padding:6px 11px; font-size:11.5px; font-weight:700; color:#79736a; }

/* 결과 띠 — 「지금 조건이면 몇 명이 본다」 */
.res { display:flex; align-items:center; gap:11px; background:#17150f;
       border-radius:12px; padding:14px 16px; color:#faf8f3; }
.res .n { font-family:'Oswald','Noto Sans KR',sans-serif; font-size:24px; font-weight:600; }
.res .l { flex:1; font-size:12.5px; color:#a69f94; line-height:1.55; }
.res .go { flex:none; border:1px solid rgba(255,255,255,.28); border-radius:9px;
           padding:8px 12px; font-size:11.5px; font-weight:700; color:#faf8f3; }

/* 더하기 줄 */
.add { display:flex; align-items:center; justify-content:center; gap:6px;
       border:1.5px dashed #d8d2c6; border-radius:11px; padding:13px;
       font-size:12.5px; font-weight:700; color:#79736a; background:#fcfaf5; }
.t-P { color:#3A5A6B; background:#E7EFF4; }
.rule { display:flex; align-items:center; gap:10px; background:#fff;
        border:1px solid #e3dcce; border-radius:11px; padding:12px 13px; }
.rule .lb { flex:none; width:62px; font-size:12.5px; font-weight:800; color:#17150f; }
.rule .df { flex:1; font-size:12px; color:#79736a; }
.rule .ed { flex:none; border:1px solid #e0ddd6; border-radius:8px; padding:5px 10px;
            font-size:11px; font-weight:700; color:#79736a; background:#fcfaf5; }
  </style>
</helmet>
<div class="scr">

  <div class="hd">
    <div class="ti">대시보드</div>
    <div style="margin-left:auto;"><div class="mini">2026. 8월 ▾</div></div>
  </div>

  <div class="bd" style="padding-top:13px;">

    <!-- 처리할 일 — 없으면 이 카드가 통째로 사라진다.
         「0건」을 보여주려고 자리를 잡아두지 않는다 -->
    <div class="grp" style="margin-top:0;">처리할 일 <span style="color:#9B1C1C;">6</span></div>
    <div class="todo">
      <div><span class="t">티켓 업로드 승인</span><span class="n">2</span><span style="color:#c4bdb2;font-size:14px;">›</span></div>
      <div><span class="t">예치금 입금 확인</span><span class="n warn">3</span><span style="color:#c4bdb2;font-size:14px;">›</span></div>
      <div><span class="t">파트너 예약 요청</span><span class="n">1</span><span style="color:#c4bdb2;font-size:14px;">›</span></div>
    </div>

    <div class="grp">티켓</div>
    <div class="sum">
      <div class="hd">
        <b>판매중</b>
        <span class="v">8</span><span class="u">건</span>
        <span class="chev">›</span>
      </div>
      <div class="split">
        <i style="width:65%;background:#B08D4F;"></i>
      </div>
      <div style="display:flex;align-items:baseline;justify-content:space-between;margin-top:7px;">
        <span style="font-size:11.5px;font-weight:700;color:#79736a;">좌석 <b style="font-family:'Montserrat',sans-serif;color:#17150f;">34</b>/52</span>
        <span style="font-size:11.5px;font-weight:700;color:#79736a;">65%</span>
      </div>
      <div class="sub">
        <span class="bit">오픈예정 <b>3</b></span>
        <span class="bit mute">보관 <b>3</b></span>
        <span class="bit warn">매진 <b>2</b></span>
      </div>
      <div style="font-size:11.5px;color:#79736a;border-top:1px solid #efe9dc;padding-top:9px;margin-top:11px;">
        다음 오픈 <b style="color:#17150f;font-weight:800;">9/7 (토)</b> · 스시 코바야시
      </div>
    </div>

    <div class="grp">예치금</div>
    <div class="sum">
      <div class="hd">
        <b>총 잔액</b>
        <span class="v">₩12,480,000</span>
        <span class="chev">›</span>
      </div>
      <div class="sub">
        <span class="bit">이번 달 충전 <b>₩3,200,000</b></span>
        <span class="bit">사용 <b>₩2,750,000</b></span>
        <span class="bit warn">미반환 보증금 <b>2</b></span>
      </div>
    </div>

    <div class="grp">파트너</div>
    <div class="sum">
      <div class="hd">
        <b>연결된 매장</b>
        <span class="v">1</span><span class="u">/ 4</span>
        <span class="chev">›</span>
      </div>
      <div class="sub">
        <span class="bit warn">알림 미설정 <b>3</b></span>
      </div>
    </div>

  </div>

  <div class="tabs">
    <div class="tab on">대시보드<span class="bdg">6</span></div>
    <div class="tab">예약</div>
    <div class="tab">티켓</div>
    <div class="tab">회원</div>
    <div class="tab">설정</div>
  </div>

</div>
</x-dc>
