<style>
  *{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent}
  :root{--bg:#0c0406;--card:#15080b;--line:#2a1418;--gold:#c9a24b;--burgundy:#5c0a14;--txt:#f3ece0;--sub:#a89b8c}
  html,body{background:var(--bg);color:var(--txt);font-family:-apple-system,BlinkMacSystemFont,"Apple SD Gothic Neo","Noto Sans KR",sans-serif;min-height:100%}
  body{min-height:100dvh;display:flex;align-items:center;justify-content:center;padding:calc(env(safe-area-inset-top,0px) + 32px) 22px calc(env(safe-area-inset-bottom,0px) + 32px)}
  .wrap{width:100%;max-width:400px;text-align:center}
  .brand{font-family:"Archivo Black","Noto Sans KR",sans-serif;font-weight:900;font-size:44px;letter-spacing:.14em;color:var(--txt);margin-bottom:6px}
  .kr{font-size:13px;letter-spacing:.5em;color:var(--gold);margin-bottom:4px;text-transform:uppercase}
  .tag{font-size:12px;color:var(--sub);letter-spacing:.05em;margin-bottom:34px;line-height:1.6}
  .btns{display:flex;flex-direction:column;gap:12px}
  a.btn{display:flex;align-items:center;gap:14px;width:100%;padding:16px 18px;border-radius:14px;background:var(--card);border:1px solid var(--line);color:var(--txt);text-decoration:none;font-size:15px;font-weight:600;transition:transform .08s ease,background .15s ease}
  a.btn:active{transform:scale(.98);background:#1d0a0f}
  a.btn .ico{width:26px;height:26px;flex:0 0 26px;display:flex;align-items:center;justify-content:center}
  a.btn .t{flex:1;text-align:left}
  a.btn .t small{display:block;font-size:11px;font-weight:400;color:var(--sub);margin-top:2px;letter-spacing:.02em}
  a.line{background:#06c755;border-color:#06c755;color:#fff}
  a.line:active{background:#05b34c}
  a.line .t small{color:rgba(255,255,255,.82)}
  a.web{background:linear-gradient(135deg,#5c0a14,#7a1420);border-color:#7a1420;color:#fff}
  a.web .t small{color:rgba(255,255,255,.78)}
  .foot{margin-top:30px;font-size:10.5px;color:#6b5f52;letter-spacing:.14em;text-transform:uppercase}
  .chevron{opacity:.4}
</style>
</head>
