<title>TAAM 덴푸라 계보</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@500;600;700&family=Montserrat:wght@600;700;800&family=Noto+Sans+KR:wght@500;700;900&family=Noto+Serif+JP:wght@600;700&family=Oswald:wght@500;600;700&display=swap" rel="stylesheet">
<style>
  /* ═══ TAAM 앱 LINEAGE MODULE 디자인 시스템 그대로 ═══ */
  :root{--gold:#c8a96e;--red:#5C0A14;--cream:#f7f5f2;--beige:#f0ede8;--border:#e0ddd8;--ink:#1a1a18;--ink2:#555;--ink3:#999;
    --font-main:'Oswald','Noto Sans KR','Noto Sans JP',sans-serif;}
  *{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent}
  html,body{height:100%}
  body{background:var(--cream);color:var(--ink);font-family:var(--font-main);overflow:hidden}

  /* ── 헤더 (.lh 동일) ── */
  .lh{flex-shrink:0;padding:52px 20px 14px;border-bottom:1px solid var(--border);position:relative;text-align:center;background:var(--cream);z-index:20}
  .lh-back{width:36px;height:36px;border-radius:50%;background:var(--beige);border:1px solid var(--border);display:flex;align-items:center;justify-content:center;cursor:pointer;font-size:14px;position:absolute;left:20px;bottom:14px}
  .lh-t{font-family:"Cormorant Garamond",serif;font-size:20px;font-weight:700;color:var(--ink)}
  .lh-s{font-family:var(--font-main);font-size:7.5px;font-weight:600;letter-spacing:.2em;color:var(--ink3);margin-top:3px;text-transform:uppercase}
  .lh-replay{position:absolute;right:20px;bottom:14px;width:36px;height:36px;border-radius:50%;background:var(--beige);border:1px solid var(--border);display:flex;align-items:center;justify-content:center;cursor:pointer;font-size:14px;color:var(--ink2)}

  /* ── 계보 선택 패널 (앱 햄버거 패널 .lge-mi 스타일) ── */
  #panel{position:fixed;top:0;left:0;bottom:0;width:300px;max-width:86vw;z-index:1050;background:var(--cream);border-right:1px solid var(--border);transform:translateX(-100%);transition:transform .42s cubic-bezier(.22,1,.36,1);display:flex;flex-direction:column}
  #panel.open{transform:translateX(0)}
  .lge-ph{padding:56px 20px 16px;border-bottom:1px solid var(--border)}
  .lge-ph-logo{font-family:"Cormorant Garamond",serif;font-size:22px;font-weight:700;color:var(--ink)}
  .lge-ph-sub{font-family:var(--font-main);font-size:7.5px;font-weight:600;letter-spacing:.32em;color:var(--ink3);margin-top:4px;text-transform:uppercase}
  .pb{flex:1;overflow-y:auto}
  .lge-mi{display:flex;align-items:center;gap:12px;padding:15px 20px;cursor:pointer;border-bottom:1px solid var(--beige)}
  .lge-mi:active{background:var(--beige)}
  .lge-mi.on{background:var(--beige)}
  .lge-mi-ic{width:34px;height:34px;border-radius:8px;background:var(--ink);display:flex;align-items:center;justify-content:center;font-family:"Noto Serif JP","Cormorant Garamond",serif;font-size:13px;color:var(--gold);font-weight:700;flex-shrink:0}
  .lge-mi-n{font-family:"Noto Sans KR",sans-serif;font-size:12px;font-weight:700;color:var(--ink)}
  .lge-mi-s{font-family:var(--font-main);font-size:7px;font-weight:600;color:var(--ink3);letter-spacing:.18em;margin-top:2px;text-transform:uppercase}
  #dim{position:fixed;inset:0;z-index:1040;background:rgba(26,26,24,.35);opacity:0;pointer-events:none;transition:opacity .3s}
  #dim.show{opacity:1;pointer-events:auto}
  #hamBtn{position:fixed;top:52px;left:16px;z-index:1060;width:42px;height:42px;border-radius:50%;background:rgba(247,245,242,.95);border:1px solid var(--border);display:flex;flex-direction:column;align-items:center;justify-content:center;gap:5px;cursor:pointer;-webkit-backdrop-filter:blur(12px);backdrop-filter:blur(12px);box-shadow:0 2px 12px rgba(0,0,0,.12)}
  #hamBtn span{display:block;width:17px;height:1.5px;background:var(--ink);border-radius:1px;transition:.3s}
  #hamBtn.open span:nth-child(1){transform:translateY(6.5px) rotate(45deg)}
  #hamBtn.open span:nth-child(2){opacity:0}
  #hamBtn.open span:nth-child(3){transform:translateY(-6.5px) rotate(-45deg)}

  /* ── 트리 스크롤 영역 (.lb / #svgw 동일) ── */
  #wrap{position:fixed;inset:0;display:flex;flex-direction:column}
  .lb{flex:1;overflow-y:auto;-webkit-overflow-scrolling:touch;display:flex;justify-content:center}
  #svgw{width:100%;max-width:440px;padding:0 0 60px}
  #svgw svg{width:100%;display:block}

  .nd{cursor:pointer}
  .hint{position:fixed;left:0;right:0;bottom:10px;text-align:center;font-family:var(--font-main);font-size:8px;letter-spacing:.14em;color:var(--ink3);text-transform:uppercase;pointer-events:none;z-index:15}
</style>

   ── 레이아웃 규칙 (모든 계보 공통 강제) ──
   R1. 파이프는 이름(텍스트)을 절대 가로지르지 않는다.
       · 텍스트는 항상 타일 아래 전용 밴드(cy+38~cy+92)에만 존재
       · 파이프는 타일 "옆면" 으로만 드나들고, 세로 구간은 텍스트 폭 밖의
         전용 레인(L1=68 / L2=56 / R1=352 / R2=364)에서만 달린다
       · 좌우 컬럼 텍스트 최대 반폭 52px → 레인과 최소 4px 이격 보장
   R2. 파이프는 노드(타일) 안으로 침범하지 않는다.
       · 모든 끝점은 타일 가장자리에서 3px 떨어져 정지 (edge gap)
   R3. 파이프끼리 겹치거나 가로지르지 않는다.
       · 세로 버스는 컬럼당 전용 레인, 같은 레인 위 구간은 끝점만 공유(T분기)
       · 가로 스텁은 노드마다 유일한 y(행 전용)라 교차 없음
   R4. 이름끼리 겹치지 않는다.
       · 노드는 L(130)/C(210)/R(290) 3컬럼 × 150px 행 그리드에만 배치
       · 텍스트 밴드는 행마다 분리(밴드 끝 +92 < 다음 타일 top +121)
   ══════════════════════════════════════════════════════════════ */
var TILE=29, ROWH=150, TOPY=90, CXC=210, CXL=130, CXR=290;
var LANE={L1:68, L2:56, R1:352, R2:364};
var VW=420;

/* col:'C'|'L'|'R', row:정수(0=최상단), p:부모, hub:중앙 허브(위=shoulder 진입)
   rel:'가족'(버건디 스텁)/'추정'(점선 스텁), link:{to} 협업 점선(전용 레인2)

    {id:'nii',     kanji:'留', col:'L', row:3, p:'tenichi', shop:'天風良にい留', chef:'니이토메 슈지', loc:'나고야 · 2013', yr:'2013'},
    {id:'tentei',  kanji:'亭', col:'R', row:1, p:'tenichi', shop:'天亭 텐테이', chef:'쉐프 미확정', loc:'긴자'},
    {id:'tensen',  kanji:'仙', col:'R', row:2, p:'tenichi', shop:'天仙 텐센', chef:'쉐프 미확정', loc:'에도가와바시'},
    {id:'asa',     kanji:'浅', col:'R', row:3, p:'tenichi', shop:'天ぷら浅沼', chef:'아사누마 츠토무', loc:'니혼바시 · 2022', badge:'Award 2025 Silver', yr:'2022'}
  ]},
  mikawa: { jp:'みかわ', ko:'미카와 계보', sub:'MIKAWA LINEAGE · 9 NODES', nodes:[
    {id:'tensho', kanji:'庄', origin:true, col:'C', row:0, shop:'天庄 텐쇼', pill:'우에노 · 사오토메 수행처'},

    {id:'kaya',   kanji:'み', col:'L', row:2, p:'ze', rel:'가족', shop:'みかわ 카야바초', chef:'장남 토모미', loc:'카야바초'},
    {id:'fuku',   kanji:'福', col:'L', row:3, p:'ze', shop:'ふく庵 후쿠안', chef:'나카지마 아키히코', loc:'몬젠나카초 · 2017', yr:'2017'},

var ORDER=['yamanoue','temmasa','tenichi','mikawa','kyoboshi','dokuritsu'];

function colX(c){ return c==='L'?CXL:(c==='R'?CXR:CXC); }
function rowY(r){ return TOPY + r*ROWH; }
function esc(t){ return String(t||'').replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;'); }

/* ── SVG 빌드 (규칙 라우터) ── */
function buildSVG(key){
  var s=SCHOOLS[key];
  var by={}; s.nodes.forEach(function(n){ by[n.id]=n; n.cx=colX(n.col); n.cy=rowY(n.row); });
  var maxRow=0; s.nodes.forEach(function(n){ if(n.row>maxRow)maxRow=n.row; });
  var H=rowY(maxRow)+TILE+130;

  var defs=[], tl=[], pipes=[], nodes=[];
  defs.push('<filter id="sd" x="-35%" y="-35%" width="170%" height="170%"><feDropShadow dx="0" dy="3" stdDeviation="6" flood-color="#1a1a18" flood-opacity="0.13"/></filter>');
  defs.push('<linearGradient id="rb" x1="0%" y1="0%" x2="100%" y2="100%"><stop offset="0%" stop-color="#ffd6e7"/><stop offset="25%" stop-color="#ffecd2"/><stop offset="50%" stop-color="#c8f5e0"/><stop offset="75%" stop-color="#c8e6ff"/><stop offset="100%" stop-color="#e8c4ff"/></linearGradient>');

  /* 타임라인 (레인 밖 x=8 — R1 준수) */
  tl.push('<line x1="8" y1="'+(TOPY-24)+'" x2="8" y2="'+(rowY(maxRow)+56)+'" stroke="#e0ddd8" stroke-width="1.5"/>');
  for(var r=0;r<=maxRow;r++){
    var yr=''; s.nodes.forEach(function(n){ if(n.row===r&&n.yr&&!yr) yr=n.yr; });
    tl.push('<circle cx="8" cy="'+rowY(r)+'" r="'+(r===0?3.5:3)+'" fill="'+(r===0?'#c8a96e':'#aaa')+'"/>');
    if(yr) tl.push('<text x="15" y="'+(rowY(r)+4)+'" font-family="Montserrat,sans-serif" font-size="8" font-weight="600" fill="'+(r===0?'#c8a96e':'#888')+'">'+esc(yr)+'</text>');
  }

  /* 파이프 라우팅
     · 세로 버스: 부모→자식 그룹당 컬럼 전용 레인(L1/R1). 같은 레인은 끝점(T분기)만 공유.
     · 스텁: 레인→타일 옆면(3px 갭). 관계별 색(가족=버건디/추정=점선).
     · 허브(C) 진입: 보조 레인(L2) 어깨 경유 → 타일 윗면 진입 (텍스트 밴드 회피). */
  var pid=0, anim=[];  // anim: [{el,when:'node id'}]
  function P(d,opts){
    opts=opts||{};
    var id='lp'+(pid++);
    var stroke=opts.family?'#5C0A14':(opts.uncertain?'#999':'#1a1a18');
    pipes.push('<path style="opacity:0" id="'+id+'" fill="none" stroke="'+stroke+'" stroke-width="'+(opts.w||1.6)+'" stroke-linecap="round" stroke-linejoin="round"'+(opts.uncertain?' data-dash="1"':'')+' d="'+d+'"/>');
    return id;
  }
  /* 버스 그룹: (부모, 사이드) 별 트렁크 1개 */
  var groups={};
  s.nodes.forEach(function(n){
    if(!n.p||!by[n.p]) return;
    var pa=by[n.p];
    if(n.col==='C'){ // 허브 진입 (어깨 라우트)
      var lane=LANE.L2;
      var shoulderY=n.cy-TILE-16;
      var d='M'+(pa.cx-TILE-3)+','+pa.cy+' L'+lane+','+pa.cy+' L'+lane+','+shoulderY+' L'+n.cx+','+shoulderY+' L'+n.cx+','+(n.cy-TILE-3);
      n._pipe=P(d,{w:1.8});
      return;
    }
    var k=pa.id+'|'+n.col;
    (groups[k]=groups[k]||{pa:pa,col:n.col,kids:[]}).kids.push(n);
  });
  Object.keys(groups).forEach(function(k){
    var g=groups[k], pa=g.pa, lane=(g.col==='L')?LANE.L1:LANE.R1;
    var sgn=(g.col==='L')?-1:1;
    var exitX = pa.cx + sgn*(TILE+3);          // 부모 옆면 출발 (R2)
    var loY = Math.max.apply(null, g.kids.map(function(c){return c.cy;}));
    // 트렁크: 부모 옆면 → 레인 → 최하 자식 y (한 번만 그림 → R3)
    var trunk='M'+exitX+','+pa.cy+' L'+lane+','+pa.cy+' L'+lane+','+loY;
    var trunkId=P(trunk,{w:1.8});
    g.kids.sort(function(a,b){return a.cy-b.cy;});
    g.kids.forEach(function(c,i){
      var entryX = c.cx + sgn*(TILE+3);
      var stub;
      if(c.cy===loY){ c._pipe=trunkId; stub=null; }   // 최하 자식은 트렁크 끝이 곧 진입점 y — 스텁만 추가
      var d='M'+lane+','+c.cy+' L'+entryX+','+c.cy;
      c._stub=P(d,{family:c.rel==='가족', uncertain:c.rel==='추정'});
      if(!c._pipe) c._pipe=trunkId;
    });
  });
  /* 협업 점선 (전용 보조 레인 R2/L2 — 본 레인과 평행, 겹침 없음) */
  s.nodes.forEach(function(n){
    if(!n.link||!by[n.link.to]) return;
    var t=by[n.link.to];
    var lane=(n.col==='L')?LANE.L2:LANE.R2;
    var sgn=(n.col==='L')?-1:1;
    var d='M'+(n.cx+sgn*(TILE+3))+','+n.cy+' L'+lane+','+n.cy+' L'+lane+','+t.cy+' L'+(t.cx+sgn*(TILE+3))+','+t.cy;
    n._linkPipe=P(d,{uncertain:true});
  });

  /* 노드 (앱 마크업: 프레임+타일+한자, 텍스트는 전용 밴드) */
  s.nodes.forEach(function(n){
    var x=n.cx, y=n.cy, fx=x-TILE, fy=y-TILE, tx=x-26, ty=y-26;
    var frame;
    if(n.origin&&!n.closed) frame='<rect x="'+fx+'" y="'+fy+'" width="58" height="58" rx="13" fill="none" stroke="url(#rb)" stroke-width="4.5"/>';
    else if(n.closed) frame='<rect x="'+fx+'" y="'+fy+'" width="58" height="58" rx="13" fill="none" stroke="#999" stroke-width="2" stroke-dasharray="5 4"/>';
    else if(n.bg) frame='<rect x="'+fx+'" y="'+fy+'" width="58" height="58" rx="13" fill="none" stroke="#bbb" stroke-width="1.6" stroke-dasharray="4 4"/>';
    else frame='<rect x="'+fx+'" y="'+fy+'" width="58" height="58" rx="13" fill="none" stroke="#1a1a18" stroke-width="2.5"/>';
    var tileFill=n.bg?'#f0ede8':'#fff';
    var kanjiFill=n.closed?'#bbb':(n.bg?'#999':(n.origin?'#5C0A14':'#c8a96e'));
    var nameFill=n.closed?'#999':'#1a1a18';
    var halo='style="paint-order:stroke;stroke:#f7f5f2;stroke-width:3px;"';
    var g='<g id="nd_'+n.id+'" class="nd" style="opacity:0;">'
      +'<g filter="url(#sd)">'+frame+'<rect x="'+tx+'" y="'+ty+'" width="52" height="52" rx="10" fill="'+tileFill+'"/></g>'
      +'<text x="'+x+'" y="'+(y+9)+'" font-family="\'Noto Serif JP\',\'Cormorant Garamond\',serif" font-size="24" font-weight="700" fill="'+kanjiFill+'" text-anchor="middle">'+esc(n.kanji)+'</text>';
    var yy=y+TILE+16;
    g+='<text x="'+x+'" y="'+yy+'" font-family="\'Oswald\',\'Noto Sans KR\',\'Noto Sans JP\',sans-serif" font-size="10" font-weight="700" fill="'+nameFill+'" text-anchor="middle" '+halo+'>'+esc(n.shop)+'</text>';
    if(n.pill){
      yy+=8;
      var pw=Math.max(64, n.pill.length*6.4+14);
      g+='<rect x="'+(x-pw/2)+'" y="'+(yy-2)+'" width="'+pw+'" height="13" rx="6" fill="#f7f5f2" stroke="#ddd" stroke-width="0.7"/>'
        +'<text x="'+x+'" y="'+(yy+7.5)+'" font-family="Montserrat,\'Noto Sans KR\',sans-serif" font-size="7.5" font-weight="700" fill="#999" text-anchor="middle">'+esc(n.pill)+'</text>';
    } else {
      if(n.chef){ yy+=12; g+='<text x="'+x+'" y="'+yy+'" font-family="Oswald,\'Noto Sans KR\',sans-serif" font-size="7.5" fill="#999" text-anchor="middle" style="paint-order:stroke;stroke:#f7f5f2;stroke-width:2.5px;">'+esc(n.chef)+'</text>'; }
      if(n.loc){ yy+=11; g+='<text x="'+x+'" y="'+yy+'" font-family="Oswald,\'Noto Sans KR\',sans-serif" font-size="7.5" fill="#b3aa98" text-anchor="middle" style="paint-order:stroke;stroke:#f7f5f2;stroke-width:2.5px;">'+esc(n.loc)+'</text>'; }
      if(n.badge){ yy+=12; g+='<text x="'+x+'" y="'+yy+'" font-family="Montserrat,\'Noto Sans KR\',sans-serif" font-size="7.5" font-weight="700" fill="#c8a96e" text-anchor="middle" style="paint-order:stroke;stroke:#f7f5f2;stroke-width:2.5px;">'+esc(n.badge)+'</text>'; }
    }
    g+='</g>';
    nodes.push(g);
  });

  return '<svg viewBox="0 0 '+VW+' '+H+'" xmlns="http://www.w3.org/2000/svg"><defs>'+defs.join('')+'</defs>'
    + tl.join('') + pipes.join('') + nodes.join('') + '</svg>';
}

/* ── 애니메이션 (행 순서: 파이프 드로우 → 노드 페이드) ── */
var _timers=[], _key='yamanoue';
function clearTimers(){ _timers.forEach(clearTimeout); _timers=[]; }
function animate(){
  var s=SCHOOLS[_key], svg=document.querySelector('#svgw svg'); if(!svg) return;
  var drawn={};
  function prep(id){
    var p=svg.getElementById(id); if(!p) return null;
    var len=p.getTotalLength();
    p.style.transition='none';
    if(p.getAttribute('data-dash')){ p.setAttribute('stroke-dasharray','4 4'); p.style.opacity='0'; }
    else { p.setAttribute('stroke-dasharray',len); p.setAttribute('stroke-dashoffset',len); p.style.opacity='1'; }
    return p;
  }
  function draw(id,delay){
    if(!id||drawn[id]) return; drawn[id]=true;
    var p=svg.getElementById(id); if(!p) return;
    _timers.push(setTimeout(function(){
      if(p.getAttribute('data-dash')){ p.style.transition='opacity .5s ease'; p.style.opacity='1'; }
      else { p.style.transition='stroke-dashoffset .6s ease'; p.setAttribute('stroke-dashoffset','0'); }
    }, delay));
  }
  s.nodes.forEach(function(n){ ['_pipe','_stub','_linkPipe'].forEach(function(k){ if(n[k]) prep(n[k]); }); });
  var sorted=s.nodes.slice().sort(function(a,b){ return (a.cy-b.cy)||(a.cx-b.cx); });
  var t=250;
  sorted.forEach(function(n){
    draw(n._pipe, Math.max(0,t-350));
    draw(n._stub, Math.max(0,t-200));
    _timers.push(setTimeout(function(){
      var el=svg.getElementById('nd_'+n.id);
      if(el){ el.style.transition='opacity .55s ease'; el.style.opacity='1'; }
    }, t));
    t+=330;
  });
  sorted.forEach(function(n){ if(n._linkPipe) draw(n._linkPipe, t+150); });
}
function render(key){
  clearTimers(); _key=key;
  var s=SCHOOLS[key];
  s.nodes.forEach(function(n){ delete n._pipe; delete n._stub; delete n._linkPipe; });
  document.getElementById('svgw').innerHTML=buildSVG(key);
  document.getElementById('lhT').textContent=s.ko;
  document.getElementById('lhS').textContent=s.sub||'';
  document.querySelectorAll('.lge-mi').forEach(function(m){ m.classList.toggle('on', m.dataset.k===key); });
  document.querySelector('.lb').scrollTop=0;
  animate();
}
function replay(){ render(_key); }

/* ── 패널 (앱 구성) ── */
function togglePanel(){
  var p=document.getElementById('panel'),b=document.getElementById('hamBtn'),d=document.getElementById('dim');
  var o=p.classList.contains('open');
  p.classList.toggle('open',!o); b.classList.toggle('open',!o); d.classList.toggle('show',!o);
}
function closePanel(){
  document.getElementById('panel').classList.remove('open');
  document.getElementById('hamBtn').classList.remove('open');
  document.getElementById('dim').classList.remove('show');
}
(function buildPanel(){
  var list=document.getElementById('panelList');
  ORDER.forEach(function(k){
    var s=SCHOOLS[k];
    var mi=document.createElement('div');
    mi.className='lge-mi'; mi.dataset.k=k;
    mi.innerHTML='<div class="lge-mi-ic">'+s.jp.charAt(s.jp.length-1)+'</div>'
      +'<div><div class="lge-mi-n">'+s.ko+'</div><div class="lge-mi-s">'+(s.sub||'')+'</div></div>';
    mi.onclick=function(){ closePanel(); setTimeout(function(){ render(k); },150); };
    list.appendChild(mi);
  });
})();
render('yamanoue');
</script>
