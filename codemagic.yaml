workflows:
  ios-capacitor-workflow:
    name: TAAM iOS TestFlight Build
    instance_type: mac_mini_m2
    max_build_duration: 60

    integrations:
      app_store_connect: TAAM ASC

    environment:
      vars:
        BUNDLE_ID: "com.playtaam.app"
        XCODE_WORKSPACE: "ios/App/App.xcworkspace"
        XCODE_SCHEME: "App"
        APP_STORE_APPLE_ID: "6783459650"
      node: v20.18.0
      xcode: latest
      cocoapods: default

    cache:
      cache_paths:
        - $HOME/Library/Caches/CocoaPods

    triggering:
      events:
        - push
      branch_patterns:
        - pattern: main
          include: true
      cancel_previous_builds: true

    scripts:
      - name: STEP A — print versions
        script: |
          node --version
          npm --version
          npm config get registry

      - name: STEP B — npm install (omit dev)
        script: |
          rm -rf node_modules
          npm install --omit=dev --no-audit --no-fund --loglevel verbose

      - name: STEP C — diagnostics to file (절대 실패 안 함)
        script: |
          DBG="$CM_BUILD_DIR/stepc-debug.txt"
          {
            echo "==== STEP C DIAGNOSTICS ===="
            echo "PWD=$(pwd)"
            echo "CM_BUILD_DIR=$CM_BUILD_DIR"
            echo "which node=$(which node || echo NONE)"
            echo "node version=$(node --version 2>&1 || echo NONE)"
            echo "which npm=$(which npm || echo NONE)"
            echo "---- ls (repo root) ----"; ls -la 2>&1
            echo "---- node_modules 존재? ----"; ls -d node_modules 2>&1 || echo "NO node_modules"
            echo "---- node_modules/@capacitor ----"; ls -la node_modules/@capacitor 2>&1 || echo "NO @capacitor"
            echo "---- @capacitor/cli/bin ----"; ls -la node_modules/@capacitor/cli/bin 2>&1 || echo "NO cli/bin"
            echo "---- capacitor --version (node) ----"
            node ./node_modules/@capacitor/cli/bin/capacitor --version 2>&1 || echo "RC=$?"
            echo "==== END ===="
          } | tee "$DBG"
          echo "(diagnostics saved to stepc-debug.txt — 항상 통과)"
          exit 0

      - name: Ensure www directory placeholder (Capacitor 요구)
        script: |
          mkdir -p www
          if [ ! -f www/index.html ]; then
            echo "<!DOCTYPE html><html><body>TAAM</body></html>" > www/index.html
          fi

      - name: Add or sync Capacitor iOS platform
        script: |
          set -ex
          # node 로 capacitor 직접 실행 (.bin/cap 셔뱅 node 미발견 문제 우회)
          CAP="node ./node_modules/@capacitor/cli/bin/capacitor"
          if [ ! -d "ios" ]; then
            $CAP add ios
          fi
          $CAP sync ios

      - name: Install CocoaPods dependencies
        script: |
          cd ios/App
          pod install

      - name: Set up code signing (인증서·프로파일 자동 생성 후 적용)
        script: |
          # App Store 배포용 인증서 + 프로비저닝 프로파일을 없으면 생성(--create)하여 내려받음
          app-store-connect fetch-signing-files "$BUNDLE_ID" \
            --type IOS_APP_STORE \
            --create
          keychain initialize
          keychain add-certificates
          xcode-project use-profiles

      - name: Increment build number (Codemagic 자동 — 매 빌드마다 +1)
        script: |
          cd $CM_BUILD_DIR/ios/App
          agvtool new-version -all $(($BUILD_NUMBER + 1)) || true

      - name: Build ipa for distribution
        script: |
          xcode-project build-ipa \
            --workspace "$XCODE_WORKSPACE" \
            --scheme "$XCODE_SCHEME"

    artifacts:
      - build/ios/ipa/*.ipa
      - /tmp/xcodebuild_logs/*.log
      - $HOME/Library/Developer/Xcode/DerivedData/**/Build/**/*.app
      - $HOME/.npm/_logs/*.log
      - stepc-debug.txt

    publishing:
      # App Store Connect API 키(integration: TAAM ASC)로 TestFlight 업로드.
      app_store_connect:
        auth: integration
        submit_to_testflight: true
        # beta_groups:                       # TestFlight 에 내부 테스터 그룹 만든 뒤 주석 해제
        #   - "TAAM Internal Testers"

      email:
        recipients:
          - dnfmeod1139@gmail.com
        notify:
          success: true
          failure: true
