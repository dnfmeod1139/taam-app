workflows:
  ios-capacitor-workflow:
    name: TAAM iOS TestFlight Build
    instance_type: mac_mini_m2
    max_build_duration: 60

    integrations:
      app_store_connect: TAAM ASC

    environment:
      vars:
        BUNDLE_ID: "com.playtaam.app"
        XCODE_WORKSPACE: "ios/App/App.xcworkspace"
        XCODE_SCHEME: "App"
        APP_STORE_APPLE_ID: "6783459650"
      node: v20.18.0
      xcode: latest
      cocoapods: default

    cache:
      cache_paths:
        - $HOME/Library/Caches/CocoaPods

    triggering:
      events:
        - push
      branch_patterns:
        - pattern: main
          include: true
      cancel_previous_builds: true

    scripts:
      - name: Install npm dependencies (clean, prod only)
        script: |
          set -ex
          node --version
          npm --version
          rm -rf node_modules
          # devDependencies 제외 — @capacitor/assets→sharp(네이티브) 설치 실패 회피.
          # 빌드에 필요한 @capacitor/cli·core·ios 는 dependencies 에 있어 포함됨.
          npm install --omit=dev
          echo "── cap 바이너리 확인 ──"
          ls -la node_modules/.bin/cap
          ./node_modules/.bin/cap --version

      - name: Ensure www directory placeholder (Capacitor 요구)
        script: |
          mkdir -p www
          if [ ! -f www/index.html ]; then
            echo "<!DOCTYPE html><html><body>TAAM</body></html>" > www/index.html
          fi

      - name: Add or sync Capacitor iOS platform
        script: |
          set -ex
          # npx 우회 — 로컬 cap 바이너리 직접 호출
          if [ ! -d "ios" ]; then
            ./node_modules/.bin/cap add ios
          fi
          ./node_modules/.bin/cap sync ios

      - name: Install CocoaPods dependencies
        script: |
          cd ios/App
          pod install

      - name: Set up code signing (인증서·프로파일 자동 생성 후 적용)
        script: |
          # App Store 배포용 인증서 + 프로비저닝 프로파일을 없으면 생성(--create)하여 내려받음
          app-store-connect fetch-signing-files "$BUNDLE_ID" \
            --type IOS_APP_STORE \
            --create
          keychain initialize
          keychain add-certificates
          xcode-project use-profiles

      - name: Increment build number (Codemagic 자동 — 매 빌드마다 +1)
        script: |
          cd $CM_BUILD_DIR/ios/App
          agvtool new-version -all $(($BUILD_NUMBER + 1)) || true

      - name: Build ipa for distribution
        script: |
          xcode-project build-ipa \
            --workspace "$XCODE_WORKSPACE" \
            --scheme "$XCODE_SCHEME"

    artifacts:
      - build/ios/ipa/*.ipa
      - /tmp/xcodebuild_logs/*.log
      - $HOME/Library/Developer/Xcode/DerivedData/**/Build/**/*.app

    publishing:
      # App Store Connect API 키(integration: TAAM ASC)로 TestFlight 업로드.
      app_store_connect:
        auth: integration
        submit_to_testflight: true
        # beta_groups:                       # TestFlight 에 내부 테스터 그룹 만든 뒤 주석 해제
        #   - "TAAM Internal Testers"

      email:
        recipients:
          - dnfmeod1139@gmail.com
        notify:
          success: true
          failure: true
