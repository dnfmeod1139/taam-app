workflows:
  ios-capacitor-workflow:
    name: TAAM iOS TestFlight Build
    instance_type: mac_mini_m2
    max_build_duration: 60

    integrations:
      app_store_connect: TAAM ASC

    environment:
      groups:
        - appstore_signing      # ⚠ Codemagic UI 에 CERTIFICATE_PRIVATE_KEY (secure) 등록 필요
      vars:
        BUNDLE_ID: "com.playtaam.app"
        XCODE_PROJECT: "ios/App/App.xcodeproj"
        XCODE_SCHEME: "App"
        APP_STORE_APPLE_ID: "6783459650"
        # 🆕 2026.08: App Store 표시 버전(CFBundleShortVersionString).
        #   이미 출시된 버전과 같은 값으로는 업로드가 거부된다 —
        #   "Invalid Pre-Release Train. The train version '1.0' is closed for new
        #    build submissions" / "must contain a higher version than [1.0]".
        #   Capacitor 가 만드는 iOS 프로젝트는 항상 1.0 이라, 여기서 올려주지 않으면
        #   첫 출시 이후 모든 배포가 막힌다. 새 버전을 낼 때 이 값만 올리면 된다.
        #
        #   ⚠ 표기 규칙: 애플은 버전을 마침표로 끊어 숫자로 비교한다.
        #     1.01 은 [1, 1] 로 읽혀 1.1 과 같은 값이다. 그래서 이 앱은 앞으로
        #     1.1 을 쓸 수 없다 — 다음 잔손질은 1.02, 1.03 으로 이어간다.
        MARKETING_VERSION: "1.02"
      node: 22
      xcode: latest

    cache:
      cache_paths:
        - $HOME/Library/Caches/CocoaPods

    triggering:
      events:
        - push
      branch_patterns:
        - pattern: main
          include: true
      cancel_previous_builds: true

    # 🆕 네이티브 관련 파일이 바뀔 때만 iOS 빌드 실행 (index.html/sw.js 등 웹 전용 수정은 빌드 스킵 — 빌드분 절약)
    when:
      changeset:
        includes:
          - 'package.json'
          - 'package-lock.json'
          - 'codemagic.yaml'
          - 'capacitor.config.json'
          - 'assets/**'

    scripts:
      - name: STEP A — print versions
        script: |
          node --version
          npm --version
          npm config get registry

      - name: STEP B — npm install (omit dev)
        script: |
          rm -rf node_modules
          npm install --omit=dev --no-audit --no-fund --loglevel verbose

      - name: Verify Capacitor CLI (node 22)
        script: |
          node ./node_modules/@capacitor/cli/bin/capacitor --version

      - name: Ensure www directory placeholder (Capacitor 요구)
        script: |
          mkdir -p www
          if [ ! -f www/index.html ]; then
            echo "<!DOCTYPE html><html><body>TAAM</body></html>" > www/index.html
          fi

      # 🆕 2026.08: 앱이 자기 빌드번호를 알게 한다 (업데이트 안내용)
      #   server.url 이 원격이라 화면은 늘 최신 웹이다. 그래서 JS 는 자기를 감싼
      #   네이티브 껍데기가 몇 번인지 알 길이 없다 — 푸시·플러그인은 껍데기가 바뀌어야
      #   바뀌는데도. appendUserAgent 에 새겨 넣으면 navigator.userAgent 로 읽힌다.
      #   ⚠ 반드시 cap add/sync 앞이어야 한다 (그때 네이티브로 복사된다).
      - name: 빌드 버전을 User-Agent 에 새김 (업데이트 안내)
        script: |
          set -ex
          export APP_UA_VER="$MARKETING_VERSION"
          export APP_UA_BUILD="$(($BUILD_NUMBER + 1))"
          python3 scripts/inject_appversion_ua.py

      - name: Add or sync Capacitor iOS platform
        script: |
          set -ex
          # node 로 capacitor 직접 실행 (.bin/cap 셔뱅 node 미발견 문제 우회)
          CAP="node ./node_modules/@capacitor/cli/bin/capacitor"
          if [ ! -d "ios" ]; then
            $CAP add ios
          fi
          $CAP sync ios

      # 🆕 2026.08: iPhone 전용 (iPad 미지원)
      #   Capacitor 기본값은 "1,2"(iPhone+iPad) 라 iPad 겸용 앱이 된다. 그러면
      #   ① App Store 제출에 iPad 스크린샷(2048×2732)이 필수가 되고
      #   ② 심사자가 iPad 에서 열어보므로 대화면 레이아웃 문제로 리젝될 수 있다.
      #   TAAM 은 모바일 세로 기준 UI 이므로 iPhone 전용으로 제한한다.
      #   (추후 iPad 대응 시 이 스텝만 제거하면 원복)
      - name: iPhone 전용 설정 (TARGETED_DEVICE_FAMILY=1)
        script: |
          set -ex
          python3 - <<'PY'
          import re, sys
          p = 'ios/App/App.xcodeproj/project.pbxproj'
          src = open(p, encoding='utf-8').read()
          # "1,2" / 1,2 / "1" 등 어떤 표기든 1 로 통일
          new, n = re.subn(r'TARGETED_DEVICE_FAMILY = "?[0-9,]+"?;',
                           'TARGETED_DEVICE_FAMILY = "1";', src)
          if not n:
              sys.exit('project.pbxproj: TARGETED_DEVICE_FAMILY 항목을 찾지 못했습니다')
          if new != src:
              open(p, 'w', encoding='utf-8').write(new)
          print('TARGETED_DEVICE_FAMILY 설정 =', n, '곳')
          PY
          grep -n "TARGETED_DEVICE_FAMILY" ios/App/App.xcodeproj/project.pbxproj

      # 🆕 2026.08: 백그라운드 알림 수신 허용 (UIBackgroundModes: remote-notification)
      #   왜 필요한가
      #     알림을 띄우지 않고 배지 숫자만 바꾸는 푸시(content-available)는 '앱을 깨우는
      #     푸시' 라서, 이 항목이 없으면 iOS 가 조용히 버린다. 그래서 아이콘의 「1」을
      #     서버에서 지울 방법이 없었다 — 실제로 2026-08-27 에 그렇게 막혔다.
      #   무엇이 열리나
      #     · 배지 원격 초기화 (알림 없이 숫자만)
      #     · 앞으로의 조용한 갱신 (좌석·잔여석 등)
      #   심사 영향
      #     알림 관련 표준 백그라운드 모드다. 위치·오디오처럼 사유 설명을 요구하지 않는다.
      - name: 백그라운드 알림 수신 허용 (UIBackgroundModes)
        script: |
          set -e
          PL="ios/App/App/Info.plist"
          /usr/libexec/PlistBuddy -c "Print :UIBackgroundModes" "$PL" >/dev/null 2>&1 \
            || /usr/libexec/PlistBuddy -c "Add :UIBackgroundModes array" "$PL"
          if /usr/libexec/PlistBuddy -c "Print :UIBackgroundModes" "$PL" | grep -q "remote-notification"; then
            echo "ℹ️  이미 있음 — remote-notification"
          else
            /usr/libexec/PlistBuddy -c "Add :UIBackgroundModes: string remote-notification" "$PL"
            echo "✅ remote-notification 추가"
          fi
          echo "==== 판정 ===="
          if /usr/libexec/PlistBuddy -c "Print :UIBackgroundModes" "$PL" | grep -q "remote-notification"; then
            echo "✅ 백그라운드 알림 수신 허용 — 배지 원격 초기화가 동작한다"
          else
            echo "❌ 주입 실패"; exit 1
          fi

      - name: 수출규정 자동 면제 (ITSAppUsesNonExemptEncryption=NO)
        script: |
          # HTTPS 표준 암호화만 사용 → 비면제 암호화 없음. TestFlight 수출규정 질문 자동 회피.
          PL="ios/App/App/Info.plist"
          /usr/libexec/PlistBuddy -c "Set :ITSAppUsesNonExemptEncryption false" "$PL" 2>/dev/null \
            || /usr/libexec/PlistBuddy -c "Add :ITSAppUsesNonExemptEncryption bool false" "$PL"

      # 🆕 2026.08: iOS 권한 사용 목적 문자열 (필수)
      #   문자열이 없으면 해당 기능을 처음 쓰는 순간 앱이 즉시 종료됨 → 심사 확정 리젝.
      #   · 사진/카메라 : 프로필·레스토랑·시작화면 이미지 업로드 (index.html file input 21곳)
      #   · 위치        : 아틀라스 지도 '내 위치' (navigator.geolocation)
      - name: 권한 사용 목적 문자열 주입 (사진·카메라·위치)
        script: |
          set -ex
          PL="ios/App/App/Info.plist"
          setstr() {
            /usr/libexec/PlistBuddy -c "Set :$1 $2" "$PL" 2>/dev/null \
              || /usr/libexec/PlistBuddy -c "Add :$1 string $2" "$PL"
          }
          setstr NSPhotoLibraryUsageDescription "프로필·레스토랑 사진을 등록하기 위해 사진 보관함에 접근합니다."
          setstr NSPhotoLibraryAddUsageDescription "선택하신 이미지를 저장하기 위해 사진 보관함에 접근합니다."
          setstr NSCameraUsageDescription "사진을 직접 촬영해 등록하기 위해 카메라를 사용합니다."
          setstr NSLocationWhenInUseUsageDescription "지도에서 내 위치 기준으로 가까운 레스토랑을 보여주기 위해 위치를 사용합니다."
          setstr NSMicrophoneUsageDescription "동영상 촬영 시 소리를 함께 녹음하기 위해 마이크를 사용합니다."
          echo "==== Usage descriptions ===="
          for K in NSPhotoLibraryUsageDescription NSPhotoLibraryAddUsageDescription NSCameraUsageDescription NSLocationWhenInUseUsageDescription NSMicrophoneUsageDescription; do
            printf "%s = " "$K"; /usr/libexec/PlistBuddy -c "Print :$K" "$PL"
          done

      # 🆕 2026.08: 개인정보 매니페스트 (Apple — 2024.05 이후 업로드 시 경고/반려 대상)
      #   Required Reason API 사유 선언: UserDefaults(CA92.1 = 앱 자체 설정 저장).
      #   추적 없음(NSPrivacyTracking=false).
      - name: PrivacyInfo.xcprivacy 생성 (개인정보 매니페스트)
        script: |
          set -ex
          PRIV="ios/App/App/PrivacyInfo.xcprivacy"
          python3 -c "
          import plistlib
          data = {
            'NSPrivacyTracking': False,
            'NSPrivacyTrackingDomains': [],
            'NSPrivacyCollectedDataTypes': [],
            'NSPrivacyAccessedAPITypes': [
              {'NSPrivacyAccessedAPIType': 'NSPrivacyAccessedAPICategoryUserDefaults',
               'NSPrivacyAccessedAPITypeReasons': ['CA92.1']}
            ]
          }
          open('$PRIV','wb').write(plistlib.dumps(data))
          print('PrivacyInfo.xcprivacy written')
          "
          plutil -lint "$PRIV"
          ls -la "$PRIV"

      - name: 소셜 로그인 + 푸시 네이티브 설정 (구글 URL scheme · Apple Sign In · APNs entitlement)
        script: |
          set -ex
          PL="ios/App/App/Info.plist"
          # 1) 구글 iOS reversed client id URL scheme (@capgo/capacitor-social-login 구글 로그인 복귀용)
          GSCHEME="com.googleusercontent.apps.248142320623-v6i8b0j85vh8stq6nleij217cm7osiq4"
          /usr/libexec/PlistBuddy -c "Add :CFBundleURLTypes array" "$PL" 2>/dev/null || true
          /usr/libexec/PlistBuddy -c "Add :CFBundleURLTypes:0 dict" "$PL" 2>/dev/null || true
          /usr/libexec/PlistBuddy -c "Add :CFBundleURLTypes:0:CFBundleURLSchemes array" "$PL" 2>/dev/null || true
          /usr/libexec/PlistBuddy -c "Add :CFBundleURLTypes:0:CFBundleURLSchemes:0 string $GSCHEME" "$PL" 2>/dev/null \
            || /usr/libexec/PlistBuddy -c "Set :CFBundleURLTypes:0:CFBundleURLSchemes:0 $GSCHEME" "$PL"
          # 2) Sign in with Apple + 푸시 알림(APNs) entitlement 파일 생성
          #    ⚠ aps-environment 가 없으면 PushNotifications.register() 가
          #      "no valid aps-environment entitlement string found" 로 실패한다.
          #      토큰이 아예 안 나오므로 push_subscriptions 에 apns:// 행이 0건이 된다 —
          #      실제로 그렇게 막혀 있었다(2026-08-26). 앱은 멀쩡해 보이고 권한도
          #      「허용」인데 알림만 안 오는, 원인이 가장 안 보이는 상태다.
          #    production 으로 둔다. TestFlight·App Store 배포 빌드가 쓰는 값이고,
          #    개발용 development 토큰과는 APNs 서버가 갈린다.
          cat > ios/App/App/App.entitlements <<'PLIST'
          <?xml version="1.0" encoding="UTF-8"?>
          <!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN" "http://www.apple.com/DTDs/PropertyList-1.0.dtd">
          <plist version="1.0">
          <dict>
            <key>com.apple.developer.applesignin</key>
            <array><string>Default</string></array>
            <key>aps-environment</key>
            <string>production</string>
          </dict>
          </plist>
          PLIST
          # 3) pbxproj 에 CODE_SIGN_ENTITLEMENTS 연결 (xcodeproj gem)
          gem list -i xcodeproj >/dev/null 2>&1 || gem install xcodeproj --no-document
          cat > /tmp/set_ent.rb <<'RUBY'
          require 'xcodeproj'
          proj = Xcodeproj::Project.open('ios/App/App.xcodeproj')
          t = proj.targets.find { |x| x.name == 'App' }
          raise 'App target not found' unless t
          t.build_configurations.each { |c| c.build_settings['CODE_SIGN_ENTITLEMENTS'] = 'App/App.entitlements' }
          proj.save
          puts 'CODE_SIGN_ENTITLEMENTS set for App target'
          RUBY
          ruby /tmp/set_ent.rb
          echo "==== Info.plist URL types ===="; /usr/libexec/PlistBuddy -c "Print :CFBundleURLTypes" "$PL" || true

      # 🆕 2026.08: APNs 토큰이 JS 까지 오게 하는 마지막 연결 고리.
      #   Capacitor 기본 AppDelegate 에는 APNs 콜백 전달 코드가 없어서, 넣어주지 않으면
      #   register() 는 성공하는데 토큰도 오류도 오지 않는다(2026-08-26 증상).
      #   ios/ 는 빌드마다 새로 생성되므로 매번 다시 넣어야 한다. 실패하면 빌드를 세운다.
      - name: AppDelegate 에 APNs 콜백 주입 (푸시 토큰 수신)
        script: |
          set -e
          python3 scripts/ios_push_appdelegate.py

      - name: 네이티브 앱 아이콘 생성 (TAAM — assets/icon.png 1024)
        script: |
          set -e
          # @capacitor/assets 는 --omit=dev 로 빠지므로 이 단계에서만 임시 설치(sharp 포함)
          npm install --no-save @capacitor/assets@^3
          # assets/icon.png(1024) → ios 아이콘셋(AppIcon) 자동 생성. 배경 검정.
          npx capacitor-assets generate --ios \
            --iconBackgroundColor '#000000' \
            --iconBackgroundColorDark '#000000'

      # ⚠ 이 프로젝트는 Swift Package Manager(SPM) 기반(CapApp-SPM, Podfile 없음).
      # → pod install 불필요. SPM 의존성은 xcodebuild 가 빌드 시 자동 해결.

      - name: Set up code signing (인증서·프로파일 자동 생성 후 적용)
        script: |
          set -o pipefail
          DBG="$CM_BUILD_DIR/signing-debug.txt"
          KEYPEM="$CM_BUILD_DIR/cert_key.pem"
          # CERTIFICATE_PRIVATE_KEY 는 base64(단일행)로 저장 → PEM 으로 디코드
          # (Codemagic 보안변수가 여러 줄 PEM 줄바꿈을 망가뜨리는 문제 회피)
          printf '%s' "$CERTIFICATE_PRIVATE_KEY" | openssl base64 -d -A > "$KEYPEM"
          { echo "key bytes=$(wc -c < "$KEYPEM")"; echo "first line: $(head -1 "$KEYPEM")"; } | tee "$DBG"
          # App Store 배포용 인증서 + 프로비저닝 프로파일 생성/내려받기 (고정 개인키)
          app-store-connect fetch-signing-files "$BUNDLE_ID" \
            --type IOS_APP_STORE \
            --certificate-key "@file:$KEYPEM" \
            --create 2>&1 | tee -a "$DBG"
          keychain initialize
          keychain add-certificates 2>&1 | tee -a "$DBG"
          # use-profiles 출력에 '어느 타깃에 어떤 프로파일 적용' 이 나옴 (실패 시 진단)
          xcode-project use-profiles 2>&1 | tee -a "$DBG"

      - name: 버전 주입 (표시 버전 MARKETING_VERSION + 빌드번호 자동 +1)
        script: |
          cd $CM_BUILD_DIR/ios/App
          # 빌드번호(CFBundleVersion) — 같은 번호 재업로드를 App Store 가 거부한다
          agvtool new-version -all $(($BUILD_NUMBER + 1)) || true
          # 표시 버전(CFBundleShortVersionString) — 출시된 버전보다 높아야 업로드된다
          agvtool new-marketing-version "$MARKETING_VERSION" || true
          # 실제로 박혔는지 확인 — agvtool 이 조용히 실패하면 여기서 드러난다
          echo "==== 버전 확인 ===="
          agvtool what-marketing-version -terse1 || true
          agvtool what-version -terse || true
          grep -n "MARKETING_VERSION" App.xcodeproj/project.pbxproj | head -3

      - name: Build ipa for distribution
        script: |
          set -o pipefail
          # SPM 프로젝트 — workspace 없음. .xcodeproj 로 빌드.
          RC=0
          xcode-project build-ipa \
            --project "$XCODE_PROJECT" \
            --scheme "$XCODE_SCHEME" 2>&1 | tee "$CM_BUILD_DIR/build-debug.txt" || RC=$?
          # 실패 시 에러 줄만 뽑아 작은 파일로 (artifacts: build-errors.txt)
          grep -iE "error:|fatal|\*\* BUILD|Provisioning|No profile|code ?sign|Signing|requires|not found" \
            "$CM_BUILD_DIR/build-debug.txt" | tail -80 > "$CM_BUILD_DIR/build-errors.txt" || true
          echo "==== build-errors.txt ===="; cat "$CM_BUILD_DIR/build-errors.txt"
          exit $RC

      # 🆕 2026.08: 서명이 끝난 앱에 푸시 권한이 '실제로' 박혔는지 확인한다.
      #   entitlements 파일을 만들고 pbxproj 에 연결해도, 프로비저닝 프로파일이 그 권한을
      #   허용하지 않으면 서명 과정에서 조용히 빠질 수 있다. 그러면 앱은 멀쩡히 빌드되고
      #   설치도 되는데 iOS 가 토큰을 주지 않는다 — 토큰도 오류도 없는 침묵 상태가 된다.
      #   선언(전)이 아니라 결과(후)를 봐야 그 침묵의 정체가 드러난다.
      - name: 서명된 앱의 푸시 권한 확인 (aps-environment)
        script: |
          set +e
          cd "$CM_BUILD_DIR"
          IPA=$(ls build/ios/ipa/*.ipa 2>/dev/null | head -1)
          if [ -z "$IPA" ]; then echo "IPA 없음 — 빌드 실패했을 것"; exit 0; fi
          rm -rf /tmp/ipacheck && mkdir -p /tmp/ipacheck
          unzip -q "$IPA" -d /tmp/ipacheck
          APP=$(ls -d /tmp/ipacheck/Payload/*.app 2>/dev/null | head -1)
          if [ -z "$APP" ]; then echo ".app 을 찾지 못함"; exit 0; fi
          echo "==== 서명된 entitlements ===="
          codesign -d --entitlements :- "$APP" 2>&1 | tee /tmp/ent.txt
          echo "==== 판정 ===="
          if grep -q "aps-environment" /tmp/ent.txt; then
            echo "✅ aps-environment 있음 — 푸시 토큰이 나오는 빌드"
          else
            echo "❌ aps-environment 없음 — 이 빌드로는 토큰이 절대 안 나온다"
            echo "   → App ID 의 Push Notifications 활성화 이후 프로비저닝 프로파일이"
            echo "     새로 발급됐는지 확인 필요 (옛 프로파일에는 푸시 권한이 없다)"
          fi
          exit 0

    artifacts:
      - build/ios/ipa/*.ipa
      - /tmp/xcodebuild_logs/*.log
      - $HOME/Library/Developer/Xcode/DerivedData/**/Build/**/*.app
      - $HOME/.npm/_logs/*.log
      - build-errors.txt
      - build-debug.txt
      - signing-debug.txt

    publishing:
      # App Store Connect API 키(integration: TAAM ASC)로 TestFlight 업로드.
      app_store_connect:
        auth: integration
        submit_to_testflight: true
        # beta_groups:                       # TestFlight 에 내부 테스터 그룹 만든 뒤 주석 해제
        #   - "TAAM Internal Testers"

      email:
        recipients:
          - dnfmeod1139@gmail.com
        notify:
          success: true
          failure: true

  # ════════════════════════════════════════════════════════════════
  # ANDROID (Google Play) — 서명 AAB 빌드. ⚠ Codemagic UI 에 keystore 업로드 필요
  #   Code signing identities → Android keystores → reference 이름: taam_keystore
  # ════════════════════════════════════════════════════════════════
  android-capacitor-workflow:
    name: TAAM Android Play Build
    instance_type: mac_mini_m2
    max_build_duration: 60

    environment:
      # ⚠ 플랜 B: Personal Account 에 Code signing identities 메뉴가 없어
      #   keystore 를 base64 환경변수로 주입 (iOS 인증서와 동일 패턴).
      #   Codemagic 앱 Settings → Environment variables 에 그룹 'android_keystore' 로 등록:
      #     KEYSTORE_B64          = openssl base64 -A -in taam-release.keystore (Secure ✓)
      #     CM_KEYSTORE_PASSWORD  = keystore 비밀번호 (Secure ✓)
      #     CM_KEY_ALIAS          = taam
      #     CM_KEY_PASSWORD       = 키 비밀번호 (Secure ✓)
      groups:
        - android_keystore
      vars:
        PACKAGE_NAME: "com.playtaam.app"
        # 🆕 2026.08: iOS(MARKETING_VERSION)와 같은 표시 버전을 쓴다.
        #   두 스토어의 버전 표기가 갈리면 "안드로이드는 몇 버전이냐" 를 매번 따로 확인해야 한다.
        #   versionCode 는 아래에서 BUILD_NUMBER 로 계속 올라가므로 Play 업로드에는 지장 없다.
        MARKETING_VERSION: "1.02"
      node: 22
      java: 21          # ⚠ Capacitor 8 안드로이드 = JDK 21 필수 (미지정 시 invalid source release: 21)

    # ⚠ keystore 업로드 전엔 실패하므로 자동 트리거 없음 — 준비 후 'Start new build'로 수동 실행.
    #   (안정화되면 위 ios 처럼 triggering 추가 가능)

    scripts:
      - name: npm install (prod only)
        script: |
          set -ex
          node --version
          rm -rf node_modules
          npm install --omit=dev

      # 🆕 2026.08: 앱이 자기 빌드번호를 알게 한다 (업데이트 안내용) — iOS 와 같은 이유.
      #   Android 는 versionCode 가 곧 빌드번호다 (아래 주입 단계와 같은 계산식).
      - name: 빌드 버전을 User-Agent 에 새김 (업데이트 안내)
        script: |
          set -ex
          export APP_UA_VER="${VERSION_NAME:-$MARKETING_VERSION}"
          export APP_UA_BUILD="$((1000 + $BUILD_NUMBER))"
          python3 scripts/inject_appversion_ua.py

      - name: Ensure www placeholder + Add Capacitor Android
        script: |
          set -ex
          mkdir -p www
          [ -f www/index.html ] || echo "<!DOCTYPE html><html><body>TAAM</body></html>" > www/index.html
          CAP="node ./node_modules/@capacitor/cli/bin/capacitor"
          [ -d android ] || $CAP add android
          $CAP sync android

      - name: 네이티브 앱 아이콘 생성 (TAAM — android)
        script: |
          set -e
          npm install --no-save @capacitor/assets@^3
          npx capacitor-assets generate --android \
            --iconBackgroundColor '#000000' \
            --iconBackgroundColorDark '#000000'

      # 🆕 2026.08: Android 매니페스트 권한 보강
      #   WebView 의 geolocation('내 위치' 지도) 은 매니페스트 권한이 없으면 무조건 실패한다.
      #   카메라는 file input 촬영 옵션용. (Capacitor 기본 매니페스트엔 INTERNET 만 있음)
      #   ⚠ macOS 의 BSD sed 는 치환문의 \n 을 줄바꿈으로 해석하지 않아 XML 이 깨짐 → python3 로 처리.
      # 권한 주입 + 광고 ID(AD_ID) 권한 제거.
      #   TAAM 은 광고를 게재하지 않으므로 Play 콘솔 "광고 ID 사용" 선언을 '아니요' 로 한다.
      #   그런데 play-services / firebase 계열 SDK 가 자기 매니페스트에
      #   com.google.android.gms.permission.AD_ID 를 갖고 있어 병합 시 앱에 딸려 들어온다.
      #   → 선언(아니요)과 번들(권한 있음)이 불일치 → Play 가 "광고 ID 선언이 불완전함" 으로 제출 차단.
      #   tools:node="remove" 로 병합 단계에서 명시적으로 제거해 일치시킨다.
      - name: AndroidManifest 권한 주입 (위치·카메라) + AD_ID 제거
        script: |
          set -ex
          python3 - <<'PY'
          import re, sys
          mf = 'android/app/src/main/AndroidManifest.xml'
          src = open(mf, encoding='utf-8').read()
          orig = src

          # tools 네임스페이스 보장 (node="remove" 지시자에 필요)
          if 'xmlns:tools=' not in src:
              m = re.search(r'<manifest\b', src)
              if not m:
                  sys.exit('AndroidManifest: <manifest> tag not found')
              src = src[:m.end()] + ' xmlns:tools="http://schemas.android.com/tools"' + src[m.end():]

          perms = ['ACCESS_COARSE_LOCATION', 'ACCESS_FINE_LOCATION', 'CAMERA']
          feats = ['android.hardware.camera', 'android.hardware.location']
          add = []
          for p in perms:
              if 'android.permission.' + p not in src:
                  add.append('    <uses-permission android:name="android.permission.%s"/>' % p)
          for f in feats:
              if f not in src:
                  add.append('    <uses-feature android:name="%s" android:required="false"/>' % f)
          if 'com.google.android.gms.permission.AD_ID' not in src:
              add.append('    <uses-permission android:name="com.google.android.gms.permission.AD_ID"'
                         ' tools:node="remove"/>')

          if add:
              i = src.find('<application')
              if i < 0:
                  sys.exit('AndroidManifest: <application> tag not found')
              ls = src.rfind('\n', 0, i) + 1          # <application 줄의 시작
              src = src[:ls] + '\n'.join(add) + '\n' + src[ls:]

          if src != orig:
              open(mf, 'w', encoding='utf-8').write(src)
              print('updated — added lines:', len(add))
          else:
              print('already present — no change')
          PY
          echo "==== AndroidManifest ===="; cat android/app/src/main/AndroidManifest.xml
          python3 -c "import xml.dom.minidom,sys; xml.dom.minidom.parse('android/app/src/main/AndroidManifest.xml'); print('✅ XML 파싱 OK')"

      # 🆕 2026.08: versionCode 자동 증가 (Play 는 같은 versionCode 재업로드를 거부)
      #   Capacitor 가 생성하는 build.gradle 은 항상 versionCode 1 → 두 번째 업로드부터 실패.
      #   Codemagic BUILD_NUMBER(앱 단위 단조 증가)에 여유 오프셋(1000)을 더해 항상 커지게 한다.
      #   versionName 은 표시용 — 필요 시 VERSION_NAME 환경변수로 덮어쓸 수 있게.
      - name: versionCode / versionName 주입
        script: |
          set -ex
          python3 - <<'PY'
          import os, re, sys
          gr = 'android/app/build.gradle'
          src = open(gr, encoding='utf-8').read()
          vc = 1000 + int(os.environ.get('BUILD_NUMBER', '0') or 0)
          # 표시 버전 우선순위: VERSION_NAME(임시 덮어쓰기) > MARKETING_VERSION(iOS 와 공유) > 옛 방식
          vn = (os.environ.get('VERSION_NAME', '')
                or os.environ.get('MARKETING_VERSION', '')
                or '1.0.%d' % vc)
          new, n1 = re.subn(r'versionCode\s+\d+', 'versionCode %d' % vc, src, count=1)
          new, n2 = re.subn(r'versionName\s+"[^"]*"', 'versionName "%s"' % vn, new, count=1)
          if not n1 or not n2:
              sys.exit('build.gradle: versionCode/versionName pattern not found')
          open(gr, 'w', encoding='utf-8').write(new)
          print('versionCode =', vc, '/ versionName =', vn)
          PY
          grep -nE "versionCode|versionName" android/app/build.gradle

      # 🆕 2026.08: 안드로이드 푸시(FCM) 준비 — google-services.json 이 있을 때만 붙는다.
      #   ⚠ 이 파일 없이 PushNotifications.register() 를 부르면 네이티브가
      #     "Default FirebaseApp is not initialized" 로 그 자리에서 죽는다.
      #     JS try/catch 로는 못 잡는 네이티브 크래시라, 앱이 열렸다 계속 종료됐다
      #     (2026-08-20 Play 정책 이슈의 원인). 그래서 앱 쪽은 ANDROID_PUSH_LIVE
      #     플래그로 잠가 두고, 이 스텝이 실제로 붙인 뒤에만 연다.
      #
      #   Codemagic 환경변수(그룹 android_keystore 등)에 등록하면 활성화된다:
      #     GOOGLE_SERVICES_JSON_B64 = base64 -i google-services.json  (Secure ✓)
      #   변수가 없으면 아무것도 하지 않는다 — 지금처럼 푸시 없이 그대로 빌드된다.
      - name: FCM 설정 주입 (google-services.json — 있을 때만)
        script: |
          set -e
          if [ -z "$GOOGLE_SERVICES_JSON_B64" ]; then
            echo "GOOGLE_SERVICES_JSON_B64 미설정 — FCM 미구성으로 빌드 (푸시 없음)"
            exit 0
          fi
          echo "$GOOGLE_SERVICES_JSON_B64" | base64 --decode > android/app/google-services.json
          python3 -c "import json;d=json.load(open('android/app/google-services.json'));print('project_id =', d['project_info']['project_id'])"

          # ① 프로젝트 build.gradle 에 google-services 플러그인 classpath
          python3 - <<'PYX'
          import re
          p = 'android/build.gradle'
          src = open(p, encoding='utf-8').read()
          if 'com.google.gms:google-services' not in src:
              src = re.sub(r"(dependencies\s*\{)",
                           r"\1\n        classpath 'com.google.gms:google-services:4.4.2'",
                           src, count=1)
              open(p, 'w', encoding='utf-8').write(src)
              print('project build.gradle: classpath 추가')
          else:
              print('project build.gradle: 이미 있음')
          PYX

          # ② 앱 build.gradle 에 플러그인 적용 (파일 맨 끝이 관례)
          if ! grep -q "com.google.gms.google-services" android/app/build.gradle; then
            echo "" >> android/app/build.gradle
            echo "apply plugin: 'com.google.gms.google-services'" >> android/app/build.gradle
            echo "app build.gradle: plugin 적용"
          else
            echo "app build.gradle: 이미 적용됨"
          fi
          echo "✅ FCM 구성 완료 — 앱의 ANDROID_PUSH_LIVE 도 true 여야 실제로 등록된다"

      - name: Java 버전 확인 (21 이어야 함)
        script: |
          set -e
          echo "JAVA_HOME=$JAVA_HOME"
          java -version
          # 설치된 전체 JVM 목록 (진단용)
          /usr/libexec/java_home -V || true
          # 21 미만이면 명확히 실패 (environment.java: 21 미적용 감지)
          V=$(java -version 2>&1 | head -1 | sed -E 's/.*"([0-9]+).*/\1/')
          if [ "$V" -lt 21 ]; then
            echo "❌ Java $V — environment.java: 21 이 적용되지 않음"
            exit 1
          fi

      - name: Keystore 복원 (base64 env → 파일)
        script: |
          set -e
          if [ -z "$KEYSTORE_B64" ]; then
            echo "❌ KEYSTORE_B64 환경변수가 없습니다 — Codemagic 앱 Settings → Environment variables 에 android_keystore 그룹으로 등록하세요"
            exit 1
          fi
          KS="$CM_BUILD_DIR/taam-release.keystore"
          printf '%s' "$KEYSTORE_B64" | openssl base64 -d -A > "$KS"
          echo "keystore bytes=$(wc -c < "$KS")"
          # 이후 스텝(gradle)에서 쓰도록 경로 export
          echo "CM_KEYSTORE_PATH=$KS" >> $CM_ENV

      - name: 릴리스 서명 설정 (build.gradle 주입)
        script: |
          set -ex
          # CM_KEYSTORE_PATH(위 스텝) + CM_KEYSTORE_PASSWORD/CM_KEY_ALIAS/CM_KEY_PASSWORD(env 그룹) 사용.
          BG="android/app/build.gradle"
          python3 - "$BG" <<'PY'
          import sys, re
          p = sys.argv[1]; s = open(p).read()
          if 'signingConfigs' not in s:
              sign = (
                '\n    signingConfigs {\n'
                '        release {\n'
                '            storeFile file(System.getenv("CM_KEYSTORE_PATH"))\n'
                '            storePassword System.getenv("CM_KEYSTORE_PASSWORD")\n'
                '            keyAlias System.getenv("CM_KEY_ALIAS")\n'
                '            keyPassword System.getenv("CM_KEY_PASSWORD")\n'
                '        }\n    }\n'
              )
              s = re.sub(r'android\s*\{', lambda m: m.group(0) + sign, s, count=1)
          # release buildType 에 signingConfig 연결
          if 'signingConfig signingConfigs.release' not in s:
              s = re.sub(r'(buildTypes\s*\{\s*release\s*\{)',
                         r'\1\n            signingConfig signingConfigs.release', s, count=1)
          open(p,'w').write(s)
          print("✅ build.gradle 서명 설정 주입 완료")
          PY
          grep -n "signingConfig" "$BG" || true

      - name: Build AAB (release)
        script: |
          set -o pipefail
          java -version   # gradle 이 쓰는 JVM 확인 (21 이어야 함)
          cd android
          ./gradlew bundleRelease 2>&1 | tee "$CM_BUILD_DIR/android-build.txt"

      # 병합 결과에 AD_ID 가 정말 없는지 확인 — 남아 있으면 Play 가 제출을 막으므로
      # 업로드 전에 여기서 실패시키는 편이 낫다.
      - name: AD_ID 권한 제거 검증
        script: |
          set -e
          MERGED=$(find android/app/build/intermediates -name AndroidManifest.xml -path '*merged_manifest*' 2>/dev/null | head -1)
          if [ -z "$MERGED" ]; then
            echo "⚠️  병합 매니페스트를 찾지 못함 — 검증 건너뜀 (빌드는 정상)"
            exit 0
          fi
          echo "검사 대상: $MERGED"
          if grep -q "com.google.android.gms.permission.AD_ID" "$MERGED"; then
            echo "❌ 병합 매니페스트에 AD_ID 권한이 남아 있습니다 — Play 광고 ID 선언(아니요)과 충돌합니다"
            grep -n "uses-permission" "$MERGED"
            exit 1
          fi
          echo "✅ AD_ID 권한 없음 — Play 광고 ID 선언 '아니요' 와 일치"

    artifacts:
      - android/app/build/outputs/**/*.aab
      - android/app/build/outputs/**/*.apk
      - android/app/build/outputs/**/mapping.txt
      - android-build.txt

    publishing:
      # ⚠ Google Play 자동 업로드 — 서비스계정(GCLOUD_SERVICE_ACCOUNT_CREDENTIALS) 준비 후 주석 해제
      # google_play:
      #   credentials: $GCLOUD_SERVICE_ACCOUNT_CREDENTIALS
      #   track: internal
      email:
        recipients:
          - dnfmeod1139@gmail.com
        notify:
          success: true
          failure: true
