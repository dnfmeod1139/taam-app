workflows:
  ios-capacitor-workflow:
    name: TAAM iOS TestFlight Build
    instance_type: mac_mini_m2
    max_build_duration: 60

    integrations:
      app_store_connect: TAAM ASC

    environment:
      groups:
        - appstore_signing      # ⚠ Codemagic UI 에 CERTIFICATE_PRIVATE_KEY (secure) 등록 필요
      vars:
        BUNDLE_ID: "com.playtaam.app"
        XCODE_PROJECT: "ios/App/App.xcodeproj"
        XCODE_SCHEME: "App"
        APP_STORE_APPLE_ID: "6783459650"
      node: 22
      xcode: latest

    cache:
      cache_paths:
        - $HOME/Library/Caches/CocoaPods

    triggering:
      events:
        - push
      branch_patterns:
        - pattern: main
          include: true
      cancel_previous_builds: true

    scripts:
      - name: STEP A — print versions
        script: |
          node --version
          npm --version
          npm config get registry

      - name: STEP B — npm install (omit dev)
        script: |
          rm -rf node_modules
          npm install --omit=dev --no-audit --no-fund --loglevel verbose

      - name: Verify Capacitor CLI (node 22)
        script: |
          node ./node_modules/@capacitor/cli/bin/capacitor --version

      - name: Ensure www directory placeholder (Capacitor 요구)
        script: |
          mkdir -p www
          if [ ! -f www/index.html ]; then
            echo "<!DOCTYPE html><html><body>TAAM</body></html>" > www/index.html
          fi

      - name: Add or sync Capacitor iOS platform
        script: |
          set -ex
          # node 로 capacitor 직접 실행 (.bin/cap 셔뱅 node 미발견 문제 우회)
          CAP="node ./node_modules/@capacitor/cli/bin/capacitor"
          if [ ! -d "ios" ]; then
            $CAP add ios
          fi
          $CAP sync ios

      - name: 수출규정 자동 면제 (ITSAppUsesNonExemptEncryption=NO)
        script: |
          # HTTPS 표준 암호화만 사용 → 비면제 암호화 없음. TestFlight 수출규정 질문 자동 회피.
          PL="ios/App/App/Info.plist"
          /usr/libexec/PlistBuddy -c "Set :ITSAppUsesNonExemptEncryption false" "$PL" 2>/dev/null \
            || /usr/libexec/PlistBuddy -c "Add :ITSAppUsesNonExemptEncryption bool false" "$PL"

      - name: 네이티브 앱 아이콘 생성 (TAAM — assets/icon.png 1024)
        script: |
          set -e
          # @capacitor/assets 는 --omit=dev 로 빠지므로 이 단계에서만 임시 설치(sharp 포함)
          npm install --no-save @capacitor/assets@^3
          # assets/icon.png(1024) → ios 아이콘셋(AppIcon) 자동 생성. 배경 검정.
          npx capacitor-assets generate --ios \
            --iconBackgroundColor '#000000' \
            --iconBackgroundColorDark '#000000'

      # ⚠ 이 프로젝트는 Swift Package Manager(SPM) 기반(CapApp-SPM, Podfile 없음).
      # → pod install 불필요. SPM 의존성은 xcodebuild 가 빌드 시 자동 해결.

      - name: Set up code signing (인증서·프로파일 자동 생성 후 적용)
        script: |
          set -o pipefail
          DBG="$CM_BUILD_DIR/signing-debug.txt"
          KEYPEM="$CM_BUILD_DIR/cert_key.pem"
          # CERTIFICATE_PRIVATE_KEY 는 base64(단일행)로 저장 → PEM 으로 디코드
          # (Codemagic 보안변수가 여러 줄 PEM 줄바꿈을 망가뜨리는 문제 회피)
          printf '%s' "$CERTIFICATE_PRIVATE_KEY" | openssl base64 -d -A > "$KEYPEM"
          { echo "key bytes=$(wc -c < "$KEYPEM")"; echo "first line: $(head -1 "$KEYPEM")"; } | tee "$DBG"
          # App Store 배포용 인증서 + 프로비저닝 프로파일 생성/내려받기 (고정 개인키)
          app-store-connect fetch-signing-files "$BUNDLE_ID" \
            --type IOS_APP_STORE \
            --certificate-key "@file:$KEYPEM" \
            --create 2>&1 | tee -a "$DBG"
          keychain initialize
          keychain add-certificates 2>&1 | tee -a "$DBG"
          # use-profiles 출력에 '어느 타깃에 어떤 프로파일 적용' 이 나옴 (실패 시 진단)
          xcode-project use-profiles 2>&1 | tee -a "$DBG"

      - name: Increment build number (Codemagic 자동 — 매 빌드마다 +1)
        script: |
          cd $CM_BUILD_DIR/ios/App
          agvtool new-version -all $(($BUILD_NUMBER + 1)) || true

      - name: Build ipa for distribution
        script: |
          set -o pipefail
          # SPM 프로젝트 — workspace 없음. .xcodeproj 로 빌드.
          RC=0
          xcode-project build-ipa \
            --project "$XCODE_PROJECT" \
            --scheme "$XCODE_SCHEME" 2>&1 | tee "$CM_BUILD_DIR/build-debug.txt" || RC=$?
          # 실패 시 에러 줄만 뽑아 작은 파일로 (artifacts: build-errors.txt)
          grep -iE "error:|fatal|\*\* BUILD|Provisioning|No profile|code ?sign|Signing|requires|not found" \
            "$CM_BUILD_DIR/build-debug.txt" | tail -80 > "$CM_BUILD_DIR/build-errors.txt" || true
          echo "==== build-errors.txt ===="; cat "$CM_BUILD_DIR/build-errors.txt"
          exit $RC

    artifacts:
      - build/ios/ipa/*.ipa
      - /tmp/xcodebuild_logs/*.log
      - $HOME/Library/Developer/Xcode/DerivedData/**/Build/**/*.app
      - $HOME/.npm/_logs/*.log
      - build-errors.txt
      - build-debug.txt
      - signing-debug.txt

    publishing:
      # App Store Connect API 키(integration: TAAM ASC)로 TestFlight 업로드.
      app_store_connect:
        auth: integration
        submit_to_testflight: true
        # beta_groups:                       # TestFlight 에 내부 테스터 그룹 만든 뒤 주석 해제
        #   - "TAAM Internal Testers"

      email:
        recipients:
          - dnfmeod1139@gmail.com
        notify:
          success: true
          failure: true

  # ════════════════════════════════════════════════════════════════
  # ANDROID (Google Play) — 서명 AAB 빌드. ⚠ Codemagic UI 에 keystore 업로드 필요
  #   Code signing identities → Android keystores → reference 이름: taam_keystore
  # ════════════════════════════════════════════════════════════════
  android-capacitor-workflow:
    name: TAAM Android Play Build
    instance_type: mac_mini_m2
    max_build_duration: 60

    environment:
      # ⚠ 플랜 B: Personal Account 에 Code signing identities 메뉴가 없어
      #   keystore 를 base64 환경변수로 주입 (iOS 인증서와 동일 패턴).
      #   Codemagic 앱 Settings → Environment variables 에 그룹 'android_keystore' 로 등록:
      #     KEYSTORE_B64          = openssl base64 -A -in taam-release.keystore (Secure ✓)
      #     CM_KEYSTORE_PASSWORD  = keystore 비밀번호 (Secure ✓)
      #     CM_KEY_ALIAS          = taam
      #     CM_KEY_PASSWORD       = 키 비밀번호 (Secure ✓)
      groups:
        - android_keystore
      vars:
        PACKAGE_NAME: "com.playtaam.app"
      node: 22

    # ⚠ keystore 업로드 전엔 실패하므로 자동 트리거 없음 — 준비 후 'Start new build'로 수동 실행.
    #   (안정화되면 위 ios 처럼 triggering 추가 가능)

    scripts:
      - name: npm install (prod only)
        script: |
          set -ex
          node --version
          rm -rf node_modules
          npm install --omit=dev

      - name: Ensure www placeholder + Add Capacitor Android
        script: |
          set -ex
          mkdir -p www
          [ -f www/index.html ] || echo "<!DOCTYPE html><html><body>TAAM</body></html>" > www/index.html
          CAP="node ./node_modules/@capacitor/cli/bin/capacitor"
          [ -d android ] || $CAP add android
          $CAP sync android

      - name: 네이티브 앱 아이콘 생성 (TAAM — android)
        script: |
          set -e
          npm install --no-save @capacitor/assets@^3
          npx capacitor-assets generate --android \
            --iconBackgroundColor '#000000' \
            --iconBackgroundColorDark '#000000'

      - name: Java 21 선택 (Capacitor 8 안드로이드 요구)
        script: |
          set -e
          # 기본 JDK 가 낮아 'invalid source release: 21' 로 컴파일 실패 → JDK 21 로 전환
          JH=$(/usr/libexec/java_home -v 21)
          echo "선택된 JAVA_HOME: $JH"
          "$JH/bin/java" -version
          echo "JAVA_HOME=$JH" >> $CM_ENV

      - name: Keystore 복원 (base64 env → 파일)
        script: |
          set -e
          if [ -z "$KEYSTORE_B64" ]; then
            echo "❌ KEYSTORE_B64 환경변수가 없습니다 — Codemagic 앱 Settings → Environment variables 에 android_keystore 그룹으로 등록하세요"
            exit 1
          fi
          KS="$CM_BUILD_DIR/taam-release.keystore"
          printf '%s' "$KEYSTORE_B64" | openssl base64 -d -A > "$KS"
          echo "keystore bytes=$(wc -c < "$KS")"
          # 이후 스텝(gradle)에서 쓰도록 경로 export
          echo "CM_KEYSTORE_PATH=$KS" >> $CM_ENV

      - name: 릴리스 서명 설정 (build.gradle 주입)
        script: |
          set -ex
          # CM_KEYSTORE_PATH(위 스텝) + CM_KEYSTORE_PASSWORD/CM_KEY_ALIAS/CM_KEY_PASSWORD(env 그룹) 사용.
          BG="android/app/build.gradle"
          python3 - "$BG" <<'PY'
          import sys, re
          p = sys.argv[1]; s = open(p).read()
          if 'signingConfigs' not in s:
              sign = (
                '\n    signingConfigs {\n'
                '        release {\n'
                '            storeFile file(System.getenv("CM_KEYSTORE_PATH"))\n'
                '            storePassword System.getenv("CM_KEYSTORE_PASSWORD")\n'
                '            keyAlias System.getenv("CM_KEY_ALIAS")\n'
                '            keyPassword System.getenv("CM_KEY_PASSWORD")\n'
                '        }\n    }\n'
              )
              s = re.sub(r'android\s*\{', lambda m: m.group(0) + sign, s, count=1)
          # release buildType 에 signingConfig 연결
          if 'signingConfig signingConfigs.release' not in s:
              s = re.sub(r'(buildTypes\s*\{\s*release\s*\{)',
                         r'\1\n            signingConfig signingConfigs.release', s, count=1)
          open(p,'w').write(s)
          print("✅ build.gradle 서명 설정 주입 완료")
          PY
          grep -n "signingConfig" "$BG" || true

      - name: Build AAB (release)
        script: |
          set -o pipefail
          cd android
          ./gradlew bundleRelease 2>&1 | tee "$CM_BUILD_DIR/android-build.txt"

    artifacts:
      - android/app/build/outputs/**/*.aab
      - android/app/build/outputs/**/*.apk
      - android/app/build/outputs/**/mapping.txt
      - android-build.txt

    publishing:
      # ⚠ Google Play 자동 업로드 — 서비스계정(GCLOUD_SERVICE_ACCOUNT_CREDENTIALS) 준비 후 주석 해제
      # google_play:
      #   credentials: $GCLOUD_SERVICE_ACCOUNT_CREDENTIALS
      #   track: internal
      email:
        recipients:
          - dnfmeod1139@gmail.com
        notify:
          success: true
          failure: true
