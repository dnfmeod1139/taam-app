<!DOCTYPE html>
<html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>TAAM</title>
<style>
  html,body{margin:0;height:100%;background:#0e0e10;color:#f3efe8;font-family:-apple-system,BlinkMacSystemFont,"Noto Sans KR",sans-serif}
  .w{min-height:100%;display:flex;align-items:center;justify-content:center;padding:28px;box-sizing:border-box;text-align:center}
  .b{max-width:340px}
  h1{font-size:18px;margin:14px 0 8px}
  p{font-size:14px;line-height:1.7;color:#cfc9bf;margin:0 0 22px}
  small{display:block;font-size:12px;color:#8f887c;margin-top:6px}
  button{width:100%;padding:14px;border:0;border-radius:12px;background:#c8a96e;color:#1a1a18;font-size:15px;font-weight:800}
  .d{margin-top:18px;font-size:11px;color:#6f6a62;word-break:break-all}
</style></head>
<body><div class="w"><div class="b">
  <div style="font-size:34px">📡</div>
  <h1>TAAM 에 연결할 수 없습니다</h1>
  <p>인터넷 연결을 확인한 뒤 다시 시도해 주세요.<br>Wi-Fi·데이터가 켜져 있는데도 계속 이 화면이면, 기기 날짜·시간이 맞는지도 확인해 주세요.
  <small>Could not reach TAAM. Check your connection and try again.</small></p>
  <button onclick="location.replace('https://taam-app.vercel.app/?r=' + Date.now())">다시 시도 · Retry</button>
  <div class="d" id="d"></div>
</div></div>
<script>
  // ES5 만 — 오래된 WebView 에서도 이 화면은 떠야 한다
  try { document.getElementById('d').textContent = (navigator.onLine ? 'online' : 'offline') + ' · ' + new Date().toISOString().slice(0,16) + ' · ' + (navigator.userAgent||'').slice(0,90); } catch(e){}
</script>
</body></html>
