<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
<meta name="robots" content="noindex, nofollow">
<title>TAAM — 코퍼레이트 멤버십</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Bodoni+Moda:opsz,wght@6..96,700&family=Noto+Sans+KR:wght@400;500;700&family=Noto+Sans+JP:wght@400;500;700&display=swap" rel="stylesheet">
<!--
  ════════════════════════════════════════════════════════════════
  코퍼레이트 멤버십 — 안내 + 도입 문의
  ════════════════════════════════════════════════════════════════
  ⚠ 여기에는 **금액이 없다.** 법인 연회비는 미정이고, 계약·세금계산서·
    환불 규정이 개인과 다르다. 화면에서 숫자를 정해 버리면 상담 전에
    그 숫자가 굳는다. 「연회비는 상담 후 개별 안내」로 끝낸다.

  ⚠ 셀프 결제 플로우가 없다. 문의 접수까지만.
  ════════════════════════════════════════════════════════════════
-->
<style>
:root{
  --ground:#F6F6F7; --card:#FFFFFF;
  --ink:#16161A; --ink-2:#61616B; --ink-3:#9A9AA4;
  --rule:#E6E6EA; --rule-2:#F0F0F3; --line:#D8D8DE;
  --burg:#5E1622; --burg-tx:#8A3242;
  --ok:#2C6B47; --ok-bg:#E6F2EA; --bad:#9B1C1C; --bad-bg:#FDF3F3;
  --shadow:0 1px 2px rgba(22,22,26,.04),0 1px 12px -6px rgba(22,22,26,.14);
}
*{margin:0;padding:0;box-sizing:border-box}
html{-webkit-text-size-adjust:100%}
body{background:var(--ground);color:var(--ink);
  font-family:'Noto Sans KR','Noto Sans JP',system-ui,-apple-system,sans-serif;
  font-size:15px;line-height:1.75;-webkit-font-smoothing:antialiased;
  padding:36px 18px 56px;word-break:keep-all}
.wrap{max-width:400px;margin:0 auto}
.top{display:flex;align-items:baseline;gap:11px;justify-content:center}
.wordmark{font-family:'Bodoni Moda',Didot,serif;font-weight:700;font-size:21px;
  letter-spacing:.28em;color:var(--burg-tx);line-height:1}
.pill{font-size:10.5px;font-weight:700;padding:3px 10px;border-radius:999px;
  background:var(--ok-bg);color:var(--ok);white-space:nowrap}
h1{margin-top:26px;font-size:20px;font-weight:700;text-align:center;line-height:1.5}
.lead{margin-top:11px;font-size:14px;color:var(--ink-2);text-align:center;line-height:1.9}
.list{margin-top:24px;background:var(--card);border:1px solid var(--rule);border-radius:13px;
  box-shadow:var(--shadow);overflow:hidden}
.list .r{padding:15px 16px}
.list .r + .r{border-top:1px solid var(--rule-2)}
.list .r .t{font-size:14px;font-weight:700}
.list .r .d{margin-top:4px;font-size:12.5px;color:var(--ink-2);line-height:1.8}
h2{margin-top:26px;font-size:13px;font-weight:700;letter-spacing:.1em;color:var(--ink-3);text-transform:uppercase}
.f{margin-top:14px}
.q{font-size:13px;font-weight:700}
.in{width:100%;margin-top:7px;padding:13px 14px;border:1px solid var(--line);border-radius:12px;
  background:var(--card);color:var(--ink);font-family:inherit;font-size:15px}
.in::placeholder{color:var(--ink-3)}
.in:focus{outline:none;border-color:var(--burg)}
textarea.in{min-height:76px;resize:vertical;line-height:1.8}
.go{display:block;width:100%;margin-top:24px;padding:16px;border:0;border-radius:13px;
  background:var(--burg);color:#fff;font-family:inherit;font-size:15px;font-weight:700;cursor:pointer}
.go:disabled{opacity:.45;cursor:default}
.err{margin-top:12px;padding:12px 14px;border-radius:11px;background:var(--bad-bg);
  border:1px solid #E7C3C3;font-size:12.5px;color:var(--bad);line-height:1.7}
.fine{margin-top:13px;font-size:11.5px;line-height:1.85;color:var(--ink-3);text-align:center}
.done{margin-top:46px;text-align:center}
.done .ic{font-size:32px;color:var(--ok)}
.done .t{margin-top:14px;font-size:17px;font-weight:700}
.done .d{margin-top:10px;font-size:13.5px;line-height:1.9;color:var(--ink-2)}
.langs{margin-top:34px;display:flex;justify-content:center;gap:6px}
.langs button{padding:6px 13px;border:1px solid var(--rule);border-radius:999px;background:var(--card);
  font-family:inherit;font-size:11.5px;font-weight:700;color:var(--ink-3);cursor:pointer}
.langs button.on{border-color:var(--burg);color:var(--burg-tx)}
</style>
</head>
<body>
<div class="wrap" id="wrap"></div>
<script>
(function(){
  'use strict';
  var SB_URL = 'https://edfsmzbcixfnqabrsvut.supabase.co';
  var SB_KEY = 'sb_publishable_NlJp3lRtSVvkgFGRBesoog_q4XlGEPC';
  var qs = new URLSearchParams(location.search);

  var T = {
    ko:{
      pill:'법인 {n}사 한정', pill_x:'법인 한정',
      h1:'코퍼레이트 멤버십',
      lead:'비즈니스 다이닝을 위한 법인 전용 멤버십.<br>개인 멤버십 정원과 별도로 운영됩니다.',
      b:'혜택',
      b1t:'대관 우선 배정', b1d:'접대·행사 일정에 맞춘 단독 대관',
      b2t:'지정 임직원 2인 등록', b2d:'대표 외 이용 가능 임직원을 지정합니다',
      b3t:'세금계산서 · 정산 리포트', b3d:'회차별 지출 내역을 문서로 정리해 드립니다',
      b4t:'게스트 검증 · 의전 동행', b4d:'초청 게스트 응대까지 탐이 케어합니다',
      b5t:'전액 법인카드 일괄 결제', b5d:'계좌이체·세금계산서가 기본이며, 법인카드 일괄 결제도 가능합니다',
      inq:'도입 문의',
      co:'회사명', co_ph:'주식회사 ○○',
      ct:'담당자', ct_ph:'성함 · 직함',
      ph:'연락처', ph_ph:'010-0000-0000',
      em:'이메일 (선택)', em_ph:'선택 사항입니다',
      mm:'문의 내용 (선택)', mm_ph:'검토 중인 규모·시기 등을 적어 주시면 상담이 빨라집니다',
      go:'도입 문의', going:'보내는 중…',
      fine:'연회비는 상담 후 개별 안내됩니다.',
      miss:'아직 비어 있는 항목이 있습니다',
      err:'보내지 못했습니다. 잠시 후 다시 시도해 주세요.',
      done_t:'문의가 접수되었습니다',
      done_d:'담당자가 적어 주신 연락처로<br>연락드리겠습니다.'
    },
    en:{
      pill:'{n} companies only', pill_x:'Corporate only',
      h1:'Corporate membership',
      lead:'A corporate membership for business dining.<br>Run separately from individual places.',
      b:'Benefits',
      b1t:'Priority private buyouts', b1d:'Exclusive buyouts arranged around your calendar',
      b2t:'Two named executives', b2d:'Register colleagues who may use the membership',
      b3t:'Tax invoices and reporting', b3d:'Spending per occasion, documented',
      b4t:'Guest vetting and hosting', b4d:'We take care of your invited guests as well',
      b5t:'Pay in full by corporate card', b5d:'Transfer with a tax invoice is standard; a single corporate-card payment is also available',
      inq:'Enquiry',
      co:'Company', co_ph:'Company name',
      ct:'Contact', ct_ph:'Name and title',
      ph:'Phone', ph_ph:'Country code included',
      em:'Email (optional)', em_ph:'Optional',
      mm:'Anything else (optional)', mm_ph:'Scale and timing help us prepare',
      go:'Send enquiry', going:'Sending...',
      fine:'The annual fee is quoted individually after a conversation.',
      miss:'Some fields are still empty',
      err:'Could not send. Please try again shortly.',
      done_t:'We have your enquiry',
      done_d:'We will contact you at the number<br>you provided.'
    },
    ja:{
      pill:'法人{n}社限定', pill_x:'法人限定',
      h1:'コーポレート メンバーシップ',
      lead:'ビジネスダイニングのための法人専用メンバーシップ。<br>個人メンバーシップの定員とは別枠で運営いたします。',
      b:'特典',
      b1t:'貸切の優先手配', b1d:'ご接待・行事のご予定に合わせた貸切',
      b2t:'ご指定の役職員2名', b2d:'代表者のほかにご利用いただける方をご指定いただけます',
      b3t:'請求書 · ご精算レポート', b3d:'回ごとのご利用内容を書面にまとめてご報告いたします',
      b4t:'ゲストの確認 · ご同行', b4d:'お招きのゲストのご対応までTAAMが承ります',
      b5t:'法人カードでの一括決済', b5d:'お振込・請求書が基本ですが、法人カードでの一括決済も承ります',
      inq:'導入のお問い合わせ',
      co:'会社名', co_ph:'株式会社○○',
      ct:'ご担当者', ct_ph:'お名前・役職',
      ph:'ご連絡先', ph_ph:'国番号を含めてご記入ください',
      em:'メールアドレス (任意)', em_ph:'任意です',
      mm:'お問い合わせ内容 (任意)', mm_ph:'ご検討の規模・時期などをご記入いただけますと幸いです',
      go:'お問い合わせ', going:'送信中…',
      fine:'年会費はご相談のうえ個別にご案内いたします。',
      miss:'未記入の項目がございます',
      err:'送信できませんでした。少し経ってからお試しください。',
      done_t:'お問い合わせを承りました',
      done_d:'担当よりご記入の連絡先へ<br>ご連絡いたします。'
    }
  };
  var LANG = 'ko';
  function t(k){ return (T[LANG] && T[LANG][k]) || T.ko[k] || k; }
  function pickLang(){
    try {
      var q = qs.get('lang'); if(q && T[q]) return q;
      var s = localStorage.getItem('taamCorpLang'); if(s && T[s]) return s;
    } catch(e){}
    var n = String(navigator.language || 'ko').toLowerCase();
    if(n.indexOf('ja') === 0) return 'ja';
    if(n.indexOf('ko') === 0) return 'ko';
    return 'en';
  }
  function esc(s){
    return String(s == null ? '' : s).replace(/[&<>"']/g, function(c){
      return ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'})[c];
    });
  }
  async function rpc(fn, args){
    var res = await fetch(SB_URL + '/rest/v1/rpc/' + fn, {
      method:'POST',
      headers:{ 'Content-Type':'application/json', 'apikey':SB_KEY, 'Authorization':'Bearer ' + SB_KEY },
      body: JSON.stringify(args || {})
    });
    var body = null; try { body = await res.json(); } catch(e){}
    if(!res.ok) throw new Error((body && (body.message || body.hint)) || ('HTTP ' + res.status));
    return body;
  }

  var F = { co:'', ct:'', ph:'', em:'', mm:'' };
  var SLOTS = null, BUSY = false, DONE = false, ERR = '';

  function collect(){
    ['co','ct','ph','em','mm'].forEach(function(k){
      var el = document.getElementById('i_' + k);
      if(el) F[k] = el.value;
    });
  }
  window.__lang = function(L){
    collect(); LANG = L;
    try { localStorage.setItem('taamCorpLang', L); } catch(e){}
    document.documentElement.lang = L; render();
  };
  function langBar(){
    return '<div class="langs">' + ['ko','en','ja'].map(function(L){
      return '<button class="' + (LANG === L ? 'on' : '') + '" onclick="__lang(\'' + L + '\')">'
           + ({ko:'한국어',en:'English',ja:'日本語'})[L] + '</button>';
    }).join('') + '</div>';
  }

  function render(){
    document.documentElement.lang = LANG;
    var w = document.getElementById('wrap');
    if(DONE){
      w.innerHTML = '<div class="top"><span class="wordmark">TAAM</span></div>'
        + '<div class="done"><div class="ic">✓</div><div class="t">' + t('done_t') + '</div>'
        + '<div class="d">' + t('done_d') + '</div></div>' + langBar();
      return;
    }
    var h = '<div class="top"><span class="wordmark">TAAM</span>'
      + '<span class="pill">'
      +   (SLOTS != null ? t('pill').replace('{n}', SLOTS) : t('pill_x')) + '</span></div>'
      + '<h1>' + t('h1') + '</h1>'
      + '<div class="lead">' + t('lead') + '</div>'
      + '<h2>' + t('b') + '</h2><div class="list">'
      + [1,2,3,4,5].map(function(i){
          return '<div class="r"><div class="t">' + t('b' + i + 't') + '</div>'
               + '<div class="d">' + t('b' + i + 'd') + '</div></div>';
        }).join('') + '</div>'
      + '<h2>' + t('inq') + '</h2>';

    [['co', true], ['ct', true], ['ph', true], ['em', false], ['mm', false]].forEach(function(x){
      var k = x[0];
      h += '<div class="f"><div class="q">' + t(k) + (x[1] ? ' <b style="color:#8A3242">*</b>' : '') + '</div>'
        + (k === 'mm'
           ? '<textarea class="in" id="i_mm" placeholder="' + esc(t('mm_ph')) + '">' + esc(F.mm) + '</textarea>'
           : '<input class="in" id="i_' + k + '" type="' + (k === 'ph' ? 'tel' : (k === 'em' ? 'email' : 'text'))
             + '" value="' + esc(F[k]) + '" placeholder="' + esc(t(k + '_ph')) + '">')
        + '</div>';
    });

    if(ERR) h += '<div class="err">' + ERR + '</div>';
    h += '<button class="go" id="go" onclick="__go()"' + (BUSY ? ' disabled' : '') + '>'
       + (BUSY ? t('going') : t('go')) + '</button>'
       // ⚠ 금액은 여기서 정하지 않는다
       + '<div class="fine">' + t('fine') + '</div>' + langBar();
    w.innerHTML = h;
  }

  window.__go = async function(){
    if(BUSY) return;
    collect();
    var miss = [];
    if(!String(F.co).trim()) miss.push(t('co'));
    if(!String(F.ct).trim()) miss.push(t('ct'));
    if(String(F.ph).replace(/[^0-9]/g,'').length < 8) miss.push(t('ph'));
    if(miss.length){ ERR = esc(t('miss')) + '<br>' + esc(miss.join(' · ')); render(); return; }
    ERR = ''; BUSY = true; render();
    try {
      await rpc('taam_corp_inquire', {
        p_company: F.co, p_contact: F.ct, p_phone: F.ph,
        p_email: F.em || null, p_memo: F.mm || null, p_lang: LANG
      });
      DONE = true;
    } catch(e){ ERR = esc(t('err')); }
    finally { BUSY = false; render(); }
  };

  (async function(){
    LANG = pickLang();
    render();
    // 「법인 5사 한정」의 숫자는 설정값에서. 못 읽으면 숫자 없이 적는다.
    try {
      var r = await rpc('taam_mship_settings', {});
      var n = r && parseInt(r.corp_slots, 10);
      if(isFinite(n) && n > 0){ SLOTS = n; render(); }
    } catch(e){}
  })();
})();
</script>
</body>
</html>
