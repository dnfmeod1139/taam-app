<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex">
<title>TAAM — Partnership Proposal</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Shippori+Mincho:wght@400;500;600;700&family=Noto+Sans+JP:wght@300;400;500;700&family=Oswald:wght@300;400;500;600&display=swap" rel="stylesheet">
<style>
  :root{ --bg:#FBFAF7; --ink:#1a1a18; --sub:#6b665c; --line:#E5E0D6; --bd:#5C0A14; --gold:#A98B4F; }
  *{margin:0;padding:0;box-sizing:border-box;}
  html{-webkit-text-size-adjust:100%;}
  body{background:var(--bg);color:var(--ink);font-family:'Noto Sans JP',sans-serif;font-weight:400;line-height:2;letter-spacing:.04em;}
  .serif{font-family:'Shippori Mincho',serif;}
  body.en{font-family:-apple-system,'Helvetica Neue',Arial,sans-serif;letter-spacing:.02em;}
  body.en .serif{font-family:'Oswald',sans-serif;letter-spacing:.12em;}
  .wrap{max-width:640px;margin:0 auto;padding:0 28px;}
  /* ── hero (개인화 인사) ── */
  .hero{padding:88px 0 60px;text-align:center;}
  .hero .brand{font-family:'Shippori Mincho',serif;font-size:13px;letter-spacing:.55em;color:var(--bd);font-weight:600;text-indent:.55em;}
  body.en .hero .brand{font-family:'Oswald',sans-serif;}
  .hero .to{font-family:'Shippori Mincho',serif;font-size:clamp(22px,6.4vw,32px);font-weight:600;letter-spacing:.14em;margin-top:36px;line-height:1.9;}
  body.en .hero .to{font-family:'Oswald',sans-serif;font-weight:500;}
  .hero .rest{margin-top:10px;font-size:13px;color:var(--sub);letter-spacing:.14em;}
  .hero .sub{margin-top:24px;font-size:12.5px;color:var(--sub);letter-spacing:.1em;line-height:2.3;}
  .hr{width:36px;height:1px;background:var(--bd);margin:38px auto 0;}
  /* ── section ── */
  section{padding:54px 0;border-top:1px solid var(--line);}
  .lbl{font-size:10.5px;letter-spacing:.45em;color:var(--gold);font-weight:500;text-indent:.45em;text-align:center;}
  h2{font-family:'Shippori Mincho',serif;font-size:20px;font-weight:600;letter-spacing:.18em;text-align:center;margin-top:14px;}
  body.en h2{font-family:'Oswald',sans-serif;font-weight:500;}
  .lead{margin-top:26px;font-size:13px;color:#3d3a33;line-height:2.3;text-align:center;}
  /* ── terms rows ── */
  .terms{margin-top:34px;}
  .terms .row{padding:26px 0;border-bottom:1px solid var(--line);}
  .terms .row:last-child{border-bottom:none;}
  .terms h3{font-family:'Shippori Mincho',serif;font-size:15px;font-weight:600;letter-spacing:.12em;color:var(--ink);}
  body.en .terms h3{font-family:'Oswald',sans-serif;font-weight:500;}
  .terms h3 span{color:var(--bd);margin-right:12px;font-size:12px;}
  .terms p{font-size:12.5px;color:var(--sub);margin-top:8px;line-height:2.1;}
  .terms p b{color:var(--ink);font-weight:700;}
  /* 평균 금액 참고 박스 */
  .avg{margin-top:12px;border:1px solid var(--line);background:#fff;padding:14px 18px;display:flex;justify-content:space-between;align-items:baseline;gap:12px;}
  .avg .k{font-size:11px;color:#9a9486;letter-spacing:.14em;}
  .avg .v{font-family:'Shippori Mincho',serif;font-size:16px;font-weight:600;color:var(--bd);letter-spacing:.06em;white-space:nowrap;}
  body.en .avg .v{font-family:'Oswald',sans-serif;font-weight:500;}
  .avgnote{font-size:10.5px;color:#b5afa2;margin-top:8px;letter-spacing:.06em;line-height:1.9;}
  /* ── CTA ── */
  .cta{display:block;margin:0 auto;max-width:360px;text-align:center;border:1px solid var(--bd);color:var(--bd);text-decoration:none;padding:15px 20px;font-size:12.5px;letter-spacing:.18em;font-weight:600;background:#fff;}
  /* ── footer ── */
  footer{padding:66px 0 90px;text-align:center;border-top:1px solid var(--line);}
  footer .brand{font-family:'Shippori Mincho',serif;font-size:12px;letter-spacing:.5em;color:var(--bd);font-weight:600;text-indent:.5em;}
  body.en footer .brand{font-family:'Oswald',sans-serif;}
  footer .c{font-size:11px;color:var(--sub);margin-top:18px;letter-spacing:.12em;line-height:2.2;}
  /* ── 게이트(무효 코드/로딩) ── */
  #gate{min-height:100vh;display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;padding:0 32px;}
  #gate .brand{font-family:'Shippori Mincho',serif;font-size:14px;letter-spacing:.55em;color:var(--bd);font-weight:600;text-indent:.55em;}
  #gate .msg{margin-top:26px;font-size:12.5px;color:var(--sub);letter-spacing:.1em;line-height:2.3;}
  #page{display:none;}
</style>
</head>
<body>

<!-- 로딩 / 무효 코드 게이트 -->
<div id="gate">
  <div class="brand">T A A M</div>
  <div class="msg" id="gateMsg">…</div>
</div>

<!-- 본문 (유효 코드일 때만 표시) -->
<div id="page">

  <div class="hero wrap">
    <div class="brand">T A A M</div>
    <div class="to" id="heroTo"></div>
    <div class="rest" id="heroRest"></div>
    <p class="sub" id="heroSub"></p>
    <div class="hr"></div>
  </div>

  <section>
    <div class="wrap">
      <div class="lbl">OUR TERMS</div>
      <h2 id="termsTitle"></h2>
      <p class="lead" id="termsLead"></p>

      <div class="terms">

        <div class="row">
          <h3><span>01</span><span id="t1h"></span></h3>
          <p id="t1p"></p>
          <div class="avg">
            <div class="k" id="t1ak"></div>
            <div class="v">&yen;30,000 &ndash; &yen;50,000</div>
          </div>
          <div class="avgnote" id="t1note"></div>
        </div>

        <div class="row">
          <h3><span>02</span><span id="t2h"></span></h3>
          <p id="t2p"></p>
          <div class="avg">
            <div class="k" id="t2ak"></div>
            <div class="v">&yen;10,000 &ndash; &yen;15,000</div>
          </div>
          <div class="avgnote" id="t2note"></div>
        </div>

        <div class="row">
          <h3><span>03</span><span id="t3h"></span></h3>
          <p id="t3p"></p>
        </div>

        <div class="row">
          <h3><span>04</span><span id="t4h"></span></h3>
          <p id="t4p"></p>
        </div>

      </div>
    </div>
  </section>

  <section>
    <div class="wrap">
      <a class="cta" id="ctaFull" href="jp.html"></a>
    </div>
  </section>

  <footer>
    <div class="brand">T A A M</div>
    <p class="c">Exclusive Dining Membership — Seoul &middot; Tokyo<br>taam-app.vercel.app</p>
  </footer>

</div>

<script>
(function(){
  var SUPABASE_URL = 'https://edfsmzbcixfnqabrsvut.supabase.co';
  var SUPABASE_KEY = 'sb_publishable_NlJp3lRtSVvkgFGRBesoog_q4XlGEPC';

  // ── 문구 사전 (ja / en) ──
  var TXT = {
    ja: {
      loading: '確認しています…',
      invalid: 'このページは、ご招待した<br>パートナーレストラン専用です。',
      toChef: function(chef, rest){ return chef ? chef + ' 様' : rest + ' 御中'; },
      heroSub: 'TAAM より、パートナーシップのご提案を<br>お届けいたします。',
      termsTitle: 'ご提案条件',
      termsLead: '貴店にお決めいただくのは、次の二点のみです。<br>ご参考までに、一般的な平均額を併記いたします。',
      t1h: 'お食事代（コース価格）',
      t1p: '<b>貴店が自由にお決めください。</b>通常の価格のままで結構です。値引きのお願いは一切ございません。',
      t1ak: 'ディナー平均（お一人様・参考値）',
      t1note: '※ 特定店の価格ではなく、パートナー店全体の一般的な平均レンジです。',
      t2h: 'お飲み物の最低注文金額',
      t2p: '会員一人あたりの<b>最低ドリンク注文額</b>を設定いただけます。設定なしでも構いません。',
      t2ak: '設定平均（お一人様・参考値）',
      t2note: '※ こちらも一般的な平均レンジです。貴店のスタイルに合わせてご自由に。',
      t3h: 'お支払い方法',
      t3p: '<b>各ゲストが当日、貴店にて直接お支払い</b>いたします。TAAM を介した決済・送客手数料・売上からの控除は一切ございません。売上は100%貴店のものです。',
      t4h: 'キャンセル・最低保証',
      t4p: '会員は入会時に<b>預託金（デポジット）</b>を預けています。キャンセルが発生した場合は<b>貴店のキャンセル規定に従い</b>、会員の預託金からキャンセル料を充当します。ノーショー・直前キャンセルの場合も、貴店の損失が出ないよう TAAM が保証いたします。',
      cta: '詳しいご案内を見る →',
      ctaHref: 'jp.html'
    },
    en: {
      loading: 'Verifying…',
      invalid: 'This page is reserved for<br>invited partner restaurants.',
      toChef: function(chef, rest){ return chef ? 'Dear Chef ' + chef : 'Dear ' + rest; },
      heroSub: 'A partnership proposal from TAAM,<br>prepared exclusively for you.',
      termsTitle: 'OUR TERMS',
      termsLead: 'Only two things are up to you.<br>Average figures are shown for easy reference.',
      t1h: 'DINING FEE (COURSE PRICE)',
      t1p: '<b>Entirely your decision.</b> Your regular pricing stands — we never ask for discounts.',
      t1ak: 'Average dinner budget (per guest, reference)',
      t1note: '* A general average range across partner restaurants — not any specific venue.',
      t2h: 'MINIMUM BEVERAGE ORDER',
      t2p: 'You may set a <b>minimum drink order per guest</b> — or none at all.',
      t2ak: 'Common setting (per guest, reference)',
      t2note: '* Also a general average range. Set it to suit your style.',
      t3h: 'PAYMENT',
      t3p: '<b>Each guest pays you directly, on site, on the day.</b> No payments through TAAM, no commission, no deduction from your revenue. Sales are 100% yours.',
      t4h: 'CANCELLATION & GUARANTEE',
      t4p: 'Every member holds a <b>pre-paid deposit</b> with TAAM. If a cancellation occurs, the cancellation fee is covered from the member’s deposit, <b>following your house policy</b>. In case of no-show or last-minute cancellation, TAAM guarantees your loss is covered.',
      cta: 'VIEW FULL PROPOSAL →',
      ctaHref: 'en.html'
    }
  };

  function $(id){ return document.getElementById(id); }

  function render(lang, chef, rest){
    var T = TXT[lang] || TXT.ja;
    if(lang === 'en'){ document.body.className = 'en'; document.documentElement.lang = 'en'; }
    $('heroTo').textContent = T.toChef(chef, rest);
    $('heroRest').textContent = rest;
    $('heroSub').innerHTML = T.heroSub;
    $('termsTitle').textContent = T.termsTitle;
    $('termsLead').innerHTML = T.termsLead;
    $('t1h').textContent = T.t1h; $('t1p').innerHTML = T.t1p; $('t1ak').textContent = T.t1ak; $('t1note').textContent = T.t1note;
    $('t2h').textContent = T.t2h; $('t2p').innerHTML = T.t2p; $('t2ak').textContent = T.t2ak; $('t2note').textContent = T.t2note;
    $('t3h').textContent = T.t3h; $('t3p').innerHTML = T.t3p;
    $('t4h').textContent = T.t4h; $('t4p').innerHTML = T.t4p;
    var cta = $('ctaFull'); cta.textContent = T.cta; cta.href = T.ctaHref;
    $('gate').style.display = 'none';
    $('page').style.display = 'block';
  }

  function showGate(html){ $('gateMsg').innerHTML = html; }

  var params = new URLSearchParams(location.search);
  var code = (params.get('c') || '').trim();
  var preview = params.get('preview') === '1';   // 슈퍼어드민 미리보기 — 열람 기록 안 남김

  showGate(TXT.ja.loading);

  if(!code){
    showGate(TXT.ja.invalid + '<br><br>' + TXT.en.invalid);
  } else {
    fetch(SUPABASE_URL + '/rest/v1/rpc/partner_qr_lookup', {
      method: 'POST',
      headers: {
        'apikey': SUPABASE_KEY,
        'Authorization': 'Bearer ' + SUPABASE_KEY,
        'Content-Type': 'application/json'
      },
      body: JSON.stringify({ p_code: code, p_ua: navigator.userAgent, p_log: !preview })
    })
    .then(function(r){ return r.json(); })
    .then(function(d){
      if(d && d.ok){
        render(d.lang === 'en' ? 'en' : 'ja', d.chef_name || '', d.restaurant_name || '');
      } else {
        showGate(TXT.ja.invalid + '<br><br>' + TXT.en.invalid);
      }
    })
    .catch(function(){
      showGate('通信エラーが発生しました。<br>Please try again later.');
    });
  }
})();
</script>

</body>
</html>
