<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=6, user-scalable=yes">
<meta name="robots" content="noindex">
<title>TAAM — Partnership Proposal</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Shippori+Mincho:wght@400;500;600;700&family=Noto+Sans+JP:wght@300;400;500;700&family=Noto+Sans+KR:wght@300;400;500;700&family=Oswald:wght@300;400;500;600&display=swap" rel="stylesheet">
<style>
  :root{ --bg:#FBFAF7; --ink:#1a1a18; --sub:#6b665c; --line:#E5E0D6; --bd:#5C0A14; --gold:#A98B4F; }
  *{margin:0;padding:0;box-sizing:border-box;}
  html{-webkit-text-size-adjust:100%;}
  body{background:var(--bg);color:var(--ink);font-family:'Noto Sans JP',sans-serif;font-weight:400;line-height:2;letter-spacing:.04em;}
  .serif{font-family:'Shippori Mincho',serif;}
  body.en{font-family:-apple-system,'Helvetica Neue',Arial,sans-serif;letter-spacing:.02em;}
  body.en .serif{font-family:'Oswald',sans-serif;letter-spacing:.12em;}
  body.ko{font-family:'Noto Sans KR',sans-serif;letter-spacing:.01em;word-break:keep-all;overflow-wrap:break-word;}
  /* 문장이 어중간하게 잘리지 않게 — 브라우저가 가독성 좋게 줄바꿈 배분 */
  .lead, .terms p, .qual .d, .hero .sub{text-wrap:pretty;}
  /* 문장을 하나씩 딱딱 떨어지게 (각 문장 = 한 블록) */
  .lead .ln, .terms p .ln{display:block;}
  .lead .ln + .ln, .terms p .ln + .ln{margin-top:8px;}
  body.ko .serif, body.ko .hero .to, body.ko h2, body.ko .terms h3,
  body.ko .hero .brand, body.ko footer .brand{font-family:'Noto Sans KR',sans-serif;}
  body.ko .hero .to, body.ko h2{font-weight:700;}
  .wrap{max-width:640px;margin:0 auto;padding:0 28px;}
  /* ── hero ── */
  .hero{padding:88px 0 58px;text-align:center;}
  .hero .brand{font-family:'Shippori Mincho',serif;font-size:13px;letter-spacing:.55em;color:var(--bd);font-weight:600;text-indent:.55em;}
  body.en .hero .brand{font-family:'Oswald',sans-serif;}
  .hero .to{font-family:'Shippori Mincho',serif;font-size:clamp(22px,6.4vw,32px);font-weight:600;letter-spacing:.14em;text-indent:.14em;margin-top:36px;line-height:1.9;}
  body.en .hero .to{font-family:'Oswald',sans-serif;font-weight:500;}
  .hero .rest{margin-top:10px;font-size:13px;color:var(--sub);letter-spacing:.14em;text-indent:.14em;}
  .hero .sub{margin-top:24px;font-size:12.5px;color:var(--sub);letter-spacing:.1em;text-indent:.1em;line-height:2.3;}
  .hr{width:36px;height:1px;background:var(--bd);margin:36px auto 0;}
  /* ── section ── */
  section{padding:52px 0;border-top:1px solid var(--line);}
  .lbl{font-size:10.5px;letter-spacing:.45em;color:var(--gold);font-weight:500;text-indent:.45em;text-align:center;}
  h2{font-family:'Shippori Mincho',serif;font-size:20px;font-weight:600;letter-spacing:.18em;text-indent:.18em;text-align:center;margin-top:14px;}
  body.en h2{font-family:'Oswald',sans-serif;font-weight:500;}
  .lead{margin-top:26px;font-size:13px;color:#3d3a33;line-height:2.3;}
  .lead b{font-weight:700;color:var(--bd);font-size:1.06em;white-space:nowrap;}
  /* ── member conditions ── */
  .qual{margin-top:30px;border:1px solid var(--line);background:#fff;}
  .qual li{list-style:none;display:flex;gap:15px;align-items:flex-start;padding:18px 22px;border-bottom:1px solid var(--line);}
  .qual li:last-child{border-bottom:none;}
  .qual .no{font-family:'Shippori Mincho',serif;font-size:12px;color:var(--bd);letter-spacing:.1em;padding-top:3px;flex-shrink:0;}
  body.en .qual .no{font-family:'Oswald',sans-serif;}
  .qual .t{font-size:13px;font-weight:700;letter-spacing:.06em;}
  .qual .d{font-size:11.5px;color:var(--sub);margin-top:3px;line-height:1.9;}
  /* 약속 아래 딸린 상세 — 종전 「모시는 고객」·「제안 조건」에 흩어져 있던 것들.
     약속이 선언, 이것이 그 근거다. 들여쓰기 한 단으로 층을 만든다. */
  .qual .sub{margin-top:11px;border-left:1px solid var(--line);padding-left:13px;}
  .qual .sub .s{margin-top:9px;}
  .qual .sub .s:first-child{margin-top:0;}
  .qual .sub .st{font-size:11.5px;font-weight:700;letter-spacing:.04em;color:#3d3a33;}
  .qual .sub .sd{font-size:11px;color:var(--sub);margin-top:2px;line-height:1.85;}
  /* ⚠ sb() 가 문장마다 넣는 span 은 블록으로 만들어야 한다. 안 그러면
     「…합니다.TAAM은…」 처럼 마침표 뒤가 붙어 버린다.
     .smpl .ln 은 별개다 — .sub 안이 아니라서 안 걸린다. */
  .qual .sub .sd .ln{display:block;}
  .qual .sub .sd .ln + .ln{margin-top:5px;}
  .qual .sub .sd b{color:var(--ink);font-weight:700;}

  /* ── 貸切 게스트 시트 견본 ──────────────────────────────
     실제 화면(/sheet)과 같아 보여야 한다. 매장이 「이런 게 온다」를
     눈으로 알아야 약속 ③(정보는 미리)이 말이 된다.
     ⚠ 이미지가 아니라 마크업이다 — 3개 국어로 갈리고, 확대해도 안 깨진다. */
  .smpl{margin-top:13px;background:#F6F6F7;border:1px solid #E6E6EA;border-radius:12px;
    padding:14px 15px;font-family:'Noto Sans JP',sans-serif;color:#16161A;line-height:1.7;}
  .smpl .cap{font-size:9.5px;letter-spacing:.28em;color:#9A9AA4;text-align:center;
    margin-bottom:11px;text-indent:.28em;}
  .smpl .top{display:flex;align-items:baseline;gap:8px;}
  .smpl .wm{font-family:'Shippori Mincho',serif;font-weight:700;font-size:13px;
    letter-spacing:.24em;color:#7A1B2B;line-height:1;}
  .smpl .kind{margin-left:auto;font-size:9.5px;color:#9A9AA4;}
  .smpl .date{margin-top:8px;font-size:15px;font-weight:700;letter-spacing:-.01em;
    font-variant-numeric:tabular-nums;line-height:1.4;}
  .smpl .venue{font-size:10.5px;color:#61616B;}
  .smpl .pills{margin-top:9px;display:flex;flex-wrap:wrap;gap:5px;}
  .smpl .pill{border-radius:999px;font-size:9.5px;font-weight:500;padding:3px 9px;white-space:nowrap;}
  .smpl .pill.a{background:#E8EFF9;color:#2C5AA0;}
  .smpl .pill.b{background:#E6F2EA;color:#2C6B47;}
  .smpl .teams{margin-top:10px;display:grid;gap:7px;}
  .smpl .card{background:#fff;border:1px solid #E6E6EA;border-radius:9px;padding:10px 12px;}
  .smpl .hd{display:flex;align-items:baseline;gap:6px;flex-wrap:wrap;}
  .smpl .grp{font-size:11.5px;font-weight:700;}
  .smpl .host{font-size:11px;color:#9A9AA4;}
  .smpl .visit{margin-left:auto;font-size:10px;font-weight:500;color:#2C5AA0;white-space:nowrap;}
  .smpl .visit.first{color:#9A9AA4;font-weight:400;}
  .smpl .ln{margin-top:4px;font-size:10.5px;color:#61616B;}
  .smpl .ln .amt{font-variant-numeric:tabular-nums;}
  .smpl .ln.warn{color:#9A5116;font-weight:500;}
  .smpl .foot{margin-top:11px;padding-top:9px;border-top:1px solid #E6E6EA;
    font-size:10px;color:#61616B;line-height:1.85;}
  .smpl .note{margin-top:8px;text-align:center;font-size:10px;color:#9A9AA4;}
  body.ko .smpl{font-family:'Noto Sans KR',sans-serif;}

  /* ── 유일한 부탁 ────────────────────────────────────────
     다섯 약속은 저희가 지키는 것이고, 이것 하나만 매장에 드리는 부탁이다.
     목록 안에 섞으면 여섯 번째 약속처럼 읽혀 무게가 사라진다 — 그래서
     밖으로 꺼내고, 앞에 한 줄을 놓아 숨을 고르게 한다. */
  .oneask{margin-top:34px;}
  .oneask .pre{text-align:center;font-family:'Shippori Mincho',serif;font-size:12px;
    letter-spacing:.16em;color:var(--sub);text-indent:.16em;}
  .oneask .box{margin-top:16px;border:1px solid var(--line);border-top:2px solid var(--bd);
    background:#fff;padding:22px 20px 20px;}
  .oneask .hd{display:flex;align-items:flex-start;gap:11px;}
  .oneask .no{font-family:'Shippori Mincho',serif;font-size:13px;color:var(--bd);
    letter-spacing:.08em;flex-shrink:0;padding-top:2px;}
  .oneask .t{font-family:'Shippori Mincho',serif;font-size:16px;font-weight:600;
    letter-spacing:.08em;line-height:1.6;flex:1;}
  .oneask .ic{width:19px;height:19px;flex-shrink:0;color:var(--sub);margin-top:2px;}
  .oneask .d{margin-top:12px;font-size:12.5px;color:#3d3a33;line-height:2.15;
    text-wrap:pretty;}
  body.ko .oneask .pre, body.ko .oneask .t{font-family:'Noto Sans KR',sans-serif;font-weight:700;}
  body.en .oneask .no{font-family:'Shippori Mincho',serif;}

  /* 약속 맺음말 — 목록 아래 한 줄. 서명처럼 읽히도록 본문보다 작고 조용하게 */
  .promise-foot{margin-top:30px;text-align:center;font-family:'Shippori Mincho',serif;
    font-size:13px;color:var(--bd);line-height:2.2;letter-spacing:.06em;text-wrap:pretty;}
  /* ⚠ 여기서 새 웹폰트를 부르지 않는다. 이 한 줄 때문에 폰트 요청이 하나
     늘면 첫 화면이 그만큼 늦어진다 — 이미 불러온 것 안에서 고른다. */
  body.en .promise-foot{font-family:'Oswald',sans-serif;font-size:12px;letter-spacing:.1em;}
  body.ko .promise-foot{font-family:'Noto Sans KR',sans-serif;}
  /* ── terms rows ── */
  .terms{margin-top:30px;}
  .terms .row{padding:22px 0;border-bottom:1px solid var(--line);}
  .terms .row:last-child{border-bottom:none;}
  .terms h3{font-family:'Shippori Mincho',serif;font-size:14.5px;font-weight:600;letter-spacing:.1em;color:var(--ink);}
  body.en .terms h3{font-family:'Oswald',sans-serif;font-weight:500;}
  .terms h3 span{color:var(--bd);margin-right:11px;font-size:12px;}

  /* ── 금전 예시 ──────────────────────────────────────────
     처음 보는 셰프에게 「프리미엄을 안 붙입니다」는 와닿지 않는다.
     숫자를 끝까지 세워서 **얼마가 들어오는지**를 보여준다. */
  .ex{margin-top:26px;border:1px solid var(--line);background:#fff;padding:20px 18px 18px;}
  .ex .cap{font-size:10px;letter-spacing:.34em;color:var(--gold);text-indent:.34em;text-align:center;}
  .ex .h{margin-top:9px;text-align:center;font-family:'Shippori Mincho',serif;
    font-size:14px;font-weight:600;letter-spacing:.08em;}
  body.ko .ex .h{font-family:'Noto Sans KR',sans-serif;font-weight:700;}
  body.en .ex .h{font-family:'Oswald',sans-serif;font-weight:500;}
  .ex .r{display:flex;align-items:baseline;gap:10px;padding:9px 0;border-bottom:1px solid #F2EFE8;
    font-size:12.5px;}
  .ex .r .l{color:#3d3a33;}
  .ex .r .q{color:var(--sub);font-size:11px;}
  .ex .r .v{margin-left:auto;font-variant-numeric:tabular-nums;white-space:nowrap;font-weight:500;}
  .ex .r.sum{border-bottom:none;border-top:1px solid var(--line);margin-top:2px;padding-top:12px;}
  .ex .r.sum .l{font-weight:700;color:var(--ink);}
  .ex .r.sum .v{font-weight:700;}
  .ex .r.tot{border-bottom:none;padding-top:12px;border-top:2px solid var(--bd);margin-top:2px;}
  .ex .r.tot .l{font-weight:700;color:var(--ink);}
  .ex .r.tot .v{font-weight:800;font-size:15px;color:var(--bd);}
  .ex .who{margin-top:3px;font-size:10.5px;color:var(--gold);line-height:1.7;}
  .ex .note{margin-top:14px;font-size:11px;color:var(--sub);line-height:1.95;}
  .ex .note b{color:var(--ink);font-weight:700;}
  .ex .note .n{display:block;}
  .ex .note .n + .n{margin-top:5px;}

  /* ── 「지금 정하지 않으셔도 됩니다」 ────────────────────
     승인 버튼만 있으면 「지금 결정하라」로 읽힌다. 그럴 자리가 아니다. */
  .later{margin-top:22px;border:1px dashed var(--line);background:#FCFBF8;padding:18px 16px;text-align:center;}
  .later .t{font-size:12.5px;font-weight:700;color:var(--ink);letter-spacing:.04em;}
  .later .d{margin-top:7px;font-size:11.5px;color:var(--sub);line-height:1.95;}
  .later .btns{margin-top:13px;display:flex;gap:8px;justify-content:center;flex-wrap:wrap;}
  .later .btns button{padding:9px 15px;border:1px solid var(--line);border-radius:999px;background:#fff;
    font-family:inherit;font-size:11.5px;color:#3d3a33;cursor:pointer;letter-spacing:.02em;}

  /* 승인 시트 안의 「이렇게 됩니다」 — 서명 전에 한 번 더 */
  .agsum{margin-top:14px;border:1px solid var(--line);background:#FCFBF8;padding:14px 15px;}
  .agsum .t{font-size:11.5px;font-weight:700;color:var(--ink);letter-spacing:.04em;}
  .agsum ol{margin:9px 0 0;padding-left:17px;}
  .agsum li{font-size:11.5px;color:var(--sub);line-height:1.9;margin-top:5px;}
  .agsum li b{color:var(--ink);font-weight:700;}
  .agsum .off{margin-top:11px;padding-top:10px;border-top:1px solid var(--line);
    font-size:11px;color:var(--sub);line-height:1.85;}
  .agsum .off b{color:var(--bd);font-weight:700;}
  .terms p{font-size:12.5px;color:var(--sub);margin-top:8px;line-height:2.05;}
  .terms p b{color:var(--bd);font-weight:700;font-size:1.06em;white-space:nowrap;}
  .terms .val{font-family:'Shippori Mincho',serif;font-size:16px;font-weight:600;color:var(--bd);letter-spacing:.04em;margin-top:6px;}
  body.en .terms .val{font-family:'Oswald',sans-serif;font-weight:500;}
  /* ── partner logos ── */
  .plogos{margin-top:28px;display:flex;flex-wrap:wrap;gap:12px 16px;justify-content:center;align-items:center;}
  .plogos .cell{height:51px;display:flex;align-items:center;justify-content:center;overflow:hidden;border-radius:8px;}
  .plogos .cell img{max-height:51px;max-width:138px;width:auto;object-fit:contain;border-radius:8px;}
  /* ── contact ── */
  .contact{margin-top:28px;display:flex;flex-direction:column;gap:12px;align-items:center;}
  .contact a, .contact button.cbtn{display:inline-flex;align-items:center;gap:10px;text-decoration:none;color:var(--ink);
    border:1px solid var(--line);background:#fff;border-radius:999px;padding:12px 24px;font-size:13px;font-weight:600;letter-spacing:.03em;min-width:240px;justify-content:center;
    font-family:inherit;cursor:pointer;}
  .contact a .ic, .contact button.cbtn .ic{font-size:15px;}
  .contact a.line{border-color:#06C755;color:#06934C;}
  .contact .chint{font-size:10.5px;color:#b5afa2;letter-spacing:.05em;margin-top:-4px;}
  /* ── partnership approval ── */
  .agcta{display:inline-block;border:1px solid var(--bd);background:var(--bd);color:#fff;padding:15px 34px;border-radius:999px;font-size:13px;font-weight:700;letter-spacing:.08em;cursor:pointer;font-family:inherit;}
  body.en .agcta{font-family:'Oswald',sans-serif;}
  #agModal{display:none;position:fixed;inset:0;z-index:120;background:rgba(20,10,10,.55);align-items:flex-end;justify-content:center;}
  #agModal .sheet{background:var(--bg);width:100%;max-width:560px;max-height:92vh;overflow-y:auto;-webkit-overflow-scrolling:touch;border-radius:20px 20px 0 0;padding:22px 24px calc(28px + env(safe-area-inset-bottom));}
  .agf label:not(.agchk){display:block;font-size:11px;color:var(--sub);margin:14px 0 5px;letter-spacing:.04em;}
  .agf input[type=text]{width:100%;box-sizing:border-box;padding:12px 14px;border:1px solid var(--line);border-radius:10px;background:#fff;font-size:14px;font-family:inherit;color:var(--ink);outline:none;}
  .agrow{display:flex;gap:10px;}
  .agrow .agcol{flex:1;min-width:0;}
  .agrow .agcol label{margin-top:14px;}
  .ag-done{text-align:center;font-size:14px;font-weight:800;color:var(--bd);margin-bottom:14px;letter-spacing:.02em;}
  .cert-actions{display:flex;gap:8px;margin-top:16px;}
  .cert-actions .agbtn{margin-top:0;flex:1;}
  .cert-linkbtn{flex:1;padding:15px;border:1px solid var(--line);border-radius:12px;background:#fff;color:var(--ink);font-size:12.5px;font-weight:700;cursor:pointer;font-family:inherit;}
  .agchk{display:flex;gap:9px;align-items:flex-start;margin-top:16px;font-size:12.5px;color:var(--ink);line-height:1.7;cursor:pointer;}
  .agchk input{margin-top:3px;width:18px;height:18px;flex-shrink:0;}
  .agdis{font-size:11px;color:var(--sub);line-height:1.9;margin-top:14px;background:#fff;border:1px solid var(--line);border-radius:10px;padding:12px 14px;}
  .agbtn{width:100%;margin-top:18px;padding:15px;border:none;border-radius:12px;background:var(--bd);color:#fff;font-size:14px;font-weight:800;cursor:pointer;font-family:inherit;}
  .agx{float:right;border:none;background:none;font-size:20px;color:#999;cursor:pointer;line-height:1;}
  /* 서명 패드 */
  .sigpad-wrap{position:relative;margin-top:6px;}
  .sigpad{width:100%;height:160px;border:1px solid var(--line);border-radius:12px;background:#fff;display:block;touch-action:none;cursor:crosshair;}
  .sigph{position:absolute;left:0;right:0;top:50%;transform:translateY(-50%);text-align:center;color:#cbc3b4;font-size:13px;pointer-events:none;letter-spacing:.04em;}
  .sigclear{position:absolute;top:9px;right:11px;border:1px solid var(--line);background:rgba(255,255,255,.92);color:#8a8478;font-size:11px;font-weight:700;padding:5px 11px;border-radius:8px;cursor:pointer;font-family:inherit;}
  /* ── 파트너십 증표 (두 주체 · 세로/가로 반응형) ── */
  .token{position:relative;background:linear-gradient(#fbfaf7,#f5f0e7);border:1px solid #e3dac7;border-radius:16px;padding:30px 26px 22px;box-shadow:0 12px 34px rgba(90,60,30,.13);}
  .tkx{display:flex;flex-direction:column;}
  .tkx-center{order:1;text-align:center;}
  .tk-brand{font-family:'Shippori Mincho',serif;font-size:14px;letter-spacing:.55em;text-indent:.55em;color:var(--bd);font-weight:600;}
  body.en .tk-brand{font-family:'Oswald',sans-serif;}
  .tk-lbl{font-size:9.5px;letter-spacing:.3em;text-indent:.3em;color:var(--gold);font-weight:600;margin-top:12px;}
  .tk-since{font-size:10px;letter-spacing:.22em;text-indent:.22em;color:var(--sub);margin-top:16px;}
  .tk-since .dot{color:var(--gold);margin:0 8px;}
  .tk-msg{font-family:'Shippori Mincho','Nanum Myeongjo',serif;font-size:12px;color:#5c554a;line-height:1.95;margin-top:16px;}
  .tk-msg .ln{display:block;}
  /* 두 주체 블록 */
  .tkx-parties{order:2;display:flex;gap:12px;margin-top:18px;border-top:1px solid #e3dac7;padding-top:18px;}
  .tkx-col{flex:1;min-width:0;display:flex;flex-direction:column;align-items:center;text-align:center;}
  .tk-rest{font-family:'Shippori Mincho','Nanum Myeongjo',serif;font-size:18px;font-weight:600;letter-spacing:.02em;color:var(--ink);line-height:1.35;}
  .tk-chef{font-size:11.5px;color:var(--sub);margin-top:4px;}
  .tk-sigbox{min-height:52px;display:flex;align-items:flex-end;justify-content:center;margin-top:8px;}
  .tk-sigbox img{max-width:150px;max-height:52px;width:auto;}
  .tk-tbrand{font-family:'Shippori Mincho',serif;font-size:19px;font-weight:600;letter-spacing:.3em;text-indent:.3em;color:var(--bd);}
  body.en .tk-tbrand{font-family:'Oswald',sans-serif;}

  function $(id){ return document.getElementById(id); }
  var _last = { lang:'ja', data:null };
  var _logosCache = null;   // partner_logos 직접 조회 결과(url 배열)

  function esc(s){ return (s||'').toString().replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;'); }

  // 문장 단위 블록화 — 각 문장을 한 줄(block)로 떨어뜨려 가독성 향상.
  //   문장 경계: 。(일본어) / .!?+공백(영·한). <b> 태그는 경계가 태그 밖에 있어 안전.
  function sb(html){
    if(!html) return '';
    var marked = html.replace(/。/g, '。').replace(/([.!?])(\s+)/g, '$1');
    var parts = marked.split('').map(function(s){ return s.trim(); }).filter(function(s){ return s.length; });
    if(parts.length <= 1) return html;
    return parts.map(function(s){ return '<span class="ln">' + s + '</span>'; }).join('');
  }

  // 貸切 게스트 시트 견본 — 실제로 매장에 가는 화면(/sheet)의 축소판.
  //   ⚠ 이미지가 아니라 마크업이다. 이미지로 두면 ① 언어를 못 바꾸고
  //     ② 확대하면 깨지고 ③ 실제 화면이 바뀌어도 그림만 옛것으로 남는다.
  //   ⚠ 금액은 「그 매장에서의 지난 회계」뿐이다 — 실제 시트와 같은 원칙이다.
  //     팀 확정액·청구액·환율은 견본에도 안 넣는다.
  function sampleHTML(T){
    var s = T.smpl; if(!s) return '';
    return '<div class="smpl">'
      + '<div class="cap">' + esc(s.cap) + '</div>'
      + '<div class="top"><span class="wm">TAAM</span><span class="kind">' + esc(s.kind) + '</span></div>'
      + '<div class="date">' + esc(s.date) + '</div>'
      + '<div class="venue">' + esc(s.venue) + '</div>'
      + '<div class="pills"><span class="pill a">' + esc(s.pillA) + '</span>'
      +   '<span class="pill b">' + esc(s.pillB) + '</span></div>'
      + '<div class="teams">' + s.teams.map(function(t){
          return '<div class="card">'
            + '<div class="hd"><span class="grp">' + esc(t.g) + '</span>'
            +   '<span class="host">' + esc(t.h) + '</span>'
            +   '<span class="visit' + (t.first ? ' first' : '') + '">' + esc(t.v) + '</span></div>'
            + '<div class="ln">' + t.l + '</div>'
            + '<div class="ln' + (t.warn ? ' warn' : '') + '">' + esc(t.a) + '</div>'
            + '</div>';
        }).join('') + '</div>'
      + '<div class="foot">' + s.foot + '</div>'
      + '<div class="note">' + esc(s.note) + '</div>'
      + '</div>';
  }

  // 파트너 로고 렌더 — 직접 조회 캐시 우선, 없으면 RPC 반환값(_last.data.logos) 폴백
  function renderPartners(lang){
    var T = TXT[lang] || TXT.ja;
    var logos = _logosCache;
    if(!logos) logos = (_last.data && _last.data.logos) || [];
    if(logos && logos.length){

  // 로고를 테이블에서 직접 공개 조회 (RPC 버전과 무관하게 확실히 표시)
  function loadLogos(){
    fetch(SUPABASE_URL + '/rest/v1/partner_logos?select=image_url,sort_order&order=sort_order.asc', {
      headers: { 'apikey': SUPABASE_KEY, 'Authorization': 'Bearer ' + SUPABASE_KEY }
    })
    .then(function(r){ return r.ok ? r.json() : null; })
    .then(function(rows){
      if(Array.isArray(rows)){
        _logosCache = rows.map(function(x){ return x && x.image_url; }).filter(Boolean);
        renderPartners(_last.lang);
      }
    })
    .catch(function(){ /* 실패 시 RPC 폴백 유지 */ });
  }

  function render(lang, data){

    //

    //     이제 약속이 선언이고, 그 근거를 바로 아래 붙인다 — 한 번만 말한다.
    //   ⚠ 옮기기만 했다. 번역문(T.mem·payP·cancelP·privateP)은 그대로 쓴다 —
    //     다시 쓰면 세 언어가 조금씩 어긋난다.
    var SUB = {
      0: T.mem,
      1: [{ t:T.payH, d:T.payP }, { t:T.cancelH, d:T.cancelP }],

    };
    $('promiseTitle').textContent = T.promiseTitle;
    $('promiseLead').textContent = T.promiseLead;
    $('promiseList').innerHTML = T.promise.map(function(m, i){
      var body = '<div class="t">' + esc(m.t) + '</div><div class="d">' + esc(m.d) + '</div>';
      if(SUB[i] && SUB[i].length){
        body += '<div class="sub">' + SUB[i].map(function(s){
          return '<div class="s"><div class="st">' + esc(s.t) + '</div><div class="sd">' + sb(s.d) + '</div></div>';
        }).join('') + '</div>';
      }
      // 견본은 ③(정보는 미리) 아래. 말로만 하면 무엇이 오는지 모른다.
      if(i === 2) body += sampleHTML(T);
      return '<li><div class="no">' + (nos[i]||(i+1)) + '</div><div>' + body + '</div></li>';
    }).join('');
    // 유일한 부탁 — 「저희가 하겠습니다」 다섯 뒤에, 「부탁드립니다」 하나.
    //   ↻ 는 「TAAM 으로 되돌려 보내 주십시오」를 그림 하나로 말한다.
    $('oneAsk').innerHTML =
      '<div class="pre">' + esc(T.ask.pre) + '</div>'
      + '<div class="box"><div class="hd">'
      +   '<span class="no">' + esc(T.ask.no) + '</span>'
      +   '<span class="t">' + esc(T.ask.t) + '</span>'
      +   '<svg class="ic" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.4" '
      +     'stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">'
      +     '<path d="M20 11a8 8 0 1 0-2.3 5.7"/><path d="M20 4v7h-7"/></svg>'
      + '</div><div class="d">' + esc(T.ask.d) + '</div></div>';

    $('promiseFoot').textContent = T.promiseFoot;
    $('termsTitle').textContent = T.termsTitle;
    $('termsLead').textContent = T.termsLead;
    var rows = '';
    // 식사 가격 — 매장이 기재한 값 (있을 때만)
    if(data.meal_price){
      rows += '<div class="row"><h3><span>—</span>' + esc(T.mealLabel) + '</h3><div class="val">' + esc(data.meal_price) + '</div></div>';
    }
    // 주류 — 항상 표준 문구(필수 주문 인지 + 협의 + 평균), 기재값 있으면 함께 표시
    var bevVal = data.beverage_price ? '<div class="val">' + esc(data.beverage_price) + '</div>' : '';
    rows += '<div class="row"><h3><span>—</span>' + T.bevH + '</h3>' + bevVal + '<p>' + sb(T.bevP) + '</p></div>';
    // ⚠ 결제·취소·대관 동석은 여기서 뺐다. 「우리의 약속」 ②·⑤ 아래로 갔다 —
    //   같은 내용을 두 번 읽히면 어느 쪽이 진짜 조건인지 흐려진다.
    //   이 섹션에는 **매장이 정하는 값**만 남긴다 (식사비·주류·기타).
    if(data.extra_note){
      rows += '<div class="row"><h3><span>—</span>' + esc(T.noteLabel) + '</h3><p>' + esc(data.extra_note).replace(/\n/g,'<br>') + '</p></div>';
    }
    $('termsRows').innerHTML = rows;

    // 금전 예시 — 숫자를 끝까지 세운다.
    //   ⚠ 「그래서 얼마가 들어오나」에 답하지 않으면 조건은 읽히지 않는다.
    //     선납분 · 현장 결제분 · 매장 수령 총액을 한 표에 놓는다.
    var X = T.ex;
    $('exBox').innerHTML =
      '<div class="cap">' + esc(X.cap) + '</div><div class="h">' + esc(X.h) + '</div>'
      + '<div style="margin-top:14px;">'
      + X.rows.map(function(r){
          return '<div class="r"><span class="l">' + esc(r.l) + '</span>'
               + '<span class="q">' + esc(r.q) + '</span>'
               + '<span class="v">' + esc(r.v) + '</span></div>'; }).join('')
      + '<div class="r sum"><span class="l">' + esc(X.sumL) + '</span>'
      +   '<span class="v">' + esc(X.sumV) + '</span></div>'
      + '<div class="who">' + esc(X.sumWho) + '</div>'
      + '<div class="r"><span class="l">' + esc(X.addL) + '</span>'
      +   '<span class="v">' + esc(X.addV) + '</span></div>'
      + '<div class="who">' + esc(X.addWho) + '</div>'
      + '<div class="r tot"><span class="l">' + esc(X.totL) + '</span>'
      +   '<span class="v">' + esc(X.totV) + '</span></div>'
      + '</div>'
      + '<div class="note">' + X.notes.map(function(n){
          return '<span class="n">· ' + n + '</span>'; }).join('') + '</div>';

    // 「지금 정하지 않으셔도 됩니다」 — 승인 버튼만 두면 강요로 읽힌다.
    var L = T.later;
    $('laterBox').innerHTML =
      '<div class="t">' + esc(L.t) + '</div><div class="d">' + L.d + '</div>'
      + '<div class="btns">'
      +   (CONTACT_LINE ? '<button type="button" onclick="laterLine()">' + esc(L.line) + '</button>' : '')
      // ⚠ .ce-txt 로 감싸야 copyEmail 이 「복사됨」을 보여준다. 없으면 눌러도
      //   아무 일도 안 일어난 것처럼 보인다 — 복사는 됐는데.
      +   '<button type="button" onclick="copyEmail(this)"><span class="ce-txt">' + esc(L.mail) + '</span></button>'
      + '</div>';

    // 파트너 로고 — 직접 읽은 캐시 우선, 없으면 RPC 반환값 폴백
    renderPartners(lang);

    // 파트너십 승인 CTA
    $('agCtaBtn').textContent = T.ag.cta;

    // 연락처 (이메일 항상, 라인은 링크 설정 시)
    $('contactTitle').textContent = T.contactTitle;
    $('contactLead').textContent = T.contactLead;
    var cbox = '';
    // 메일은 앱을 열지 않고 '탭하면 복사'만
    cbox += '<button type="button" class="cbtn" onclick="copyEmail(this)"><span class="ic">✉️</span><span class="ce-txt">' + esc(CONTACT_EMAIL) + '</span></button>';
    cbox += '<div class="chint">' + (lang==='ja'?'タップでコピー':(lang==='ko'?'탭하면 복사됩니다':'Tap to copy')) + '</div>';
    if(CONTACT_LINE){
      cbox += '<a class="line" href="' + esc(CONTACT_LINE) + '" target="_blank" rel="noopener"><span class="ic">💬</span>LINE · ' + esc(CONTACT_LINE_ID) + '</a>';
    }
    $('contactBox').innerHTML = cbox;

    _pvMark(lang);
    $('gate').style.display = 'none';
    $('page').style.display = 'block';
  }

  function showGate(html){ $('gateMsg').innerHTML = html; }

  // ── 미리보기 바 ──
  function _pvMark(lang){
    ['ja','en','ko'].forEach(function(l){
      var b = $('pvLang' + l.charAt(0).toUpperCase() + l.slice(1));
      if(b) b.className = (l === lang) ? 'on' : '';
    });

  // 메일 주소 복사 (메일 앱 안 열림)
  window.copyEmail = function(btn){
    var txtEl = btn.querySelector('.ce-txt');
    var orig = txtEl ? txtEl.textContent : CONTACT_EMAIL;
    function done(){
      if(!txtEl) return;
      var doneMsg = (_last.lang==='ja') ? 'コピーしました' : (_last.lang==='ko') ? '복사됨!' : 'Copied!';
      txtEl.textContent = doneMsg;
      setTimeout(function(){ txtEl.textContent = orig; }, 1400);
    }
    if(navigator.clipboard && navigator.clipboard.writeText){
      navigator.clipboard.writeText(CONTACT_EMAIL).then(done, done);
    } else {
      var ta = document.createElement('textarea'); ta.value = CONTACT_EMAIL;
      ta.style.position='fixed'; ta.style.opacity='0'; document.body.appendChild(ta);
      ta.select(); try{ document.execCommand('copy'); }catch(_e){} document.body.removeChild(ta);
      done();
    }
  };

  window.laterLine = function(){ if(CONTACT_LINE) window.open(CONTACT_LINE, '_blank', 'noopener'); };

  window.agOpen = function(){

  };

  // ── 서명 패드 (포인터 이벤트 · 저지연 · Apple Pencil coalesced) ──
  var _sig = { canvas:null, ctx:null, drawing:false, last:null, mid:null, dirty:false, bound:false };
  function sigInit(){
    var c = document.getElementById('agSigCanvas'); if(!c) return;
    _sig.canvas = c;
    var r = c.getBoundingClientRect();
    var dpr = window.devicePixelRatio || 1;
    c.width = Math.max(1, Math.round(r.width * dpr));
    c.height = Math.max(1, Math.round(r.height * dpr));
    var ctx = c.getContext('2d');
    ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
    ctx.lineWidth = 2.4; ctx.lineCap = 'round'; ctx.lineJoin = 'round'; ctx.strokeStyle = '#1a1a18';
    ctx.clearRect(0, 0, r.width, r.height);
    _sig.ctx = ctx; _sig.dirty = false;
    var ph = document.getElementById('agSigPh'); if(ph) ph.style.display = '';
    if(!_sig.bound){
      _sig.bound = true;
      c.addEventListener('pointerdown', sigDown);
      c.addEventListener('pointermove', sigMove);
      window.addEventListener('pointerup', sigUp);
      c.addEventListener('pointercancel', sigUp);
    }
  }
  function _sigPt(e){ var r = _sig.canvas.getBoundingClientRect(); return { x:e.clientX - r.left, y:e.clientY - r.top }; }
  function sigDown(e){
    e.preventDefault(); _sig.drawing = true;
    _sig.last = _sigPt(e); _sig.mid = null;
    var ph = document.getElementById('agSigPh'); if(ph) ph.style.display = 'none';
    try { _sig.canvas.setPointerCapture(e.pointerId); } catch(_e){}
  }
  function sigMove(e){
    if(!_sig.drawing) return; e.preventDefault();
    var evs = (typeof e.getCoalescedEvents === 'function') ? e.getCoalescedEvents() : null;
    if(evs && evs.length){ for(var i=0;i<evs.length;i++) _sigStroke(_sigPt(evs[i])); }
    else _sigStroke(_sigPt(e));
  }
  function _sigStroke(p){
    var ctx = _sig.ctx, a = _sig.last;
    var mid = { x:(a.x+p.x)/2, y:(a.y+p.y)/2 };
    ctx.beginPath();
    ctx.moveTo(_sig.mid ? _sig.mid.x : a.x, _sig.mid ? _sig.mid.y : a.y);
    ctx.quadraticCurveTo(a.x, a.y, mid.x, mid.y);
    ctx.stroke();
    _sig.last = p; _sig.mid = mid; _sig.dirty = true;
  }
  function sigUp(){ _sig.drawing = false; }
  window.sigClear = function(){
    if(!_sig.ctx || !_sig.canvas) return;
    var r = _sig.canvas.getBoundingClientRect();
    _sig.ctx.clearRect(0, 0, r.width, r.height);
    _sig.dirty = false;
    var ph = document.getElementById('agSigPh'); if(ph) ph.style.display = '';
  };
  function sigDataUrl(){ return _sig.dirty ? _sig.canvas.toDataURL('image/png') : ''; }
  window.agClose = function(){ $('agModal').style.display = 'none'; };

  // 증표 마크업 빌더 (모달 완료 화면 + 단독 증서 페이지 공용)
  //   두 주체 명확화: 좌=파트너(레스토랑·셰프·서명), 우=TAAM(로고·承 도장·대표)
  function tokenHTML(lang, d){
    var T = (TXT[lang] || TXT.ja).ag;
    var partnerName = d.name || d.chef || '';
    var sig = d.signature
      ? '<div class="tk-sigbox"><img src="' + esc(d.signature) + '" alt="signature"></div>'
      : '<div class="tk-sigbox"></div>';
    var partnerRole = 'PARTNER' + (partnerName ? ' · ' + esc(partnerName) : '');
    return '<div class="tkx">'
      +   '<div class="tkx-center">'
      +     '<div class="tk-brand">T A A M</div>'
      +     '<div class="tk-lbl">CERTIFICATE OF PARTNERSHIP</div>'
      +     '<div class="tk-since"><span class="dot">◦</span>SINCE ' + esc(d.since || '') + '<span class="dot">◦</span></div>'
      +     '<div class="tk-msg">' + sb(T.tokenMsg) + '</div>'
      +   '</div>'
      +   '<div class="tkx-parties">'
      +     '<div class="tkx-col tkx-partner">'
      +       '<div class="tk-rest">' + esc(d.restaurant || '—') + '</div>'
      +       (d.chef ? '<div class="tk-chef">' + esc(d.chef) + '</div>' : '')
      +       sig
      +       '<div class="tk-role">' + partnerRole + '</div>'
      +     '</div>'
      +     '<div class="tkx-col tkx-taam">'
      +       '<div class="tk-tbrand">TAAM</div>'
      +       '<div class="tk-seal">承</div>'
      +       '<div class="tk-role">' + esc(T.certRep.replace(/\s*:\s*/, ' ')) + '</div>'
      +     '</div>'
      +   '</div>'
      + '</div>'
      + _tokenDetail(T, d)
      + '<div class="tk-dis">' + esc(T.disclaimer) + '</div>';
  }
  // 협의 조건 상세 (평소 숨김 → '협의 조건 보기' 클릭 시 펼침)
  function _tokenDetail(T, d){
    if(!d.meal && !d.min) return '';
    var rows = '';
    if(d.meal){
      rows += '<div class="tk-drow"><span class="k">' + esc(T.mealLabel) + '</span><span class="v">' + esc(d.meal) + '</span></div>'
            + '<div class="tk-dnote">(' + esc(T.seasonNote) + ')</div>';
    }
    if(d.min){
      rows += '<div class="tk-drow"><span class="k">' + esc(T.minLabel) + '</span><span class="v">' + esc(d.min) + ' ' + esc(T.minSuffix) + '</span></div>';
    }
    return '<div class="tk-detwrap">'
      + '<button type="button" class="tk-dettoggle" onclick="tokDetail(this)">' + esc(T.detailToggle) + ' <span class="ar">▾</span></button>'
      + '<div class="tk-detbody" style="display:none;">' + rows + '</div>'
      + '</div>';
  }
  window.tokDetail = function(btn){
    var body = btn.parentNode.querySelector('.tk-detbody');
    var ar = btn.querySelector('.ar');
    var open = body.style.display !== 'none';
    body.style.display = open ? 'none' : 'block';
    if(ar) ar.textContent = open ? '▾' : '▴';
  };
  function _sinceStr(iso){ var d = iso ? new Date(iso) : new Date(); return d.getFullYear() + '.' + ('0'+(d.getMonth()+1)).slice(-2); }
  function _certUrl(id){ return location.origin + location.pathname + '?cert=' + id; }
  var _certShareUrl = '';

  window.agSubmit = function(){
    var T = (TXT[_last.lang] || TXT.ja).ag;
    var name = ($('agName').value || '').trim();
    if(!name){ alert(T.errName); return; }
    if(!$('agAgree').checked){ alert(T.errAgree); return; }
    var sig = sigDataUrl();
    if(!sig){ alert(T.errSign); return; }
    var rest = ($('agRest').value || '').trim();
    var chef = ($('agChef').value || '').trim();
    var meal = ($('agMeal').value || '').trim();
    var min = ($('agMin').value || '').trim();
    var btn = $('agSubmitBtn'); btn.disabled = true; btn.textContent = T.submitting;
    var params = new URLSearchParams(location.search);
    var code = (params.get('c') || '').trim();
    fetch(SUPABASE_URL + '/rest/v1/rpc/partner_agree', {
      method:'POST',
      headers:{ 'apikey':SUPABASE_KEY, 'Authorization':'Bearer '+SUPABASE_KEY, 'Content-Type':'application/json' },
      body: JSON.stringify({ p_code:code, p_restaurant:rest, p_chef:chef, p_name:name, p_ua:navigator.userAgent, p_signature:sig, p_min:min, p_meal:meal })
    })
    .then(function(r){ return r.json(); })
    .then(function(res){
      btn.disabled=false; btn.textContent=T.submit;
      agShowCert({ restaurant:rest, chef:chef, name:name, meal:meal, min:min, signature:sig, iso:(res && res.agreed_at) || null, id:(res && res.id) || null });
    })
    .catch(function(){ btn.disabled=false; btn.textContent=T.submit; agShowCert({ restaurant:rest, chef:chef, name:name, meal:meal, min:min, signature:sig, iso:null, id:null }); });
  };

  function agShowCert(d){
    var lang = _last.lang, T = (TXT[lang] || TXT.ja).ag;
    $('agCertToken').innerHTML = tokenHTML(lang, { restaurant:d.restaurant, chef:d.chef, name:d.name, meal:d.meal, min:d.min, signature:d.signature, since:_sinceStr(d.iso) });
    $('agDoneMsg').textContent = T.done;
    $('certShareBtn').textContent = T.shareBtn;
    $('certCopyBtn').textContent = T.copyBtn;
    $('certShareNote').textContent = d.id ? T.shareNote : '';
    _certShareUrl = d.id ? _certUrl(d.id) : '';
    $('certLink').textContent = _certShareUrl ? _certShareUrl.replace(/^https?:\/\//,'') : '';
    // id 가 없으면(저장 실패) 공유/복사 숨김
    var hasUrl = !!_certShareUrl;
    $('certShareBtn').style.display = hasUrl ? '' : 'none';
    $('certCopyBtn').style.display = hasUrl ? '' : 'none';
    $('certClose').textContent = T.close;
    $('agForm').style.display = 'none'; $('agCert').style.display = '';
    var sheet = document.querySelector('#agModal .sheet'); if(sheet) sheet.scrollTop = 0;
  }
  window.certShare = function(){
    var T = (TXT[_last.lang] || TXT.ja).ag;
    if(!_certShareUrl) return;
    if(navigator.share){
      navigator.share({ title:'TAAM Partnership', text:T.done, url:_certShareUrl }).catch(function(){});
    } else { certCopyLink(); }
  };
  window.certCopyLink = function(){
    var T = (TXT[_last.lang] || TXT.ja).ag;
    if(!_certShareUrl) return;
    var btn = $('certCopyBtn'), orig = btn.textContent;
    function done(){ btn.textContent = '✓ ' + T.copied; setTimeout(function(){ btn.textContent = orig; }, 1400); }
    if(navigator.clipboard && navigator.clipboard.writeText){ navigator.clipboard.writeText(_certShareUrl).then(done, done); }
    else { var ta=document.createElement('textarea'); ta.value=_certShareUrl; ta.style.position='fixed'; ta.style.opacity='0'; document.body.appendChild(ta); ta.select(); try{document.execCommand('copy');}catch(_e){} document.body.removeChild(ta); done(); }
  };
  window.certPageShare = function(){
    var url = location.href;
    if(navigator.share){ navigator.share({ title:'TAAM Partnership', url:url }).catch(function(){}); }
    else if(navigator.clipboard){ navigator.clipboard.writeText(url); var b=$('certPageShareBtn'); var o=b.textContent; b.textContent='✓'; setTimeout(function(){b.textContent=o;},1400); }
  };
  // ?cert=<id> — 완성된 증표 단독 조회 (양측이 각자 보관)
  function renderCertPage(id){
    var lang = _browserLang();
    fetch(SUPABASE_URL + '/rest/v1/rpc/partner_agreement_get', {
      method:'POST',
      headers:{ 'apikey':SUPABASE_KEY, 'Authorization':'Bearer '+SUPABASE_KEY, 'Content-Type':'application/json' },
      body: JSON.stringify({ p_id: parseInt(id,10) || 0 })
    })
    .then(function(r){ return r.json(); })
    .then(function(a){
      if(!a || !a.ok){ showGate(TXT.ja.invalid + '<br><br>' + TXT.en.invalid); return; }
      var T = (TXT[lang] || TXT.ja).ag;
      document.body.className = (lang==='en'?'en':(lang==='ko'?'ko':''));
      $('certPageToken').innerHTML = tokenHTML(lang, {
        restaurant:a.restaurant_name, chef:a.chef_name, name:a.signer_name,
        meal:a.agreed_meal, min:a.agreed_min, signature:a.signature_data, since:_sinceStr(a.agreed_at)
      });
      $('certPageNote').textContent = T.shareNote;
      $('certPageShareBtn').textContent = T.shareBtn;
      $('gate').style.display = 'none';
      $('certPage').style.display = 'block';
    })
    .catch(function(){ showGate('통신 오류 / Error'); });
  }
  window.pvSetLang = function(l){ if(_last.data) render(l, _last.data); };
  window.pvClose = function(){
    window.close();
    setTimeout(function(){
      if(history.length > 1) history.back();
      else location.href = 'https://taam-app.vercel.app/';
    }, 250);
  };

  var params = new URLSearchParams(location.search);
  var code = (params.get('c') || '').trim();
  var preview = params.get('preview') === '1';
  var generic = params.get('g') === '1';

  // 브라우저 언어로 기본값 (기본 QR용)
  function _browserLang(){
    var l = (navigator.language || 'ja').toLowerCase();
    if(l.indexOf('ko') === 0) return 'ko';
    if(l.indexOf('ja') === 0) return 'ja';
    return 'en';
  }

  // pvBar: 미리보기이거나 기본 QR(언어 전환용)이면 표시
  if(preview || generic){
    document.body.classList.add('pv');
    $('pvBar').style.display = 'block';
    // 기본 QR(실사용, 미리보기 아님)에서는 '미리보기' 태그·닫기 숨김 → 언어 버튼만
    if(generic && !preview){
      var tg = $('pvTag'); if(tg) tg.style.display = 'none';
      var cb = $('pvCloseBtn'); if(cb) cb.style.display = 'none';
    }
  }

  showGate(TXT.ja.loading);

  // ?cert=<id> — 완성된 증표 단독 조회 (제안서 문서 대신 증표만 표시)
  var certId = params.get('cert');
  if(certId){ renderCertPage(certId); return; }

  loadLogos();   // 로고는 페이지 코드와 독립적으로 직접 조회 → 확실히 하단에 표시

  if(generic){
    // 기본 QR — 이름·매장·금액 없이 기본 메시지만 (열람 기록 안 남김)
    fetch(SUPABASE_URL + '/rest/v1/rpc/partner_qr_lookup', {
      method: 'POST',
      headers: { 'apikey': SUPABASE_KEY, 'Authorization': 'Bearer ' + SUPABASE_KEY, 'Content-Type': 'application/json' },
      body: JSON.stringify({ p_code: 'GENERIC', p_log: false })
    })
    .then(function(r){ return r.json(); })
    .then(function(d){
      var data = (d && d.ok) ? d : { ok:true, generic:true, logos:[] };
      data.generic = true;
      render(_browserLang(), data);
    })
    .catch(function(){ render(_browserLang(), { generic:true, logos:[] }); });
  } else if(!code){
    showGate(TXT.ja.invalid + '<br><br>' + TXT.en.invalid);
  } else {
    fetch(SUPABASE_URL + '/rest/v1/rpc/partner_qr_lookup', {
      method: 'POST',
      headers: {
        'apikey': SUPABASE_KEY,
        'Authorization': 'Bearer ' + SUPABASE_KEY,
        'Content-Type': 'application/json'
      },
      body: JSON.stringify({ p_code: code, p_ua: navigator.userAgent, p_log: !preview })
    })
    .then(function(r){ return r.json(); })
    .then(function(d){
      if(d && d.ok){
        render(d.lang || 'ja', d);
      } else {
        showGate(TXT.ja.invalid + '<br><br>' + TXT.en.invalid);
      }
    })
    .catch(function(){
      showGate('通信エラーが発生しました。<br>Please try again later.');
    });
  }
})();
</script>

</body>
</html>
