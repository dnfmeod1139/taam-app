<meta charset="utf-8">

<link rel="preconnect" href="https://fonts.googleapis.com">

<style>
  :root{ --bg:#FBFAF7; --ink:#1a1a18; --sub:#6b665c; --line:#E5E0D6; --bd:#5C0A14; --gold:#A98B4F; }
  *{margin:0;padding:0;box-sizing:border-box;}
  html{-webkit-text-size-adjust:100%;}
  body{background:var(--bg);color:var(--ink);font-family:'Noto Sans JP',sans-serif;font-weight:400;line-height:2;letter-spacing:.04em;}
  .serif{font-family:'Shippori Mincho',serif;}
  body.en{font-family:-apple-system,'Helvetica Neue',Arial,sans-serif;letter-spacing:.02em;}
  body.en .serif{font-family:'Oswald',sans-serif;letter-spacing:.12em;}
  body.ko{font-family:'Noto Sans KR',sans-serif;letter-spacing:.01em;}
  body.ko .serif, body.ko .hero .to, body.ko h2, body.ko .terms h3,
  body.ko .hero .brand, body.ko footer .brand{font-family:'Noto Sans KR',sans-serif;}
  body.ko .hero .to, body.ko h2{font-weight:700;}
  .wrap{max-width:640px;margin:0 auto;padding:0 28px;}
  /* ── hero ── */
  .hero{padding:88px 0 58px;text-align:center;}
  .hero .brand{font-family:'Shippori Mincho',serif;font-size:13px;letter-spacing:.55em;color:var(--bd);font-weight:600;text-indent:.55em;}
  body.en .hero .brand{font-family:'Oswald',sans-serif;}
  .hero .to{font-family:'Shippori Mincho',serif;font-size:clamp(22px,6.4vw,32px);font-weight:600;letter-spacing:.14em;margin-top:36px;line-height:1.9;}
  body.en .hero .to{font-family:'Oswald',sans-serif;font-weight:500;}
  .hero .rest{margin-top:10px;font-size:13px;color:var(--sub);letter-spacing:.14em;}
  .hero .sub{margin-top:24px;font-size:12.5px;color:var(--sub);letter-spacing:.1em;line-height:2.3;}
  .hr{width:36px;height:1px;background:var(--bd);margin:36px auto 0;}
  /* ── section ── */
  section{padding:52px 0;border-top:1px solid var(--line);}
  .lbl{font-size:10.5px;letter-spacing:.45em;color:var(--gold);font-weight:500;text-indent:.45em;text-align:center;}
  h2{font-family:'Shippori Mincho',serif;font-size:20px;font-weight:600;letter-spacing:.18em;text-align:center;margin-top:14px;}
  body.en h2{font-family:'Oswald',sans-serif;font-weight:500;}
  .lead{margin-top:26px;font-size:13px;color:#3d3a33;line-height:2.3;}
  .lead b{font-weight:700;color:var(--ink);}
  /* ── member conditions ── */
  .qual{margin-top:30px;border:1px solid var(--line);background:#fff;}
  .qual li{list-style:none;display:flex;gap:15px;align-items:flex-start;padding:18px 22px;border-bottom:1px solid var(--line);}
  .qual li:last-child{border-bottom:none;}
  .qual .no{font-family:'Shippori Mincho',serif;font-size:12px;color:var(--bd);letter-spacing:.1em;padding-top:3px;flex-shrink:0;}
  body.en .qual .no{font-family:'Oswald',sans-serif;}
  .qual .t{font-size:13px;font-weight:700;letter-spacing:.06em;}
  .qual .d{font-size:11.5px;color:var(--sub);margin-top:3px;line-height:1.9;}
  /* ── terms rows ── */
  .terms{margin-top:30px;}
  .terms .row{padding:22px 0;border-bottom:1px solid var(--line);}
  .terms .row:last-child{border-bottom:none;}
  .terms h3{font-family:'Shippori Mincho',serif;font-size:14.5px;font-weight:600;letter-spacing:.1em;color:var(--ink);}
  body.en .terms h3{font-family:'Oswald',sans-serif;font-weight:500;}
  .terms h3 span{color:var(--bd);margin-right:11px;font-size:12px;}
  .terms p{font-size:12.5px;color:var(--sub);margin-top:8px;line-height:2.05;}
  .terms p b{color:var(--ink);font-weight:700;}
  .terms .val{font-family:'Shippori Mincho',serif;font-size:16px;font-weight:600;color:var(--bd);letter-spacing:.04em;margin-top:6px;}
  body.en .terms .val{font-family:'Oswald',sans-serif;font-weight:500;}
  /* ── partner logos ── */
  .plogos{margin-top:28px;display:flex;flex-wrap:wrap;gap:12px 16px;justify-content:center;align-items:center;}
  .plogos .cell{height:51px;display:flex;align-items:center;justify-content:center;overflow:hidden;border-radius:8px;}
  .plogos .cell img{max-height:51px;max-width:138px;width:auto;object-fit:contain;border-radius:8px;}
  /* ── contact ── */
  .contact{margin-top:28px;display:flex;flex-direction:column;gap:12px;align-items:center;}
  .contact a, .contact button.cbtn{display:inline-flex;align-items:center;gap:10px;text-decoration:none;color:var(--ink);
    border:1px solid var(--line);background:#fff;border-radius:999px;padding:12px 24px;font-size:13px;font-weight:600;letter-spacing:.03em;min-width:240px;justify-content:center;
    font-family:inherit;cursor:pointer;}
  .contact a .ic, .contact button.cbtn .ic{font-size:15px;}
  .contact a.line{border-color:#06C755;color:#06934C;}
  .contact .chint{font-size:10.5px;color:#b5afa2;letter-spacing:.05em;margin-top:-4px;}
  /* ── footer ── */
  footer{padding:64px 0 90px;text-align:center;border-top:1px solid var(--line);}
  footer .brand{font-family:'Shippori Mincho',serif;font-size:12px;letter-spacing:.5em;color:var(--bd);font-weight:600;text-indent:.5em;}
  body.en footer .brand{font-family:'Oswald',sans-serif;}
  footer .c{font-size:11px;color:var(--sub);margin-top:18px;letter-spacing:.12em;line-height:2.2;}
  /* ── gate ── */
  #gate{min-height:100vh;display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;padding:0 32px;}
  #gate .brand{font-family:'Shippori Mincho',serif;font-size:14px;letter-spacing:.55em;color:var(--bd);font-weight:600;text-indent:.55em;}
  #gate .msg{margin-top:26px;font-size:12.5px;color:var(--sub);letter-spacing:.1em;line-height:2.3;}
  #page{display:none;}
  /* ── preview bar (슈퍼어드민, preview=1) ── */
  #pvBar{display:none;position:fixed;top:0;left:0;right:0;z-index:99;background:#1a1a18;color:#fff;
    padding:10px 12px;padding-top:calc(10px + env(safe-area-inset-top));
    font-family:'Noto Sans KR',-apple-system,sans-serif;box-shadow:0 2px 10px rgba(0,0,0,.25);}
  #pvBar .inner{max-width:640px;margin:0 auto;display:flex;align-items:center;gap:8px;}
  #pvBar .tag{font-size:10.5px;color:#c8a96e;font-weight:700;letter-spacing:.08em;flex-shrink:0;}
  #pvBar .langs{display:flex;gap:4px;flex:1;justify-content:center;}
  #pvBar .langs button{padding:5px 10px;border:1px solid #4a4a45;border-radius:7px;background:transparent;
    color:#b5afa2;font-size:11px;font-weight:700;cursor:pointer;font-family:inherit;}
  #pvBar .langs button.on{background:#fff;color:#1a1a18;border-color:#fff;}
  #pvBar .close{flex-shrink:0;padding:6px 12px;border:none;border-radius:8px;background:#5C0A14;
    color:#fff;font-size:12px;font-weight:800;cursor:pointer;font-family:inherit;}
  body.pv #page, body.pv #gate{padding-top:52px;}
</style>
</head>
<body>

<!-- 미리보기 바 (preview=1 — 슈퍼어드민만) -->
<div id="pvBar">
  <div class="inner">
    <span class="tag" id="pvTag">미리보기</span>
    <div class="langs">
      <button id="pvLangJa" onclick="pvSetLang('ja')">日本語</button>
      <button id="pvLangEn" onclick="pvSetLang('en')">EN</button>
      <button id="pvLangKo" onclick="pvSetLang('ko')">한국어</button>
    </div>
    <button class="close" id="pvCloseBtn" onclick="pvClose()">✕ 닫기</button>
  </div>
</div>

<!-- 로딩 / 무효 코드 게이트 -->
<div id="gate">
  <div class="brand">T A A M</div>
  <div class="msg" id="gateMsg">…</div>
</div>

<!-- 본문 -->
<div id="page">

  <div class="hero wrap">
    <div class="brand">T A A M</div>
    <div class="to" id="heroTo"></div>
    <div class="rest" id="heroRest"></div>
    <p class="sub" id="heroSub"></p>
    <div class="hr"></div>
  </div>

    <div class="wrap">
      <div class="lbl">ABOUT</div>
      <h2 id="aboutTitle"></h2>
      <p class="lead" id="aboutBody"></p>
    </div>
  </section>

  <!-- 회원 조건 -->
  <section>
    <div class="wrap">
      <div class="lbl">OUR MEMBERS</div>
      <h2 id="memTitle"></h2>
      <p class="lead" id="memLead" style="text-align:center;"></p>
      <ul class="qual" id="memList"></ul>
    </div>
  </section>

  <!-- 제안 조건 -->
  <section>
    <div class="wrap">
      <div class="lbl">OUR TERMS</div>
      <h2 id="termsTitle"></h2>
      <p class="lead" id="termsLead" style="text-align:center;"></p>
      <div class="terms" id="termsRows"></div>
    </div>
  </section>

  <!-- 연락처 -->
  <section id="contactSec">
    <div class="wrap">
      <div class="lbl">CONTACT</div>
      <h2 id="contactTitle"></h2>
      <p class="lead" id="contactLead" style="text-align:center;"></p>
      <div class="contact" id="contactBox"></div>
    </div>
  </section>

  <!-- 함께하는 파트너 (로고) — 맨 하단 -->
  <section id="partnersSec" style="display:none;">
    <div class="wrap">
      <div class="lbl">PARTNERS</div>
      <h2 id="partnersTitle"></h2>
      <div class="plogos" id="partnersGrid"></div>
    </div>
  </section>

  <footer>
    <div class="brand">T A A M</div>
    <p class="c">Exclusive Dining Membership — Seoul &middot; Tokyo<br>taam-app.vercel.app</p>
  </footer>

</div>

  var _last = { lang:'ja', data:null };
  var _logosCache = null;   // partner_logos 직접 조회 결과(url 배열)

  function esc(s){ return (s||'').toString().replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;'); }

  // 파트너 로고 렌더 — 직접 조회 캐시 우선, 없으면 RPC 반환값(_last.data.logos) 폴백
  function renderPartners(lang){
    var T = TXT[lang] || TXT.ja;
    var logos = _logosCache;
    if(!logos) logos = (_last.data && _last.data.logos) || [];
    if(logos && logos.length){
      $('partnersTitle').textContent = T.partnersTitle;
      $('partnersGrid').innerHTML = logos.map(function(u){
        return '<div class="cell"><img src="' + esc(u) + '" alt="partner"></div>';
      }).join('');
      $('partnersSec').style.display = '';
    } else {
      $('partnersSec').style.display = 'none';
    }
  }

  // 로고를 테이블에서 직접 공개 조회 (RPC 버전과 무관하게 확실히 표시)
  function loadLogos(){
    fetch(SUPABASE_URL + '/rest/v1/partner_logos?select=image_url,sort_order&order=sort_order.asc', {
      headers: { 'apikey': SUPABASE_KEY, 'Authorization': 'Bearer ' + SUPABASE_KEY }
    })
    .then(function(r){ return r.ok ? r.json() : null; })
    .then(function(rows){
      if(Array.isArray(rows)){
        _logosCache = rows.map(function(x){ return x && x.image_url; }).filter(Boolean);
        renderPartners(_last.lang);
      }
    })
    .catch(function(){ /* 실패 시 RPC 폴백 유지 */ });
  }

  function render(lang, data){
    if(!TXT[lang]) lang = 'ja';
    var T = TXT[lang];
    _last = { lang:lang, data:data };
    var cls = (lang === 'en') ? 'en' : (lang === 'ko' ? 'ko' : '');
    if(document.body.classList.contains('pv')) cls = (cls ? cls + ' ' : '') + 'pv';
    document.body.className = cls;
    document.documentElement.lang = lang;

    var chef = data.chef_name || '', rest = data.restaurant_name || '';
    if(data.generic){
      $('heroTo').textContent = T.heroGeneric;
      $('heroRest').textContent = '';
    } else {
      $('heroTo').textContent = T.toChef(chef, rest);
      $('heroRest').textContent = rest;
    }
    $('heroSub').innerHTML = T.heroSub;

    $('aboutTitle').textContent = T.aboutTitle;
    $('aboutBody').innerHTML = T.aboutBody;

    $('memTitle').textContent = T.memTitle;
    $('memLead').textContent = T.memLead;
    var nos = ['壱','弐','参','肆','伍'];
    $('memList').innerHTML = T.mem.map(function(m, i){
      return '<li><div class="no">' + (nos[i]||(i+1)) + '</div><div><div class="t">' + esc(m.t) + '</div><div class="d">' + esc(m.d) + '</div></div></li>';
    }).join('');

    $('termsTitle').textContent = T.termsTitle;
    $('termsLead').textContent = T.termsLead;
    var rows = '';
    // 식사 가격 — 매장이 기재한 값 (있을 때만)
    if(data.meal_price){
      rows += '<div class="row"><h3><span>—</span>' + esc(T.mealLabel) + '</h3><div class="val">' + esc(data.meal_price) + '</div></div>';
    }
    // 주류 — 항상 표준 문구(필수 주문 인지 + 협의 + 평균), 기재값 있으면 함께 표시
    var bevVal = data.beverage_price ? '<div class="val">' + esc(data.beverage_price) + '</div>' : '';
    rows += '<div class="row"><h3><span>—</span>' + T.bevH + '</h3>' + bevVal + '<p>' + T.bevP + '</p></div>';
    // 표준 조건
    rows += '<div class="row"><h3><span>—</span>' + T.payH + '</h3><p>' + T.payP + '</p></div>';
    rows += '<div class="row"><h3><span>—</span>' + T.cancelH + '</h3><p>' + T.cancelP + '</p></div>';
    rows += '<div class="row"><h3><span>—</span>' + T.privateH + '</h3><p>' + T.privateP + '</p></div>';
    if(data.extra_note){
      rows += '<div class="row"><h3><span>—</span>' + esc(T.noteLabel) + '</h3><p>' + esc(data.extra_note).replace(/\n/g,'<br>') + '</p></div>';
    }
    $('termsRows').innerHTML = rows;

    // 파트너 로고 — 직접 읽은 캐시 우선, 없으면 RPC 반환값 폴백
    renderPartners(lang);

    // 연락처 (이메일 항상, 라인은 링크 설정 시)
    $('contactTitle').textContent = T.contactTitle;
    $('contactLead').textContent = T.contactLead;
    var cbox = '';
    // 메일은 앱을 열지 않고 '탭하면 복사'만
    cbox += '<button type="button" class="cbtn" onclick="copyEmail(this)"><span class="ic">✉️</span><span class="ce-txt">' + esc(CONTACT_EMAIL) + '</span></button>';
    cbox += '<div class="chint">' + (lang==='ja'?'タップでコピー':(lang==='ko'?'탭하면 복사됩니다':'Tap to copy')) + '</div>';
    if(CONTACT_LINE){
      cbox += '<a class="line" href="' + esc(CONTACT_LINE) + '" target="_blank" rel="noopener"><span class="ic">💬</span>LINE · ' + esc(CONTACT_LINE_ID) + '</a>';
    }
    $('contactBox').innerHTML = cbox;

    _pvMark(lang);
    $('gate').style.display = 'none';
    $('page').style.display = 'block';
  }

  function showGate(html){ $('gateMsg').innerHTML = html; }

  // ── 미리보기 바 ──
  function _pvMark(lang){
    ['ja','en','ko'].forEach(function(l){
      var b = $('pvLang' + l.charAt(0).toUpperCase() + l.slice(1));
      if(b) b.className = (l === lang) ? 'on' : '';
    });
  }
  // 메일 주소 복사 (메일 앱 안 열림)
  window.copyEmail = function(btn){
    var txtEl = btn.querySelector('.ce-txt');
    var orig = txtEl ? txtEl.textContent : CONTACT_EMAIL;
    function done(){
      if(!txtEl) return;
      var doneMsg = (_last.lang==='ja') ? 'コピーしました' : (_last.lang==='ko') ? '복사됨!' : 'Copied!';
      txtEl.textContent = doneMsg;
      setTimeout(function(){ txtEl.textContent = orig; }, 1400);
    }
    if(navigator.clipboard && navigator.clipboard.writeText){
      navigator.clipboard.writeText(CONTACT_EMAIL).then(done, done);
    } else {
      var ta = document.createElement('textarea'); ta.value = CONTACT_EMAIL;
      ta.style.position='fixed'; ta.style.opacity='0'; document.body.appendChild(ta);
      ta.select(); try{ document.execCommand('copy'); }catch(_e){} document.body.removeChild(ta);
      done();
    }
  };
  window.pvSetLang = function(l){ if(_last.data) render(l, _last.data); };
  window.pvClose = function(){
    window.close();
    setTimeout(function(){
      if(history.length > 1) history.back();
      else location.href = 'https://taam-app.vercel.app/';
    }, 250);
  };

  var params = new URLSearchParams(location.search);
  var code = (params.get('c') || '').trim();
  var preview = params.get('preview') === '1';
  var generic = params.get('g') === '1';

  // 브라우저 언어로 기본값 (기본 QR용)
  function _browserLang(){
    var l = (navigator.language || 'ja').toLowerCase();
    if(l.indexOf('ko') === 0) return 'ko';
    if(l.indexOf('ja') === 0) return 'ja';
    return 'en';
  }

  // pvBar: 미리보기이거나 기본 QR(언어 전환용)이면 표시
  if(preview || generic){
    document.body.classList.add('pv');
    $('pvBar').style.display = 'block';
    // 기본 QR(실사용, 미리보기 아님)에서는 '미리보기' 태그·닫기 숨김 → 언어 버튼만
    if(generic && !preview){
      var tg = $('pvTag'); if(tg) tg.style.display = 'none';
      var cb = $('pvCloseBtn'); if(cb) cb.style.display = 'none';
    }
  }

  showGate(TXT.ja.loading);
  loadLogos();   // 로고는 페이지 코드와 독립적으로 직접 조회 → 확실히 하단에 표시

  if(generic){
    // 기본 QR — 이름·매장·금액 없이 기본 메시지만 (열람 기록 안 남김)
    fetch(SUPABASE_URL + '/rest/v1/rpc/partner_qr_lookup', {
      method: 'POST',
      headers: { 'apikey': SUPABASE_KEY, 'Authorization': 'Bearer ' + SUPABASE_KEY, 'Content-Type': 'application/json' },
      body: JSON.stringify({ p_code: 'GENERIC', p_log: false })
    })
    .then(function(r){ return r.json(); })
    .then(function(d){
      var data = (d && d.ok) ? d : { ok:true, generic:true, logos:[] };
      data.generic = true;
      render(_browserLang(), data);
    })
    .catch(function(){ render(_browserLang(), { generic:true, logos:[] }); });
  } else if(!code){
    showGate(TXT.ja.invalid + '<br><br>' + TXT.en.invalid);
  } else {
    fetch(SUPABASE_URL + '/rest/v1/rpc/partner_qr_lookup', {
      method: 'POST',
      headers: {
        'apikey': SUPABASE_KEY,
        'Authorization': 'Bearer ' + SUPABASE_KEY,
        'Content-Type': 'application/json'
      },
      body: JSON.stringify({ p_code: code, p_ua: navigator.userAgent, p_log: !preview })
    })
    .then(function(r){ return r.json(); })
    .then(function(d){
      if(d && d.ok){
        render(d.lang || 'ja', d);
      } else {
        showGate(TXT.ja.invalid + '<br><br>' + TXT.en.invalid);
      }
    })
    .catch(function(){
      showGate('通信エラーが発生しました。<br>Please try again later.');
    });
  }
})();
</script>
