<!--
  ════════════════════════════════════════════════════════════════
  멤버십 오퍼 — 심사 통과 안내 (로그인 없음)
  ════════════════════════════════════════════════════════════════
  여기가 **가격이 처음 공개되는 곳**이다. 심사 신청 화면에는 금액이
  한 글자도 없다. 통과한 사람에게만, 토큰 링크로만 연다.

  금액은 이 페이지가 정하지 않는다
    taam_mship_offer_public() 이 **보낸 순간 박제된 금액**을 돌려준다.
    설정값이 나중에 바뀌어도 이 사람이 안내받은 숫자는 안 흔들린다.

  ⚠ 이 페이지는 전화번호를 받지 않는다. 서버가 성(姓)만 준다 —
    토큰을 아는 사람이 신청자의 번호까지 보게 할 이유가 없다.

  ⚠ [멤버십 시작하기] 는 **결제하지 않는다.** 「하겠다」와 희망 결제
    수단만 남기고, 담당자가 입금·카드 안내를 잇는다. 2단계 결제(가상계좌
    + 카드)를 이 페이지에 반쯤 만들어 두는 것보다, 안 만든 것이 낫다 —
    반쯤 된 결제는 돈이 어디까지 갔는지 아무도 모르게 만든다.

  ⚠ 이 페이지의 키는 공개(publishable) 키다. 시크릿이 아니다.
  ════════════════════════════════════════════════════════════════
-->

    var dep = parseInt(OF.deposit_amount, 10) || 0;
    var fc  = parseInt(OF.annual_fee_cash, 10) || 0;
    var fk  = parseInt(OF.annual_fee_card, 10) || 0;
    var totC = (dep && fc) ? dep + fc : 0;
    var totK = (dep && fk) ? dep + fk : 0;
    var fee  = (METHOD === 'card') ? fk : fc;
    var tot  = (METHOD === 'card') ? totK : totC;

    var h = '<div class="wordmark">TAAM</div>'
      + '<h1>' + t('h1') + '</h1>'
      + '<div class="lead">'
      +   (OF.surname ? t('lead').replace('{n}', esc(OF.surname) + (LANG === 'ko' ? '○' : ''))
                      : t('lead_x'))
      + '</div>';

    // 가격 — 고른 결제 수단의 총액을 크게, 다른 쪽은 작게
    h += '<div class="price"><div class="kind">' + t('kind') + '</div>'
       + '<div class="amt">' + (tot ? won(tot) : '—') + '</div>'
       + '<div class="amt2">'
       +   (METHOD === 'card'
            ? (t('by_card') + (totC ? ' · ' + t('by_cash') + ' ' + won(totC) : ''))
            : (t('by_cash') + (totK ? ' · ' + t('by_card') + ' ' + won(totK) : '')))
       + '</div>'
       + '<div class="seats">'
       +   (OF.seats_left != null ? t('seats').replace('{n}', OF.seats_left) : t('seats_x'))
       + '</div></div>';

    // 구성 — 퍼센트가 아니라 금액으로
    h += '<div class="grid">'
       + '<div class="b"><div class="k">' + t('dep') + '</div>'
       +   '<div class="v">' + (dep ? won(dep) : '—') + '</div>'
       +   '<div class="n">' + t('dep_n') + '</div></div>'
       + '<div class="b"><div class="k">' + t('fee') + '</div>'
       +   '<div class="v">' + (fee ? won(fee) : '—') + '</div>'
       +   '<div class="n">' + t('fee_n') + '</div></div>'
       + '</div>';

    h += '<h2>' + t('rules') + '</h2><div class="list">'
       + '<div class="r">' + t('r1') + '</div>'
       + '<div class="r">' + t('r2') + '</div>'
       + '<div class="r">' + t('r3') + '</div></div>';

    // 예약할 수 있는 곳 — 기본은 접혀 있다. 상호명만.
    h += '<h2>' + t('where') + '</h2><div class="acc">';
    VENUES.forEach(function(g, i){
      h += '<button class="hd" onclick="__acc(' + i + ')" aria-expanded="false" aria-controls="v' + i + '">'
         + '<span class="g">' + t(g[0]) + '</span>'
         + '<span class="c">' + t('cnt').replace('{n}', g[1].length) + '</span>'
         + '<span class="p">' + esc(g[1].slice(0, 2).join(' · ')) + '…</span></button>'
         + '<div class="bd" id="v' + i + '" hidden>' + esc(g[1].join(' · ')) + '</div>';
    });
    h += '</div>';

    h += '<h2>' + t('benefits') + '</h2><div class="list">'
       + '<div class="r">' + t('b1') + '</div>'
       + '<div class="r">' + t('b2') + '</div>'
       + '<div class="r">' + t('b3') + '</div></div>';

    h += '<h2>' + t('how') + '</h2><div class="seg">'
       + '<button class="' + (METHOD === 'cash' ? 'on' : '') + '" onclick="__m(\'cash\')">'
       +   t('by_cash') + '<span class="s">' + (totC ? won(totC) : '—') + '</span></button>'
       + '<button class="' + (METHOD === 'card' ? 'on' : '') + '" onclick="__m(\'card\')">'
       +   t('by_card') + '<span class="s">' + (totK ? won(totK) : '—') + '</span></button>'
       + '</div>'
       + '<div class="fine" style="text-align:left">' + t('fee_n2') + '</div>';

    h += '<button class="go" id="go" onclick="__go()"' + (BUSY ? ' disabled' : '') + '>'
       + (BUSY ? t('going') : t('go')) + '</button>'
       + '<div class="fine">'
       +   (OF.expires_at ? t('fine').replace('{d}', ymd(OF.expires_at)) : t('fine_x')) + '</div>'
       + langBar();

    document.getElementById('wrap').innerHTML = h;
  }

  window.__acc = function(i){
    var bd = document.getElementById('v' + i);
    if(!bd) return;
    var open = !bd.hidden;
    bd.hidden = open;
    var hd = bd.previousElementSibling;
    if(hd) hd.setAttribute('aria-expanded', String(!open));
  };
  window.__m = function(m){ METHOD = m; render(); };
  window.__go = async function(){
    if(BUSY || !OF) return;
    BUSY = true; render();
    try {
      await rpc('taam_mship_offer_accept', { p_token: TOKEN, p_method: METHOD });
      OF.done = true;
    } catch(e){
      alert(t('err_t') + '\n' + ((e && e.message) || ''));
    } finally { BUSY = false; render(); }
  };

  (async function(){
    LANG = pickLang();
    document.documentElement.lang = LANG;
    if(!TOKEN){ state('🔗', 'nf_t', 'nf_d'); return; }
    try {
      var r = await rpc('taam_mship_offer_public', { p_token: TOKEN });
      if(!r || !r.found){ state('🔗', 'nf_t', 'nf_d'); return; }
      if(r.blocked === 'expired'){ state('⏳', 'exp_t', 'exp_d'); return; }
      if(r.blocked === 'paid'){ state('✓', 'paid_t', 'paid_d'); return; }
      if(r.blocked){ state('·', 'gone_t', 'gone_d'); return; }
      OF = r;
      // 이미 「하겠다」를 누른 사람에게 같은 화면을 또 보여주지 않는다
      if(r.status === 'accepted') OF.done = true;
      render();
    } catch(e){ state('·', 'err_t', 'err_d'); }
  })();
})();
</script>
</body>
</html>
